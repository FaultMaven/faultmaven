# Dependabot configuration.
#
# This file exists for ONE narrow reason: to keep a release signal for
# `chromadb` after its twelve security alerts were dismissed.
#
# Four ChromaDB server advisories (GHSA-f4j7 / -36p7 / -2wm9 / -xph7) have no
# patched release — PyPI's newest chromadb *is* 1.5.9 and every vulnerable
# range runs through it. They are accepted and documented in
# docs/operations/security/vulnerability-exceptions.md ("chromadb"), and
# suppressed in the pip-audit gate by anchored GHSA id.
#
# The exception's original watch mechanism was the twelve open Dependabot
# alerts themselves: "do not dismiss them, they are how we learn a fix
# shipped". Twelve permanently-unfixable alerts are also how a genuinely NEW
# and actionable alert gets missed, so they were dismissed as tolerable risk —
# and Dependabot does not raise security PRs for dismissed alerts. This config
# is the replacement signal: a version update opens a PR when chromadb
# publishes anything newer, independent of alert state.
#
# Deliberately scoped to chromadb alone. This is not a general dependency-
# update policy; widening `allow` would bury the one signal it exists to carry.
#
# NOTE: requirements/*.txt are pip-compile OUTPUTS. A Dependabot PR here is a
# NOTIFICATION, not necessarily a mergeable change — regenerate the lockfiles
# properly and bump the `pyproject.toml` floor.
#
# This watch covers the CLIENT ONLY. The vulnerable artifact in production is
# the SERVER (ghcr.io/chroma-core/chroma), and it is not merely unwatched —
# there is nothing to watch: no image/tag/repository key exists in any tracked
# manifest in faultmaven-enterprise-infra. The running 1.0.10 is the chart's
# own default. See the exception entry's escalation triggers.
#
# CONVENTION — do not park PRs from this watch. 1.5.9 already exists and is
# inside all four vulnerable ranges, so the first run raises a
# `chromadb 1.5.8 -> 1.5.9` PR that is NOT a fix. Read it, then CLOSE it
# unmerged. A parked PR consumes a slot, and GitHub documents only that
# Dependabot "pauses creating new version update requests" once the limit is
# reached — it does not document supersession within one dependency, so a
# parked notification could mask a genuine later release. That is the same
# silent-stall this file exists to prevent, relocated to the PR list. The
# limit is 2 rather than 1 so a real release can still surface alongside a
# stale one; it is belt-and-braces, not a licence to park.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      # In practice only /requirements fires: pyproject.toml declares
      # `chromadb >= 0.5.3`, which every candidate already satisfies, so there
      # is nothing there for Dependabot to bump. Kept so the floor is covered
      # if it is ever tightened to a pin — but do not read this as two live
      # watch points.
      - "/"
      - "/requirements"  # cloud.txt, dev.txt, test.txt — the one that fires
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "chromadb"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"
