name: Performance Benchmarks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 2 AM UTC. This is the ABSOLUTE-target run (see the
    # nightly-absolute job) — the pull-request run asserts calibrated
    # budgets, so wall-clock against the product target needs a schedule of
    # its own to be asked anywhere.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full benchmark suite including slow tests'
        required: false
        default: 'false'
        type: boolean
      absolute_targets:
        description: 'Run the nightly ABSOLUTE-target job instead of the calibrated one'
        required: false
        default: false
        type: boolean

# Default-deny for the GITHUB_TOKEN. Two jobs override it with the writes
# they need to post their pull-request comment — `benchmarks` and
# `ab-regression`; `nightly-absolute` and `memory-benchmarks` only read.
permissions:
  contents: read

jobs:
  benchmarks:
    name: Run Performance Benchmarks
    # Calibrated budgets (#908). Skipped on the schedule, where
    # nightly-absolute answers the wall-clock question instead.
    if: github.event_name != 'schedule' && !inputs.absolute_targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Cleanup pip cache
        if: always()
        run: |
          # Free disk space by cleaning pip cache
          pip cache purge || true

      - name: Run benchmarks
        run: |
          # `pipefail` is REQUIRED, not decorative. Steps that do not set an
          # explicit `shell:` run under GitHub's implicit `bash -e {0}`, which
          # does NOT enable pipefail — so `pytest ... | tee` exits with tee's
          # status (always 0) and every benchmark failure is reported green.
          # That is how #770 shipped 18 red benchmarks unnoticed.
          set -o pipefail
          pytest tests/benchmarks/ \
            -m benchmark \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=benchmark_results.json \
            --no-cov \
            2>&1 | tee benchmark_output.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'

      # Every wall-clock test outside tests/benchmarks/ (#2090): all of
      # tests/performance/ and the real-timing growth checks, all marked
      # `performance`. The required jobs deselect them, so this step is where
      # they run on a pull request, against the calibrated budgets. Its own
      # `if`, so a red benchmark above does not skip it. `pytest tests/`
      # collects tests/performance/ before tests/unit/, the session order the
      # calibration fixtures in tests/unit/ci/ reason about.
      - name: Run wall-clock tests
        if: success() || failure()
        run: |
          set -o pipefail
          pytest tests/ \
            -m performance \
            --tb=short \
            -v \
            --no-cov \
            2>&1 | tee performance_output.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'
          # Row-level record for a re-anchor (#1910); see tests/wallclock/collect.py.
          FM_WALLCLOCK_RECORD: ${{ runner.temp }}/wallclock-rows/
          FM_WALLCLOCK_PROFILE: performance

      # `error` on no files: a run of the timed tests that recorded nothing is
      # the defect this artifact exists to catch (#1910).
      - name: Upload wall-clock rows (performance)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wallclock-rows-performance
          path: ${{ runner.temp }}/wallclock-rows/
          if-no-files-found: error
          retention-days: 90

      - name: Parse benchmark results
        if: always()
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # The calibration the budgets were scaled by (#908). Without it a
          # red run cannot be read as "slow runner" or "real regression"
          # without downloading an artifact, which is the habit that let a
          # 50%-flaky gate train everyone to treat red as noise.
          grep -h 'benchmark calibration:' benchmark_output.txt \
            >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Parse output for passed/failed tests
          grep -E "PASSED|FAILED" benchmark_output.txt | while read line; do
            if echo "$line" | grep -q "PASSED"; then
              echo "| $line | :white_check_mark: | Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $line | :x: | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done || echo "| No benchmark results | :warning: | Check logs |" >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            benchmark_output.txt
          retention-days: 90

      - name: Comment on PR with results
        # `always()` is required now that the run step can actually fail. A bare
        # `github.event_name == ...` carries GitHub's implicit `success()`, so
        # this step would be skipped exactly when benchmarks fail — making its
        # own "Failed Benchmarks" branch unreachable and hiding the detail at
        # the one moment it matters. Siblings above already use `always()`.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            let summary = 'Performance benchmarks completed.\n\n';

            try {
              const output = fs.readFileSync('benchmark_output.txt', 'utf8');
              // Split on real newlines. (A literal '\\n' here would leave the
              // whole file as a single "line", so one FAILED substring would
              // embed the entire output into the comment and blow past GitHub's
              // 65536-char body limit.)
              const lines = output.split('\n');

              // Count passed/failed
              const passed = lines.filter(l => l.includes('PASSED')).length;
              const failedLines = lines.filter(l => l.includes('FAILED'));

              summary += `**Results:** ${passed} passed, ${failedLines.length} failed\n\n`;

              if (failedLines.length > 0) {
                summary += '### Failed Benchmarks\n';
                failedLines.slice(0, 50).forEach(l => {
                  summary += `- ${l.trim()}\n`;
                });
                if (failedLines.length > 50) {
                  summary += `- …and ${failedLines.length - 50} more\n`;
                }
              }

              summary += '\nSee artifacts for detailed results.';
            } catch (error) {
              summary += 'Unable to parse results. Check workflow logs.';
            }

            // Defense in depth: GitHub rejects issue-comment bodies over 65536
            // chars — cap well under so the step can never 422 regardless of output.
            const MAX_BODY = 60000;
            if (summary.length > MAX_BODY) {
              summary = summary.slice(0, MAX_BODY) + '\n\n…output truncated (see artifacts).';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  nightly-absolute:
    name: Absolute Wall-Clock Targets (nightly)
    # The other half of #908. The pull-request job asserts budgets scaled by
    # an in-process calibration, which is what stops a below-median runner
    # reading as a regression. That correction is deliberately one-way, so
    # nothing on a pull request ever measures the raw product target any
    # more — this job does, once a night, where a red is a signal to read
    # rather than a merge to re-run. It gates no pull request by
    # construction: it only runs on the schedule (or on an explicit
    # dispatch).
    if: github.event_name == 'schedule' || inputs.absolute_targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run benchmarks against raw targets
        run: |
          # See the note on the benchmarks job: without pipefail the `| tee`
          # masks pytest's exit code and this gate never fails.
          set -o pipefail
          pytest tests/benchmarks/ \
            -m benchmark \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=benchmark_results_absolute.json \
            --no-cov \
            2>&1 | tee benchmark_output_absolute.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'
          # The one thing that makes this job different from the other one.
          FM_BENCHMARK_ABSOLUTE: '1'
          # Row-level record for a re-anchor (#1910); see tests/wallclock/collect.py.
          FM_WALLCLOCK_RECORD: ${{ runner.temp }}/wallclock-rows/
          FM_WALLCLOCK_PROFILE: nightly

      # ‼ tests/performance/ carries product targets too (#1557) and is
      # NOT marked `benchmark`, so the step above does not collect it. It
      # ran nowhere under absolute mode until this step existed, which
      # meant every `product_target` in tests/performance/budgets.py was
      # recorded and asserted by nothing — and the one real wall-clock
      # target among them (`logging_overhead < 0.05`) had been deleted
      # rather than relocated. Separate step because the two selections
      # cannot share one pytest invocation.
      - name: Run performance overhead against raw targets
        if: always()
        run: |
          set -o pipefail
          pytest tests/performance/ \
            --tb=short \
            -v \
            --json-report \
            --json-report-file=performance_results_absolute.json \
            --no-cov \
            2>&1 | tee performance_output_absolute.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'
          FM_BENCHMARK_ABSOLUTE: '1'
          # Row-level record for a re-anchor (#1910); see tests/wallclock/collect.py.
          FM_WALLCLOCK_RECORD: ${{ runner.temp }}/wallclock-rows/
          FM_WALLCLOCK_PROFILE: nightly

      - name: Upload absolute-target results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-absolute
          path: |
            benchmark_results_absolute.json
            benchmark_output_absolute.txt
            performance_results_absolute.json
            performance_output_absolute.txt
          retention-days: 90

      # A step of its own: a multi-path artifact is rooted at the paths' common
      # ancestor, which would re-nest the four files above (#1910).
      - name: Upload wall-clock rows (nightly)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wallclock-rows-nightly
          path: ${{ runner.temp }}/wallclock-rows/
          if-no-files-found: error
          retention-days: 90

  ab-regression:
    name: A/B Against the Merge Base
    # Pull requests only. The comparison needs two commits with a defined
    # relationship; a push to `main` has no "before" to check out, and the
    # schedule has nothing to compare at all.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      # ‼ The threshold, and the one place it lives.
      #
      # The gate is the MEDIAN of the 19 head/base ratios this suite
      # records: "did the data layer get slower overall". The number is
      # not 1.30 because the issue asks for 30%; it is 1.30 because of
      # null experiments — IDENTICAL code on both sides, so every ratio
      # measured is pure noise:
      #
      #   * a probe of this job's procedure on its own kind of runner
      #     (#1963, 2026-10-14, run 38538085168 of a throwaway branch):
      #     12 GitHub runners, each running the suite four times, base ==
      #     head. It is not this job: one checkout, no PYTHONPATH /
      #     AB_EXPECTED_ROOT, `-p no:cacheprovider`, and one install
      #     between the first two runs only. The median over 144
      #     same-runner ordered pairs ranged 0.950x up to the worst, which
      #     is `RUNNER_NULL_MAX_MEDIAN` in
      #     `tests/unit/ci/test_benchmark_ab.py`, and was red on 0 at every
      #     threshold from 1.15 up.
      #   * the 21 real runs of this job on pull requests since #1960
      #     (2026-10-12 to 2026-10-14): 0.956x-1.034x, inside the probe's
      #     range but off-centre (geometric mean 0.984, 18 of 21 below
      #     1.0), an offset toward head-faster that the probe did not
      #     reproduce.
      #   * a stress case (#1963): 24 runs on one development box at load
      #     average 22-50, 552 ordered pairs, 0.700x-1.428x, red at 1.30
      #     on 12 of 552 (most of the red pairs have one module, the 13-row
      #     one, slow while the other is not: a burst inside it alone moves
      #     the median; the load is a confound).
      #   * the original (#1567, 50 benchmarks, loaded box, 132 pairs):
      #     0.822x-1.216x, red on 0.
      #
      # Detection is probabilistic and is stated as such, because the
      # noise is on the same scale as the signal. Where the real gate sits
      # (those 21 medians, scaled as a uniform slowdown would scale them):
      #
      #     +30% -> red on  3 of 21     +35% -> red on 19 of 21
      #     +33% -> red on 12 of 21     +40% -> red on 21 of 21
      #
      # (the same injection into the stress case: +40% on 76%, +50% on
      # 87%, +60% on 94%. A cell where the injection equals the threshold
      # is 50% by construction — every pair is in the data in both
      # directions — so it says nothing.)
      # The absolute budgets next door need +146% for the same call, on
      # every runner, so this is where a uniform slowdown became
      # detectable at all rather than where it became certain. 1.25 and
      # 1.20 are also red on 0 of the probe's 144, but 1.25 is red on 22
      # of the stress case's 552; a step down is worth taking on
      # evidence, not now. The A/B job runs only on pull requests, so
      # `main` has no medians: every run prints its own, and the
      # `benchmark-ab` artifact keeps ab_report.json — re-anchor from ~20
      # green pull-request medians the way `tests/benchmarks/budgets.py`
      # was anchored from green `main` runs.
      #
      # The job always runs base first, so an earlier-versus-later
      # offset does not cancel. The probe measured none (geometric mean
      # of the median 0.9989 forward, 1.0011 reverse — one number and its
      # reciprocal); the real gate's head-faster offset above is not an
      # order effect the probe could confirm. Two batches on the loaded
      # box disagreed with each other (forward 0.999 and 1.072), so what
      # #1567 saw as an order offset was load.
      FM_AB_SUITE: '1.30'

      # ‼ `FM_AB_COUNT_RATIO` / `FM_AB_COUNT_MIN` are the SHADOW count rule
      # (#1989), reported on every gated comparison and not gating.
      #
      # Two more sensitive-looking rules were measured on #1567's null and
      # rejected by their own numbers (50 benchmarks, a loaded box): a
      # per-test residual and a count rule. #1989 re-adjudicated both on
      # the runner null above, plus the 24 A1-to-B1 / A2-to-B2 pairs and
      # the 21 real reports:
      #
      #   * the per-test residual (max of ratio / median) stays rejected,
      #     for a new reason. Its null tail is single-row bursts (max
      #     1.742; a +57% one-row burst in 1 of the 21 real runs), so a
      #     threshold with the median gate's 15% margin is 2.0, and there
      #     it sees a quarter of the suite 30% slower in 0.5% of cases.
      #   * the count rule ("K rows at least R times slower") is red on 0
      #     of the 144 pairs, 0 of the 24 and 0 of the 21 real reports at
      #     R=1.25, K=3: the null count there is at most 1 of 19 and the
      #     third-largest ratio's null maximum is 1.190, so R clears it by
      #     5% and K is the null maximum plus two. It detects a random
      #     quarter of the suite 30% slower in 91% of cases, a random half
      #     in 99.9%, the 6-row module in 94% and a uniform +30% in 100%,
      #     where the median gate sees 0%, 0.8%, 0% and 50%. One or two
      #     slowed rows stay invisible to it by construction.
      #
      # So the count rule is in SHADOW: the Compare step computes it and
      # the report prints, on every gated comparison, how many benchmarks
      # are at least R slower and whether it would fail. It does NOT fail
      # the job; the verdict is the median rule's alone. 23 clean run-sets
      # (12 runners, and the 11 pull requests behind the 21 real runs)
      # cannot bound its false-red rate below about 12%, and a loaded box
      # reddens it on 328 of 552 clean pairs, so it waits for the same kind
      # of evidence the median's step-down does: the promotion criterion
      # (20 more pull requests, one run each, with `count_would_fail` false
      # on pull requests that touch no benchmarked code, recorded on #1989)
      # and the scoring command (`scripts/score_ab_shadow_rule.sh`) are in
      # `docs/development/testing/performance.md`. R=1.25 and K=3 were
      # measured at 19 benchmarks: re-run the null if the suite's size
      # changes. Promotion is a small, separate change (`ab.compare` adds
      # the rule to its failures); the two numbers live here and are
      # pinned against the null in `tests/unit/ci/test_benchmark_ab.py`.
      # `tests/wallclock/ab.py`'s docstring carries the rest.
      FM_AB_COUNT_RATIO: '1.25'
      FM_AB_COUNT_MIN: '3'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          # `git worktree add` needs the base commit present locally, and
          # a shallow clone does not contain it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check out the base beside the head
        id: base
        run: |
          set -euo pipefail
          # `pull_request.base.sha` is the tip of the branch this merges
          # INTO, and GitHub checks out the MERGE commit as the head — so
          # the difference between the two trees is exactly this pull
          # request's changes. `git merge-base` would instead attribute
          # everything landed on main since the branch point. Both carry
          # a CI verdict; only this one answers "what did THIS change
          # do".
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit ${BASE_SHA} is not in this clone" >&2
            exit 1
          fi
          git worktree add --detach "${RUNNER_TEMP}/base" "${BASE_SHA}"

          # Can the base side take part at all? The recorder that writes
          # the numbers is #1567's own code, so any base older than it
          # produces an empty file — which is NOT the same as "nothing
          # regressed". The comparator refuses an empty comparison, so
          # the case is settled here, by reading the base tree, and
          # reported as skipped rather than mis-reported as either. It
          # also saves the twenty minutes of runner time a comparison
          # that cannot happen would otherwise spend.
          #
          # ‼ Read the base's file into a FILE and grep the file. Never
          # `git show ... | grep -q` here: this step runs under
          # `pipefail`, `grep -q` exits on its first match and closes the
          # pipe, the producer dies with SIGPIPE, and pipefail propagates
          # 141 — so the `if` takes the else branch and the gate reports
          # "the base predates the recorder" on EVERY pull request, green
          # and silent. Measured on this repository with the real
          # producer: `git show <blob> | grep -q .` returns 141 for a
          # 74 KB source file (12 of 12 runs) and 0 for today's 6 KB
          # `record.py`. It is not predictable from size either — an
          # 81 KB file returned 0 every time — so no author can tell
          # locally whether their own site is one of the ones that
          # fires. `tests/unit/ci/test_benchmark_ab.py` bans the form.
          #
          # ‼ And test the record FORMAT, not a function name. The base
          # is an arbitrary commit on `main`, so a base that carries the
          # recorder but writes an older row shape is a hard parse
          # failure in the comparator — every pull request red until main
          # catches up, which is the same mis-report this probe exists to
          # prevent, in the other direction.
          base_record="${RUNNER_TEMP}/base_record.py"
          git show "${BASE_SHA}:tests/wallclock/record.py" > "${base_record}" \
            2>/dev/null || : > "${base_record}"
          base_version="$(sed -n \
            's/^RECORD_FORMAT_VERSION *= *\([0-9][0-9]*\).*/\1/p' \
            "${base_record}" | head -n 1)"
          if [ -z "${base_version}" ]; then
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
            echo "reason=The base commit \`${BASE_SHA}\` predates the A/B recorder, so it produces no measurements to compare against. This clears itself once the base branch carries \`tests/wallclock/record.py\`; a pull request branched from an older \`main\` clears it by merging \`main\` in." >> "$GITHUB_OUTPUT"
            echo "base ${BASE_SHA} predates the A/B recorder" >&2
          elif python -c 'import sys; from tests.wallclock.ab import SUPPORTED_RECORD_VERSIONS; sys.exit(0 if int(sys.argv[1]) in SUPPORTED_RECORD_VERSIONS else 1)' "${base_version}"; then
            echo 'comparable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
            echo "reason=The base commit \`${BASE_SHA}\` writes record format v${base_version}, which this head's comparator does not read. A record-schema change skips the comparison for the commits between it and the next base that carries the new shape, rather than failing them." >> "$GITHUB_OUTPUT"
            echo "base ${BASE_SHA} writes record format v${base_version}" >&2
          fi

      - name: Install dependencies (base)
        if: steps.base.outputs.comparable == 'true'
        working-directory: ${{ runner.temp }}/base
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Base runs FIRST so it runs against its own pinned dependencies;
      # the head install below may move them, and a base measured under
      # the head's dependency set is not the base.
      - name: Run benchmarks at base
        if: steps.base.outputs.comparable == 'true'
        # A benchmark over its ABSOLUTE budget is the `benchmarks` job's
        # verdict, not this one's, and its number is recorded before the
        # assertion — so a red side still contributes to the comparison.
        continue-on-error: true
        working-directory: ${{ runner.temp }}/base
        run: |
          set -o pipefail
          # ‼ Which tree `import faultmaven` resolves to is decided by
          # three things at once — this step's working directory,
          # PYTHONPATH, and the editable install's own finder — and their
          # precedence is a property of setuptools, not of this workflow.
          # Measured against the pinned setuptools 84.0.0, `_EditableFinder`
          # is appended AFTER `PathFinder` in `sys.meta_path`, so cwd and
          # PYTHONPATH both win and all three agree; a setuptools that
          # registered it first, or an install step that quietly failed,
          # would make this side measure the OTHER tree. The A/B would then
          # compare head against head, report 1.00x forever, and never fail
          # — the one failure of this design that is silent by
          # construction. So each side asserts its own root instead of
          # relying on the order.
          python -c 'import os, sys, faultmaven; root = os.environ["AB_EXPECTED_ROOT"]; print("imports faultmaven from", faultmaven.__file__); sys.exit(0 if faultmaven.__file__.startswith(root.rstrip("/") + "/") else 1)'
          pytest tests/benchmarks/ -m benchmark -q --no-cov
        env:
          AB_EXPECTED_ROOT: ${{ runner.temp }}/base
          PYTHONPATH: ${{ runner.temp }}/base
          SKIP_SERVICE_CHECKS: 'true'
          FM_WALLCLOCK_RECORD: ${{ runner.temp }}/base.jsonl

      - name: Install dependencies (head)
        if: steps.base.outputs.comparable == 'true'
        run: pip install -e .[test]

      - name: Run benchmarks at head
        if: steps.base.outputs.comparable == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python -c 'import os, sys, faultmaven; root = os.environ["AB_EXPECTED_ROOT"]; print("imports faultmaven from", faultmaven.__file__); sys.exit(0 if faultmaven.__file__.startswith(root.rstrip("/") + "/") else 1)'
          pytest tests/benchmarks/ -m benchmark -q --no-cov
        env:
          AB_EXPECTED_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'
          FM_WALLCLOCK_RECORD: ${{ runner.temp }}/head.jsonl

      - name: Compare
        id: compare
        if: always() && steps.base.outputs.comparable == 'true'
        # The verdict is deliberately NOT this step's exit status. The
        # summary and the pull-request comment have to be written whether
        # it passed or failed, and a step that aborts the job first is how
        # a gate's detail goes missing exactly when it matters. The
        # `Verdict` step at the end turns this into the job's result.
        run: |
          status=0
          python -m tests.wallclock.ab \
            --base "${RUNNER_TEMP}/base.jsonl" \
            --head "${RUNNER_TEMP}/head.jsonl" \
            --base-label "${BASE_SHA}" \
            --head-label "${GITHUB_SHA}" \
            --suite-threshold "${FM_AB_SUITE}" \
            --count-ratio "${FM_AB_COUNT_RATIO}" \
            --count-min "${FM_AB_COUNT_MIN}" \
            --markdown-out ab_report.md \
            --json-out ab_report.json || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Report
        if: always()
        # Three states, not two. "The base cannot take part" and "the base
        # step never finished" are different things, and printing the
        # first for the second would explain away a broken job.
        env:
          COMPARABLE: ${{ steps.base.outputs.comparable }}
          # Why it cannot take part, decided where it was detected. A
          # skip has more than one cause now (a base older than the
          # recorder, a base writing a record format this head cannot
          # read) and printing one cause for the other is how a reader
          # stops trusting the line.
          SKIP_REASON: ${{ steps.base.outputs.reason }}
        run: |
          {
            if [ "${COMPARABLE}" = 'true' ]; then
              cat ab_report.md 2>/dev/null \
                || echo 'The comparison produced no report — see the job log.'
            elif [ "${COMPARABLE}" = 'false' ]; then
              echo '### Benchmark A/B against the merge base'
              echo
              echo "**Skipped.** ${SKIP_REASON}"
            else
              echo '### Benchmark A/B against the merge base'
              echo
              echo '**The base checkout did not complete**, so no comparison'
              echo 'was attempted. See the job log — this is a broken job, not'
              echo 'a clean benchmark result.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ab
          path: |
            ab_report.md
            ab_report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && steps.base.outputs.comparable == 'true'
        # A pull request from a fork gets a read-only token whatever this
        # block says, so the comment cannot be posted there. That must not
        # turn a green comparison red: the verdict belongs to the next
        # step, and the job summary already carries the detail.
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('ab_report.md', 'utf8');
            } catch (error) {
              body = '### Benchmark A/B against the merge base\n\n' +
                     'The comparison step produced no report — see the job log.';
            }
            const MAX_BODY = 60000;
            if (body.length > MAX_BODY) {
              body = body.slice(0, MAX_BODY) + '\n\n…truncated (see artifacts).';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Verdict
        if: always() && steps.base.outputs.comparable == 'true'
        env:
          COMPARE_STATUS: ${{ steps.compare.outputs.status }}
        run: |
          if [ "${COMPARE_STATUS}" != '0' ]; then
            echo 'A/B comparison failed — see the job summary above.' >&2
            exit 1
          fi

  memory-benchmarks:
    name: Memory Usage Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Cleanup pip cache
        if: always()
        run: |
          # Free disk space by cleaning pip cache
          pip cache purge || true

      - name: Run memory benchmarks
        run: |
          # See the note on the benchmarks job: without pipefail the `| tee`
          # masks pytest's exit code and this gate never fails.
          set -o pipefail
          pytest tests/benchmarks/test_memory_usage.py \
            -m benchmark \
            -v \
            --tb=short \
            --no-cov \
            2>&1 | tee memory_benchmark_output.txt
        env:
          PYTHONPATH: ${{ github.workspace }}
          SKIP_SERVICE_CHECKS: 'true'

      - name: Upload memory benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: memory-benchmark-results
          path: memory_benchmark_output.txt
          retention-days: 90
