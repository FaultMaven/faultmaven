name: Brand Lint

# Enforces FaultMaven's canonical product terminology in brand-facing files.
# Source of truth: .claude/skills/brand-messaging/SKILL.md (§3 terminology, §7 enforcement).
# Pure stdlib — no dependencies to install.

on:
  pull_request:
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - "docs/README.md"
      - "scripts/brand_lint.py"
      - ".github/workflows/brand-lint.yml"
  push:
    branches: [main]

# Default-deny for the GITHUB_TOKEN -- the lint reads the checkout and
# nothing else.
permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run brand-messaging lint
        run: python scripts/brand_lint.py
