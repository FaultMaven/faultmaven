name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ============================================================================
  # ENVIRONMENT SMOKE CHECK
  # Fast validation that the CI environment matches expectations.
  # Catches version drift, missing lockfiles, and setup issues before
  # spending time on full test runs.
  # ============================================================================
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Environment Smoke Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate lockfiles exist
        run: |
          echo "Checking lockfiles..."
          for f in requirements/test.txt requirements/enterprise.txt requirements/dev.txt; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Lockfile $f is missing. Run: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ All lockfiles present"

      - name: Validate lockfiles are not empty stubs
        run: |
          for f in requirements/test.txt requirements/enterprise.txt requirements/dev.txt; do
            lines=$(grep -c "==" "$f" || true)
            if [ "$lines" -lt 50 ]; then
              echo "ERROR: $f has only $lines pinned packages (expected 50+). Regenerate with: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ Lockfiles contain pinned dependencies"

      - name: Validate key tool versions in lockfile
        run: |
          echo "Checking pinned tool versions..."
          grep -q "^black==26.3.1$" requirements/test.txt || (echo "ERROR: black not pinned to 26.3.1 in lockfile" && exit 1)
          grep -q "^ruff==0.9.10$" requirements/test.txt || (echo "ERROR: ruff not pinned to 0.9.10 in lockfile" && exit 1)
          echo "✓ Tool versions verified"

      - name: Validate lockfiles install cleanly
        run: |
          pip install -r requirements/test.txt --dry-run --quiet 2>&1 | tail -5
          echo "✓ Lockfile dependencies resolve correctly"

  # ============================================================================
  # CODE QUALITY CHECKS
  # Runs pre-commit hooks to ensure CI matches local developer experience.
  # Covers: formatting (black), linting + import sorting (ruff), secret
  # Ruff replaces flake8 (syntax errors) and isort (import sorting).
  # Pre-commit hooks are available for local dev but not enforced in CI
  # until the full codebase passes all hooks (docs, scripts, alembic, etc.).
  # ============================================================================
  code-quality:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Code Quality Checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Run Code Quality Checks
        run: |
          black --check faultmaven/ tests/
          ruff check faultmaven/ tests/ --select E9,F63,F7,F82,I

  # ============================================================================
  # COMMUNITY EDITION TESTING
  # Test with minimal dependencies (pip install faultmaven)
  # ============================================================================
  test-community:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test Community Edition

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Community Edition from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Verify Community Dependencies
        run: |
          # Verify enterprise-only packages are NOT installed
          # Note: redis package IS expected (transitive dep of fakeredis, which is a base dep)
          ! pip show opik 2>/dev/null || (echo "ERROR: opik should not be installed in community mode" && exit 1)
          ! pip show presidio-analyzer 2>/dev/null || (echo "ERROR: presidio-analyzer should not be installed in community mode" && exit 1)
          ! pip show boto3 2>/dev/null || (echo "ERROR: boto3 should not be installed in community mode" && exit 1)
          # Verify fakeredis IS installed (community redis substitute)
          pip show fakeredis || (echo "ERROR: fakeredis should be installed in community mode" && exit 1)
          echo "✓ Community dependencies verified"

      - name: Run Tests (Community Mode)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not enterprise and not benchmark" \
            -v
        env:
          # Community configuration - all enterprise features disabled
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
          TRACING_ENABLED: "false"
          METRICS_ENABLED: "false"
          PROTECTION_ENABLED: "false"
          SANITIZE_PII: "false"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=45

      - name: Upload Community Coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: community
          name: community-coverage

  # ============================================================================
  # ENTERPRISE EDITION TESTING
  # Test with full dependencies (pip install faultmaven[enterprise,test])
  # ============================================================================
  test-enterprise:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test Enterprise Edition

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/enterprise.txt'

      - name: Install Enterprise Edition from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/enterprise.txt
          pip install -e . --no-deps

      - name: Verify Enterprise Dependencies
        run: |
          # Verify enterprise packages ARE installed
          pip show opik || (echo "ERROR: opik should be installed in enterprise mode" && exit 1)
          pip show presidio-analyzer || (echo "ERROR: presidio-analyzer should be installed in enterprise mode" && exit 1)
          pip show boto3 || (echo "ERROR: boto3 should be installed in enterprise mode" && exit 1)
          pip show redis || (echo "ERROR: redis should be installed in enterprise mode (for infrastructure testing)" && exit 1)
          echo "✓ Enterprise dependencies verified"

      - name: Run Tests (Enterprise Mode)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not benchmark" \
            -v
        env:
          # Enterprise configuration - features can be enabled (but external services mocked)
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "true"
          OPIK_TRACK_DISABLE: "false"
          PROMETHEUS_ENABLED: "true"
          TRACING_ENABLED: "true"
          METRICS_ENABLED: "true"
          PROTECTION_ENABLED: "true"
          SANITIZE_PII: "true"
          # CI: no external services (FakeRedis for sessions)
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=45

      - name: Upload Enterprise Coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: enterprise
          name: enterprise-coverage

  # ============================================================================
  # ARCHITECTURE BOUNDARY ENFORCEMENT
  # Enforce architectural boundaries with import-linter
  # ============================================================================
  architecture-lint:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Architecture Boundary Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/dev.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Run Import Linter
        run: |
          lint-imports --config .importlinter

      - name: Check for New Violations
        run: |
          python scripts/check_import_violations.py

  # ============================================================================
  # PACKAGING TESTS
  # Verify pyproject.toml and packaging configuration
  # ============================================================================
  test-packaging:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Test Packaging Configuration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install toml parser
        run: pip install toml

      - name: Run Packaging Tests
        run: |
          pip install -r requirements/test.txt
          pip install -e . --no-deps
          pytest tests/installation/ -v

  # ============================================================================
  # BUILD AND PUBLISH
  # Build Docker image after all tests pass
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-community, test-enterprise, architecture-lint, test-packaging]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found in repository root"
            exit 1
          fi
          echo "✅ Dockerfile found"

      - name: Build Docker Image
        run: docker build -t faultmaven .

  # ============================================================================
  # SECURITY SCANNING
  # Fails on high/critical severity findings. Medium/low are reported but
  # do not block the pipeline.
  # ============================================================================
  security-scan:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Security Scanning

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: |
          # Fail on critical/high severity vulnerabilities
          safety check --json > safety-report.json 2>&1 || true
          # Parse results: fail if any high/critical CVEs found
          python -c "
          import json, sys
          try:
              with open('safety-report.json') as f:
                  data = json.load(f)
              vulns = data if isinstance(data, list) else data.get('vulnerabilities', [])
              if not vulns:
                  print('✓ No known vulnerabilities found')
                  sys.exit(0)
              print(f'Found {len(vulns)} vulnerability(ies)')
              # Safety v3 format: severity is in the vulnerability object
              high_crit = [v for v in vulns if str(v.get('severity', '')).lower() in ('high', 'critical')]
              if high_crit:
                  print(f'✗ {len(high_crit)} high/critical vulnerabilities detected:')
                  for v in high_crit:
                      pkg = v.get('package_name', v.get('package', 'unknown'))
                      vuln_id = v.get('vulnerability_id', v.get('id', 'N/A'))
                      sev = v.get('severity', 'unknown')
                      print(f'  - {pkg}: {vuln_id} ({sev})')
                  sys.exit(1)
              else:
                  print(f'⚠ {len(vulns)} low/medium vulnerabilities (non-blocking)')
          except (json.JSONDecodeError, FileNotFoundError):
              print('⚠ Could not parse safety output (non-blocking)')
          "

      - name: Run security linter
        run: |
          # Fail on high-confidence, high-severity findings (-ll = medium+, -iii = high confidence)
          # Skip B324 (weak MD5): all MD5 usage is for caching/fingerprinting, not security
          bandit -r faultmaven/ -ll -iii --skip B324 -f json -o bandit-report.json || true
          python -c "
          import json, sys
          try:
              with open('bandit-report.json') as f:
                  data = json.load(f)
              results = data.get('results', [])
              high_sev = [r for r in results if r.get('issue_severity') == 'HIGH' and r.get('issue_confidence') == 'HIGH']
              if high_sev:
                  print(f'✗ {len(high_sev)} high-severity/high-confidence findings:')
                  for r in high_sev:
                      print(f\"  - {r['filename']}:{r['line_number']}: {r['issue_text']} [{r['test_id']}]\")
                  sys.exit(1)
              elif results:
                  print(f'⚠ {len(results)} lower-severity findings (non-blocking)')
              else:
                  print('✓ No security issues found')
          except (json.JSONDecodeError, FileNotFoundError):
              print('⚠ Could not parse bandit output (non-blocking)')
          "
