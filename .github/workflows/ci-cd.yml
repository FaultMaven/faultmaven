name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ============================================================================
  # CODE QUALITY CHECKS
  # Run once, used by both community and enterprise test jobs
  # ============================================================================
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Code Quality Checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Code Quality Checks
        run: |
          black --check faultmaven/ tests/
          isort --check-only faultmaven/ tests/
          flake8 faultmaven/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Cleanup after quality checks
        if: always()
        run: |
          # Clean up pip cache to free disk space
          pip cache purge || true
          # Remove Python cache
          find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true

  # ============================================================================
  # COMMUNITY EDITION TESTING
  # Test with minimal dependencies (pip install faultmaven)
  # ============================================================================
  test-community:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test Community Edition

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Community Edition
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e .[test]
      
      - name: Cleanup pip cache
        if: always()
        run: |
          # Free disk space by cleaning pip cache
          pip cache purge || true

      - name: Verify Community Dependencies
        run: |
          # Verify enterprise packages are NOT installed
          ! pip show opik 2>/dev/null || (echo "ERROR: opik should not be installed in community mode" && exit 1)
          ! pip show presidio-analyzer 2>/dev/null || (echo "ERROR: presidio-analyzer should not be installed in community mode" && exit 1)
          ! pip show boto3 2>/dev/null || (echo "ERROR: boto3 should not be installed in community mode" && exit 1)
          ! pip show redis 2>/dev/null || (echo "ERROR: redis should not be installed in community mode (deployment-agnostic)" && exit 1)
          echo "✓ Community dependencies verified (deployment-agnostic)"

      - name: Run Tests (Community Mode)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not enterprise" \
            -v
        env:
          # Community configuration - all enterprise features disabled
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
          TRACING_ENABLED: "false"
          METRICS_ENABLED: "false"
          PROTECTION_ENABLED: "false"
          SANITIZE_PII: "false"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          SESSION_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"
      
      - name: Cleanup test artifacts
        if: always()
        run: |
          # Remove HTML coverage reports to save disk space
          rm -rf htmlcov/ .coverage.html coverage.html || true
          # Clean up pytest cache
          find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          # Clean up any temporary test files
          find . -type d -name ".pytest_cache" -exec rm -r {} + 2>/dev/null || true
          find . -type d -name ".mypy_cache" -exec rm -r {} + 2>/dev/null || true
      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=71

      - name: Upload Community Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: community
          name: community-coverage

  # ============================================================================
  # ENTERPRISE EDITION TESTING
  # Test with full dependencies (pip install faultmaven[enterprise,test])
  # ============================================================================
  test-enterprise:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test Enterprise Edition

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Enterprise Edition
        run: |
          python -m pip install --upgrade pip
          pip install -e .[enterprise,test]
      
      - name: Cleanup pip cache
        if: always()
        run: |
          # Free disk space by cleaning pip cache
          pip cache purge || true

      - name: Verify Enterprise Dependencies
        run: |
          # Verify enterprise packages ARE installed
          pip show opik || (echo "ERROR: opik should be installed in enterprise mode" && exit 1)
          pip show presidio-analyzer || (echo "ERROR: presidio-analyzer should be installed in enterprise mode" && exit 1)
          pip show boto3 || (echo "ERROR: boto3 should be installed in enterprise mode" && exit 1)
          pip show redis || (echo "ERROR: redis should be installed in enterprise mode (for infrastructure testing)" && exit 1)
          echo "✓ Enterprise dependencies verified"

      - name: Run Tests (Enterprise Mode)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          # Enterprise configuration - features can be enabled (but external services mocked)
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "true"
          OPIK_TRACK_DISABLE: "false"
          PROMETHEUS_ENABLED: "true"
          TRACING_ENABLED: "true"
          METRICS_ENABLED: "true"
          PROTECTION_ENABLED: "true"
          SANITIZE_PII: "true"
          # Still use in-memory for CI (no external services)
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          SESSION_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"
      
      - name: Cleanup test artifacts
        if: always()
        run: |
          # Remove HTML coverage reports to save disk space
          rm -rf htmlcov/ .coverage.html coverage.html || true
          # Clean up pytest cache
          find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          # Clean up any temporary test files
          find . -type d -name ".pytest_cache" -exec rm -r {} + 2>/dev/null || true
          find . -type d -name ".mypy_cache" -exec rm -r {} + 2>/dev/null || true

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=71

      - name: Upload Enterprise Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: enterprise
          name: enterprise-coverage

  # ============================================================================
  # ARCHITECTURE BOUNDARY ENFORCEMENT
  # Enforce architectural boundaries with import-linter
  # ============================================================================
  architecture-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Architecture Boundary Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Import Linter
        run: |
          lint-imports --config .importlinter

      - name: Check for New Violations
        run: |
          python scripts/check_import_violations.py

  # ============================================================================
  # PACKAGING TESTS
  # Verify pyproject.toml and packaging configuration
  # ============================================================================
  test-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Test Packaging Configuration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install toml parser
        run: pip install toml

      - name: Run Packaging Tests
        run: |
          pip install -e .[test]
          pytest tests/installation/ -v

  # ============================================================================
  # BUILD AND PUBLISH
  # Build Docker image after all tests pass
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-community, test-enterprise, architecture-lint, test-packaging]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found in repository root"
            exit 1
          fi
          echo "✅ Dockerfile found"

      - name: Build Docker Image
        run: docker build -t faultmaven .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag faultmaven ghcr.io/${{ github.repository }}/faultmaven:latest
          docker push ghcr.io/${{ github.repository }}/faultmaven:latest

  # ============================================================================
  # SECURITY SCANNING
  # Non-blocking security checks (safety + bandit)
  # ============================================================================
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Security Scanning

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: |
          safety check --json || echo "⚠️ Safety check completed with warnings (non-blocking)"

      - name: Run security linter
        run: |
          bandit -r faultmaven/ -ll || echo "⚠️ Bandit scan completed with findings (non-blocking)"
