name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # The merge queue tests each pull request merged onto the latest main and
  # requires the checks below to report on that commit. Without this trigger no
  # required check would ever report on it, and every queued merge would wait
  # until the queue timed out.
  merge_group:

# One run per pull request: a push that supersedes an earlier one cancels it,
# since only the newest head's verdict is ever read. Every other event is keyed
# on its own run id and never shares a group. A group would still replace a
# PENDING run with a newer one even with cancel-in-progress off, and every push
# to main must keep its verdict: publish-docker.yml gates `:latest` on it, and
# a merge base is read by commit. So is every merge-queue group, whose run is
# that merge's only verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny for the GITHUB_TOKEN. No job below reads a secret, posts a
# comment, uploads SARIF or pushes an image -- they check out and run. A job
# that later needs more declares its own `permissions:` block rather than
# widening this one.
permissions:
  contents: read

# Every workflow in this directory pins:
#   - the runner image, `ubuntu-24.04`, not `ubuntu-latest`. That label moves
#     to 26.04 over 2026-10-19 .. 2026-11-19 (actions/runner-images#14748),
#     changing every job's system Python, Node and tools at once with no diff
#     here. A new image arrives as a pull request that edits these labels.
#   - each action, to a full commit sha with its release in a comment. A tag
#     can be moved to other code; a sha cannot. Dependabot raises no alert for
#     a sha-pinned action, so its github-actions entry in .github/dependabot.yml
#     is what proposes new releases, fixes included.

jobs:
  # ============================================================================
  # DOCS-ONLY DETECTION
  # Answers one question for the heavy jobs below: does this pull request's
  # diff contain a file that could change what they measure?
  #
  # A documentation-only pull request used to run three pytest suites and a
  # Docker image build -- ~45 minutes, and on #1497 a `build` that hit its own
  # 15-minute timeout and BLOCKED the merge on a two-file markdown diff (#1506).
  #
  # Shape matters here. `paths-ignore` on those jobs would be fewer lines, but
  # a required check that never reports is treated as pending forever and the
  # pull request can never merge -- strictly worse than the waste. A job
  # skipped by an `if:` still publishes a check run, with conclusion `skipped`,
  # which satisfies a required status check. So the filter is a job every heavy
  # job declares a condition against, not a trigger filter.
  #
  # Pull requests only. publish-docker.yml gates `:latest` on "CI/CD
  # Pipeline" succeeding on main and its comment says that gate covers the
  # Dockerfile build, so a docs-only skip there would quietly narrow the gate.
  # A merge-queue group runs everything for the same reason: it is the last
  # check before main -- and the verdict a push of its commit carries, since
  # that push skips (see env-check) -- and the fail-closed arm below (any event
  # but `pull_request` resolves nothing) is what makes it do so. A push to main
  # the queue did not pass runs everything.
  # ============================================================================
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Docs-Only Detection
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the classification diffs against the pull request's
          # merge base, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Resolve the pull request's file list
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : > changed.txt

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "event '${EVENT_NAME}' is not a pull request"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::base commit ${BASE_SHA} is not in this checkout"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! merge_base=$(git merge-base "${BASE_SHA}" HEAD); then
            echo "::warning::no merge base between ${BASE_SHA} and HEAD"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # actions/checkout leaves HEAD at the merge ref, so this is the file
          # list GitHub shows under "Files changed". A base sha that has gone
          # stale only ADDS files, which can only move the answer towards
          # "run everything".
          #
          # ‼ --no-renames is load-bearing; do not drop it. Rename detection is
          # on by default and `--name-only` prints only the DESTINATION, so a
          # commit that MOVES a file into docs/ or .claude/ arrives here as one
          # inert path and the source is invisible. That is this repository's
          # normal archival move -- `git log main --diff-filter=R -M` counts 321
          # renames landing under docs/ or .claude/, mostly
          # docs/architecture/** -> docs/archive/**, and one batch that moved
          # files out of tests/. Measured on this tree, archiving
          # docs/getting-started/user-guide.md or
          # docs/architecture/investigation-engine/investigation-lifecycle-logic.md
          # classified docs_only=true while a test still read the old path, and
          # so did moving a .py file into docs/. --no-renames lists both sides,
          # and like the stale base sha above it can only ADD paths, so it moves
          # the answer in one direction only.
          git diff --name-only --no-renames "${merge_base}" HEAD > changed.txt
          echo "resolved=true" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' changed.txt

      - name: Classify the diff
        id: detect
        env:
          RESOLVED: ${{ steps.diff.outputs.resolved }}
        # Python rather than shell because the second half of this is an AST
        # walk. Stdlib only; no setup-python step, no dependency to pin.
        #
        # ‼ The classifier is a MODULE, not a heredoc, and must stay one. It
        # decides whether the suites run at all, so it has to be reachable by a
        # test -- `tests/unit/ci/test_classify_docs_only.py` feeds it file
        # lists and asserts the verdict, including the fail-closed arm that
        # `RESOLVED` drives (#1539). Inlining it here again would put it back
        # out of reach.
        run: |
          python3 .github/scripts/classify_docs_only.py

  # ============================================================================
  # ENVIRONMENT SMOKE CHECK
  # Fast validation that the CI environment matches expectations.
  # Catches version drift, missing lockfiles, and setup issues before
  # spending time on full test runs.
  #
  # It also decides whether a push to main runs anything else. The merge queue
  # tests the exact commit it then pushes to main: same sha, same tree, same
  # workflow. Re-testing it on the push cost ~66 job-minutes per merge and
  # held publish-docker.yml back for 30+ minutes. So when this workflow has a
  # green merge_group run of the pushed sha, every job that needs env-check
  # skips (the suites and `build` follow code-quality down), and this run's
  # success carries the queue's verdict to the publish gate. A push the queue
  # never saw -- an admin merge, a direct push, `develop` -- finds no such run
  # and runs everything, and so does a failed lookup.
  # ============================================================================
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Environment Smoke Check
    permissions:
      contents: read
      actions: read  # the merge-queue lookup
    outputs:
      queue_verified: ${{ steps.queue.outputs.verified }}

    steps:
      # Empty on every event but a push to main, and nothing skips.
      - name: Did the merge queue already pass this commit?
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The queue merges once the required checks pass, which can be a
          # moment before its run is marked complete, so a pending run is
          # waited for, briefly. Anything else that is not a success -- no run,
          # a failed one, a failed lookup -- runs everything.
          verified=false
          for attempt in 1 2 3 4 5 6; do
            conclusions="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-cd.yml/runs?head_sha=${GITHUB_SHA}&event=merge_group&per_page=100" \
              --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')" || conclusions="lookup-failed"
            echo "attempt ${attempt}: merge_group runs of ${GITHUB_SHA}: '${conclusions}'"
            case " ${conclusions} " in
              *" success "*) verified=true; break ;;
              *" pending "*) sleep 20 ;;
              *) break ;;
            esac
          done
          if [ "$verified" = true ]; then
            echo "::notice::The merge queue already passed ${GITHUB_SHA}; this push skips the suites and build"
          fi
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate lockfiles exist
        run: |
          echo "Checking lockfiles..."
          for f in requirements/test.txt requirements/cloud.txt requirements/dev.txt; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Lockfile $f is missing. Run: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ All lockfiles present"

      - name: Validate lockfiles are not empty stubs
        run: |
          for f in requirements/test.txt requirements/cloud.txt requirements/dev.txt; do
            lines=$(grep -c "==" "$f" || true)
            if [ "$lines" -lt 50 ]; then
              echo "ERROR: $f has only $lines pinned packages (expected 50+). Regenerate with: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ Lockfiles contain pinned dependencies"

      - name: Validate key tool versions in lockfile
        run: |
          echo "Checking pinned tool versions..."
          grep -q "^black==26.10.1$" requirements/test.txt || (echo "ERROR: black not pinned to 26.10.1 in lockfile" && exit 1)
          grep -q "^ruff==0.9.10$" requirements/test.txt || (echo "ERROR: ruff not pinned to 0.9.10 in lockfile" && exit 1)
          echo "✓ Tool versions verified"

      - name: Validate lockfiles install cleanly
        run: |
          # pipefail: without it the step's status is tail's unconditional 0
          # and a ResolutionImpossible scrolls past as a green step (#970).
          set -o pipefail
          pip install -r requirements/test.txt --dry-run --quiet 2>&1 | tail -5
          echo "✓ Lockfile dependencies resolve correctly"

  # ============================================================================
  # CODE QUALITY CHECKS
  # Covers: formatting (black) and linting + import sorting (ruff, which
  # replaced flake8 and isort here in #179).
  # Pre-commit hooks are available for local dev but not enforced in CI
  # until the full codebase passes all hooks (docs, scripts, alembic, etc.) —
  # that is a PATH question and it is still open; which RULES run is not.
  # ============================================================================
  code-quality:
    needs: [env-check]
    # A push the merge queue already passed skips; see env-check.
    if: needs.env-check.outputs.queue_verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Code Quality Checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Run Code Quality Checks
        # NO `--select` HERE. A CLI `--select` REPLACES [tool.ruff.lint].select
        # rather than narrowing it, so the flag made this gate and the committed
        # config two independent policies — and the config's, the one developers
        # read and `ruff check` runs locally, was the one nobody enforced. Bare
        # `ruff check` reads pyproject.toml, so the two cannot disagree.
        run: |
          black --check faultmaven/ tests/
          ruff check faultmaven/ tests/

      - name: Lockfiles match pyproject extras (#884)
        # The Docker image installs requirements/cloud.txt, not pyproject — a
        # dependency added to an extra without regenerating the lockfiles ships
        # an image missing a runtime dependency (workos was absent from the
        # cloud image this way; the DI container died at first request). uv
        # reuses existing pins when the output file exists, so this only fails
        # on genuine drift, not upstream releases.
        run: |
          pip install uv
          ./scripts/lock-deps.sh
          git diff --exit-code requirements/ || {
            echo "::error::requirements/ lockfiles are stale — run ./scripts/lock-deps.sh and commit the result alongside your pyproject.toml change."
            exit 1
          }

      - name: KB pack is structurally valid
        # The KB pack is built + freshness-checked by faultmaven-kb-toolkit and
        # vendored here; this verifies the committed pack isn't corrupt (loads,
        # content hashes match bundled markdown, chunks have full-dim vectors).
        run: python scripts/check_kb_pack.py

      - name: .env.example matches settings.py defaults
        # The documented standalone defaults in .env.example must mirror the
        # settings.py Field defaults (single source of truth); fail on drift.
        run: python scripts/check_env_example_sync.py

  # ============================================================================
  # STANDALONE TESTING
  # Minimal deps (pip install faultmaven) with optional features off — the
  # standalone config. Proves the core runs without the optional integrations.
  # ============================================================================
  test-standalone:
    needs: [changes, code-quality]
    # Skipped on a documentation-only diff (#1506). The condition is written
    # out rather than left to the implicit needs-success gate because it has to
    # fail SAFE: when `changes` fails, `docs_only` is the empty string, `'' !=
    # 'true'` holds, and this job runs. Leaving the default gate in place would
    # have skipped it instead -- and a skipped required check reads as passing,
    # so a crashed detector would have merged a pull request with no tests run
    # at all. `!cancelled()` is what lifts that default; `code-quality` is then
    # re-stated explicitly so its gate is not lifted with it.
    if: >-
      ${{ !cancelled()
      && needs.code-quality.result == 'success'
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # Anchored to the measured healthy cost, like Test Cloud below, and RAISED
    # when the suite grew into the previous anchor. History (#1450):
    #
    #   20  set when green runs took 18m31s / 18m39s / 17m18s
    #   30  set when that left only 7-13% of margin
    #   45  set 2026-09-15, after green runs reached 25m15s / 25m32s / 25m51s
    #       / 28m11s and then CANCELLED at 30m — on main, not only on a branch
    #
    # RE-MEASURED 2026-09-21 over the same 18 main runs the Test Cloud block
    # below tabulates: this job is now 18 green at 23m26s .. 36m09s, 28% above
    # the 2026-09-15 anchor above and still inside 45 — but by 24%, which is
    # the SMALLER of the two margins under equal caps (Cloud clears its worst
    # completed run by 73%). Under 45/45 this is the job that reaches the cap
    # first, so this is the number to watch, not Cloud's.
    #
    # A cancelled job reports as a FAILED required check with no diagnostic, so
    # it reads as "this branch broke something" and costs an investigation per
    # occurrence. Raising the cap buys margin; it does not make the job faster,
    # and the trend is still upward.
    #
    # What actually costs the time, measured with --durations on this exact
    # selection (run 35567183959, pytest phase 27m20s):
    #
    #   - The single most expensive test in BOTH jobs is
    #     tests/integration/test_fresh_install_boots.py::TestAFirstEverInstallBoots
    #     ::test_a_clean_machine_boots_and_serves — 44.2s here, 54.0s on Cloud.
    #   - tests/integration/test_main_app.py is 10 entries totalling 99.8s
    #     (6.1%). Its other 15 tests are each BELOW the reported floor, so the
    #     whole file is bounded above by ~3m50s — NOT the "~9 minutes" this
    #     comment claimed before the flag existed to check it. On Cloud the
    #     file contributes one entry, at 7.95s.
    #   - Four fifths of the phase is outside the top entries entirely:
    #     ~15,600 tests averaging ~0.1s. The growth is broad, not a few tests.
    #
    # The per-test `with TestClient(app)` lifespan (container composition,
    # migrations, KB bootstrap) is still a real lever and is tracked in #1569,
    # not done here — but at 6-15% of this job rather than a third of it, and
    # #1569 records that the distribution favours pytest-xdist ahead of it.
    #
    # Standalone is the slower of the two jobs at the MEDIAN despite running
    # the smaller selection (`not cloud`). Their tails overlap, though, and
    # Test Cloud cancelled first while this one passed, because the two caps
    # had drifted apart (45 here, 30 there). They are equal again — see the
    # measurement under Test Cloud below.
    timeout-minutes: 45
    name: Test Standalone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Standalone (minimal deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Verify Standalone Dependencies
        run: |
          # Verify optional (cloud) packages are NOT installed
          # Note: redis package IS expected (transitive dep of fakeredis, which is a base dep)
          ! pip show opik 2>/dev/null || (echo "ERROR: opik should not be installed in standalone mode" && exit 1)
          ! pip show presidio-analyzer 2>/dev/null || (echo "ERROR: presidio-analyzer should not be installed in standalone mode" && exit 1)
          ! pip show boto3 2>/dev/null || (echo "ERROR: boto3 should not be installed in standalone mode" && exit 1)
          # Verify fakeredis IS installed (standalone redis substitute)
          pip show fakeredis || (echo "ERROR: fakeredis should be installed in standalone mode" && exit 1)
          echo "✓ Standalone dependencies verified"

      - name: Run Tests (Standalone)
        run: |
          # Attribute the wall clock. Until #1450 nothing ever did, so every
          # discussion of why this job got slower was an argument rather than
          # a measurement.
          #
          # `--durations=0 --durations-min=1.0`, NOT `--durations=N`. A top-N
          # report attributes only what makes the cut — measured at 19.5% of
          # this job's phase for N=25 — so any total summed from it is a LOWER
          # BOUND presented as a value, which is how "test_main_app.py is ~9
          # minutes" survived above this line for months. A floor reports every
          # entry at or over a second, so per-file and per-directory totals are
          # real numbers, and pytest footers the count it hid. If the log proves
          # noisier than wanted, `--durations-min` is the knob; raising N is not.
          #
          # It prints only when the run FINISHES, so a cancelled job yields no
          # attribution at all — which is why the cap above has to clear the
          # cost for any of this to be worth anything, and why the two shipped
          # together.
          #
          # `-n logical --dist loadfile` (#1594): one worker per vCPU, each file
          # kept on one worker. `logical`, not `auto` -- `auto` counts PHYSICAL
          # cores and these runners report 2 of 4. `loadfile` keeps module-scoped
          # fixtures paid once per module. Measured on #1644's head: 12 complete
          # xdist runs per job, every failure list empty and identical, and
          # the pytest phase 2.32x faster here (2.16x on Cloud). pytest-cov
          # combines the workers' data into one .coverage before the reports and
          # the threshold step below read it.
          #
          # `not performance` + `--ignore=tests/performance` (#2090): a
          # wall-clock test judges the runner, not the diff, so it runs in
          # benchmarks.yml's per-PR job. Named to stay here: by ruling,
          # test_runbook_regex_redos.py (the ReDoS of #1395/#1405) and
          # test_secret_patterns_1980.py; by the plan, the revocation TTL tests
          # in test_revocation_store_contract.py, which pin the deadline rule.
          pytest tests/ \
            -n logical --dist loadfile \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not cloud and not benchmark and not performance" \
            --ignore=tests/performance \
            --durations=0 \
            --durations-min=1.0 \
            -v
        env:
          # Standalone configuration - optional (cloud) features disabled
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
          TRACING_ENABLED: "false"
          METRICS_ENABLED: "false"
          PROTECTION_ENABLED: "false"
          SANITIZE_PII: "false"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=50

      - name: Upload Standalone Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          file: ./coverage.xml
          flags: standalone
          name: standalone-coverage

  # ============================================================================
  # CLOUD TESTING
  # Full deps + optional features on — the cloud config. Redis is a real server;
  # the remaining external services are mocked or in-process.
  # (Installs the [cloud] extras-set via requirements/cloud.txt.)
  #
  # Redis is real here, and that is not a nicety. cloud.txt pins hiredis, so
  # redis-py selects `_AsyncHiredisParser`, whose `can_read_destructive()` does a
  # real stream read when a pooled connection is handed out. Against the
  # in-process FakeRedis that read touches an `asyncio.Queue` bound to the first
  # loop that ever used the process-wide singleton, and `TestClient` opens a NEW
  # loop per context — so from the second one on it raised `RuntimeError: ... is
  # bound to a different event loop`. No deployment has that pairing (cloud runs
  # real Redis; standalone has no hiredis and the pure-Python parser never
  # touches the queue), and it manufactured failures that existed nowhere else:
  # the rate limiter caught the error, failed open, and the wire tests saw 401s
  # where a 429 was due — a plausible-looking product failure that was a harness
  # artifact, and a debugging session (fm#990, fm#1031).
  #
  # Test PostgreSQL Integration also installs cloud.txt but selects `-m postgres`,
  # whose tests talk to PostgreSQL directly and never construct a Redis client or
  # boot the app, so it needs no Redis of its own.
  # ============================================================================
  test-cloud:
    needs: [changes, code-quality]
    # Skipped on a documentation-only diff (#1506). The condition is written
    # out rather than left to the implicit needs-success gate because it has to
    # fail SAFE: when `changes` fails, `docs_only` is the empty string, `'' !=
    # 'true'` holds, and this job runs. Leaving the default gate in place would
    # have skipped it instead -- and a skipped required check reads as passing,
    # so a crashed detector would have merged a pull request with no tests run
    # at all. `!cancelled()` is what lifts that default; `code-quality` is then
    # re-stated explicitly so its gate is not lifted with it.
    if: >-
      ${{ !cancelled()
      && needs.code-quality.result == 'success'
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # Anchored to the measured cost, like Test Standalone above, and RAISED
    # when the suite grew into the previous anchor. History (#1450):
    #
    #   20  set when green main runs took 19m20s / 18m39s, then a slow runner
    #       cancelled the job at 98% with 9,403 passed and none failed (#1025)
    #   30  set when that left ~3% of margin
    #   45  set 2026-09-21, after this job CANCELLED TWICE in 25 hours on
    #       main — d9d3f0c77 (run 35499506884, 30m17s) and d9e81534d (run
    #       35550555597, 30m18s). On main, not only on a branch, and both
    #       times the run's `build` job was skipped as collateral.
    #
    # The measurement, all 18 consecutive main runs 2026-09-20 03:05Z to
    # 2026-09-21 01:54Z:
    #
    #   Test Cloud       16 green, 19m38s .. 26m04s; 2 CANCELLED at the cap,
    #                    30m17s and 30m18s — an 11% (2/18) failure rate at 30,
    #                    not a one-off. Both are CENSORED: the true cost of
    #                    those runs is unknown and strictly greater than the
    #                    cap they hit.
    #   Test Standalone  18 green, 23m26s .. 36m09s   <- same suite, same
    #                                                    runner class
    #
    # 45 is Standalone's cap and it is deliberately the same number. The tail
    # is set by runner variance, not by selection: Cloud runs the STRICTLY
    # LARGER selection (`not benchmark` vs `not cloud and not benchmark`) and
    # is merely cheaper at the median, while the two distributions already
    # overlap. So the cost to clear is the worst observed cost of this suite
    # on this runner class — 36m09s — which 45 clears by 24%. Against Cloud's
    # own worst COMPLETED run (26m04s) that is 73%. Against either censored
    # cancellation it is AT MOST ~48%, never at least: if the true cost T
    # exceeds 30m17s then 45/T - 1 < 48%, so a censored observation bounds the
    # headroom from ABOVE. Those two runs prove a ceiling on the margin, not a
    # floor, which is why the anchor is the 36m09s completed worst case and
    # not them. Equal caps also retire the question
    # of which job is binding this week: with 45/30 the slower job passed and
    # the faster one was cancelled, which is what made main red.
    #
    # Raising the cap buys margin; it does not make the job faster, and the
    # trend is still upward. `--durations=0 --durations-min=1.0` on the run
    # step below is what attributes the growth from here on — and it only
    # prints on a run that FINISHES, so a cap that clears the cost is what
    # makes the attribution exist at all. The structural lever (the per-test
    # `TestClient(app)` lifespan) is #1569.
    timeout-minutes: 45
    name: Test Cloud

    services:
      redis:
        # 7.2 is what the cloud data tier runs (bitnami/redis, see
        # faultmaven-enterprise-infra kubernetes/data/redis).
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The discrete host/port/db path, which is the one the cloud ConfigMap
      # uses (REDIS_HOST/REDIS_PORT/REDIS_DB — no REDIS_URL). Job-scoped rather
      # than step-scoped so the pairing check below and the suite cannot drift
      # into pointing at different servers. The settings default host is the
      # in-cluster service name, so leaving this unset means "unreachable", and
      # unreachable means a silent FakeRedis fallback.
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/cloud.txt'

      - name: Install Cloud (full deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cloud.txt
          pip install -e . --no-deps

      - name: Verify Cloud Dependencies
        run: |
          # Verify optional (cloud) packages ARE installed
          pip show opik || (echo "ERROR: opik should be installed in cloud mode" && exit 1)
          pip show presidio-analyzer || (echo "ERROR: presidio-analyzer should be installed in cloud mode" && exit 1)
          pip show boto3 || (echo "ERROR: boto3 should be installed in cloud mode" && exit 1)
          pip show redis || (echo "ERROR: redis should be installed in cloud mode (for infrastructure testing)" && exit 1)
          echo "✓ Cloud dependencies verified"

      - name: Verify the cloud Redis pairing
        # Before the suite, not after: everything below this line is only
        # meaningful if the app reached the real server. The fallback to
        # FakeRedis is silent by design (standalone wants it), so a broken
        # service container would otherwise put the job straight back into the
        # pairing fm#1031 removed — green, and testing the stand-in.
        run: python scripts/check_redis_pairing.py

      - name: Run Tests (Cloud)
        run: |
          # Same flags as Test Standalone, including the floor rather than a
          # top-N. See the note there for why. This job's selection is the
          # larger of the two, so its report is the one that also covers the
          # `cloud`-marked tests. The same `-n logical --dist loadfile` too.
          pytest tests/ \
            -n logical --dist loadfile \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not benchmark and not performance" \
            --ignore=tests/performance \
            --durations=0 \
            --durations-min=1.0 \
            -v
        env:
          # Cloud configuration - optional features enabled (external services mocked)
          SKIP_SERVICE_CHECKS: "true"
          # Both switches off. Unit tests call the real
          # DataClassifier().classify(); with tracing live the SDK builds a
          # client against its Comet Cloud default and ships span batches
          # (401) from every cloud CI run — the #1121 defect reproduced inside
          # CI, where it is least visible.
          #
          # OPIK_ENABLED=false is the load-bearing one: OPIK_TRACK_DISABLE
          # alone FAILS OPEN, because the SDK's is_tracing_active() returns
          # True from a bare `except` if OpikConfig cannot be constructed (a
          # malformed OPIK_* value, an SDK config change). The app-level gate
          # has no such branch.
          #
          # This costs no coverage: since #1121 the decorators are applied
          # whenever opik is importable and the gate is checked per call, so
          # the tracked wrapper is still exercised on this path.
          OPIK_ENABLED: "false"
          OPIK_TRACK_DISABLE: "true"
          PROMETHEUS_ENABLED: "true"
          TRACING_ENABLED: "true"
          METRICS_ENABLED: "true"
          PROTECTION_ENABLED: "true"
          SANITIZE_PII: "true"
          # Sessions, rate limits and revocation go to the job's real Redis
          # (REDIS_HOST/PORT/DB at job level); the rest stay in-process.
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=50

      - name: Upload Cloud Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          file: ./coverage.xml
          flags: cloud
          name: cloud-coverage

  # ============================================================================
  # POSTGRESQL INTEGRATION
  # Exercise the PostgreSQL-only write paths against a REAL Postgres. The
  # PostgreSQLHybridCaseRepository runs only on Postgres (SQLite uses a
  # different repo) and its raw-SQL casts/binds are invisible to SQLite and
  # mocked-session tests — three PG-only "dark path" defects shipped before
  # this job existed (the :name::jsonb bind-drop and the reused-:case_id
  # AmbiguousParameterError among them). Tests are marked `postgres` and
  # skip themselves unless DATABASE_URL is a Postgres URL.
  # ============================================================================
  test-postgres:
    needs: [changes, code-quality]
    # Skipped on a documentation-only diff (#1506). The condition is written
    # out rather than left to the implicit needs-success gate because it has to
    # fail SAFE: when `changes` fails, `docs_only` is the empty string, `'' !=
    # 'true'` holds, and this job runs. Leaving the default gate in place would
    # have skipped it instead -- and a skipped required check reads as passing,
    # so a crashed detector would have merged a pull request with no tests run
    # at all. `!cancelled()` is what lifts that default; `code-quality` is then
    # re-stated explicitly so its gate is not lifted with it.
    if: >-
      ${{ !cancelled()
      && needs.code-quality.result == 'success'
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Test PostgreSQL Integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmtest
          POSTGRES_PASSWORD: fmtest  # pragma: allowlist secret
          POSTGRES_DB: fmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql+asyncpg://fmtest:fmtest@localhost:5432/fmtest"  # pragma: allowlist secret
      # Bypass the integration conftest's Redis/API readiness gate — these
      # tests need only PostgreSQL.
      SKIP_SERVICE_CHECKS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/cloud.txt'

      - name: Install full deps from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cloud.txt
          pip install -e . --no-deps

      - name: Apply Migrations to PostgreSQL
        run: alembic upgrade head

      - name: Run PostgreSQL Integration Tests
        run: |
          # `pipefail` must be set explicitly. GitHub only uses
          # `bash --noprofile --norc -eo pipefail {0}` when a step declares
          # `shell: bash`; with no `shell:` key (as here) the implicit default
          # is `bash -e {0}`, which has NO pipefail — so `pytest | tee` would
          # exit with tee's status and a real test failure would go green.
          set -o pipefail
          pytest tests/ -m postgres -v --no-header -p no:cacheprovider | tee /tmp/pg.log
          # Guard against the silent-skip trap: this job exists to actually
          # exercise the PG-only write paths. If the tests SKIP (DATABASE_URL
          # or SKIP_SERVICE_CHECKS misconfigured), pytest exits 0 and the
          # build gate would go green having validated nothing — reopening
          # the dark-path gap this job was created to close.
          if grep -qE '[0-9]+ skipped' /tmp/pg.log; then
            echo "::error::PostgreSQL tests were skipped — check DATABASE_URL / SKIP_SERVICE_CHECKS on this job."
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/pg.log || { echo "::error::No PostgreSQL tests ran."; exit 1; }

  # ============================================================================
  # ARCHITECTURE BOUNDARY ENFORCEMENT
  # Enforce architectural boundaries with import-linter
  # ============================================================================
  architecture-lint:
    needs: [env-check]
    # A push the merge queue already passed skips; see env-check.
    if: needs.env-check.outputs.queue_verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Architecture Boundary Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/dev.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Run Import Linter
        run: |
          lint-imports --config .importlinter

      - name: Check for New Violations
        run: |
          python scripts/check_import_violations.py

  # ============================================================================
  # API CONTRACT DRIFT
  # The checked-in API reference must describe the routes this app actually
  # serves — including which of them require authentication. Regenerating and
  # diffing is the whole check: there is no hand-maintained list to curate, so
  # it cannot decay into a partial one (issue #880).
  #
  # This lives here rather than in its own workflow on purpose. ci-cd.yml has
  # no path filters, so it runs on every pull request. The workflow it replaced
  # filtered on `faultmaven/api/**`, but routes live in
  # `faultmaven/modules/*/api/`, so it did not trigger on most route changes.
  # ============================================================================
  api-contract-drift:
    needs: [env-check]
    # A push the merge queue already passed skips; see env-check.
    if: needs.env-check.outputs.queue_verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: API Contract Drift Check
    env:
      # The commit the contract is compared against; the two contract steps
      # below explain why it is HEAD's parent for every event.
      CONTRACT_BASE: HEAD~1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # HEAD and its parents, fetched together with HEAD: CONTRACT_BASE
          # is HEAD~1, and a shallow clone holds no parent. Nothing may fetch
          # it later — see the contract step.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/dev.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Check API reference matches the app
        env:
          SKIP_SERVICE_CHECKS: "true"
        run: |
          python scripts/generate_api_docs.py --check

      # The check above is satisfied by regenerating, which a route change does
      # automatically — so it proves the document describes the code, not that
      # anyone decided to amend the contract. This one refuses a structural
      # change whose info.version did not move.
      #
      # Every event compares HEAD with its first parent, the state the change
      # was applied to. A pull request runs on GitHub's merge commit, whose
      # first parent is the base it was merged onto. A freshly fetched
      # origin/<base> is not: main can move between the merge and this step,
      # and the pull request would be charged with main's contract changes. A
      # push (main is not protected, so direct ones happen) is compared against
      # its own parent; comparing it against origin/main would compare the
      # commit with itself, a check that cannot fail. With the merge queue's
      # squash merge method each queued pull request is one commit on top of
      # the state just ahead of it (main, or the pull request queued before
      # it), so its parent is the right base, and two queued pull requests that
      # both bump the version to the same number fail here. A merge method that
      # keeps a pull request's own commits would break that, so change this
      # step with the method.
      #
      # The parent comes from the checkout, never from a fetch here. The queue
      # deletes a group's branch as soon as the group is dropped or rebuilt
      # (another job failing is enough), and a fetch after that cannot reach
      # the group's commit: that is how `git fetch --deepen=1` failed this
      # step in the queue. The script exits 2 rather than passing blind if it
      # still cannot read the base contract.
      - name: Contract changes are published deliberately
        run: |
          echo "Comparing the contract against ${CONTRACT_BASE}"
          python scripts/check_contract_version.py --base "${CONTRACT_BASE}"

      # ADVISORY. The check above requires a version bump for any structural
      # change but deliberately does not judge MINOR versus MAJOR — that is the
      # question the clients are being asked, and a script answering it would
      # make the agreement on their behalf. This prints what a differ thinks,
      # as an input to that judgement rather than a substitute for it.
      #
      # Two things it cannot see, both worth knowing before trusting it:
      #
      #   * It only compares what the document DECLARES. The 2.0.0 change moved
      #     `invalid_grant` from 401 to 400 and replaced the error body, and
      #     oasdiff reported neither — because 1.0.0 declared only `200` and
      #     `422` for that operation, so the behaviour that changed was never in
      #     the contract to be compared. An undocumented response is invisible
      #     to every differ, including this one.
      #   * It has no view of semantics. A field that keeps its type and changes
      #     its meaning is not a breaking change to any tool.
      #
      # Advisory until its output has been read on enough real changes to know
      # what it flags that this project considers routine. A gate that cries
      # wolf on day one gets switched off on day two.
      # `if: always()` because the step above FAILS exactly when this report is
      # most wanted: a surface change whose version stood still is the moment
      # the author is deciding MINOR versus MAJOR. Skipping it there would have
      # withheld the evidence on precisely the pull requests it was built for.
      # The base is the job's CONTRACT_BASE rather than anything that step
      # writes, for the same reason — a failing step writes nothing.
      - name: Breaking-change report (advisory)
        if: always()
        continue-on-error: true
        env:
          # sha256 of oasdiff_1.29.1_linux_amd64.tar.gz as published.
          OASDIFF_SHA256: "541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533"  # pragma: allowlist secret
        run: |
          if ! git show "${CONTRACT_BASE}:docs/reference/api/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No contract at ${CONTRACT_BASE} to compare against; skipping."
            exit 0
          fi
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.29.1/oasdiff_1.29.1_linux_amd64.tar.gz
          # A pinned URL is not a pinned artifact: release assets are mutable by
          # the publisher, and this runs on pull requests from forks. The digest
          # is of the v1.29.1 tarball as published; a mismatch means the asset
          # changed under the tag, which is worth failing this step over even
          # though the step itself is advisory.
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c - || {
            echo "::warning::oasdiff tarball digest mismatch; skipping the report."
            exit 0
          }
          tar xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          echo "### API contract: breaking-change report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          /tmp/oasdiff breaking /tmp/base-openapi.json docs/reference/api/openapi.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # PACKAGING TESTS
  # Verify pyproject.toml and packaging configuration
  # ============================================================================
  test-packaging:
    needs: [env-check]
    # A push the merge queue already passed skips; see env-check.
    if: needs.env-check.outputs.queue_verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Test Packaging Configuration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Run Packaging Tests
        run: |
          pip install -r requirements/test.txt
          pip install -e . --no-deps
          pytest tests/installation/ -v

  # ============================================================================
  # BUILD AND PUBLISH
  # Build Docker image after all tests pass
  # ============================================================================
  build:
    runs-on: ubuntu-24.04
    # 75 green runs to 2026-10-23: median 8.7m, p90 11.3m, max 13.9m. The old
    # cap of 15 left 7% margin on a required check, and a cancelled required
    # check blocks the merge with no diagnostic.
    timeout-minutes: 25
    needs: [test-standalone, test-cloud, test-postgres, architecture-lint, api-contract-drift, test-packaging]
    # No docs-only condition here on purpose. GitHub skips a job whose
    # dependency was skipped, so the three suites above carry this one down
    # with them -- and, just as important, carry it UP again when the
    # detector fails and they run after all. An `if:` of its own keyed on
    # `changes` would have to repeat all six results to stay fail-safe, and
    # getting that list wrong is how a required check starts passing
    # without having built anything (#1506).

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found in repository root"
            exit 1
          fi
          echo "✅ Dockerfile found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image (with layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: faultmaven:ci
          # GitHub Actions layer cache. The heavy layers (deps install, the
          # ~2GB bundled BGE-M3 model) are content-addressed and only rebuild
          # when requirements/Dockerfile change — code-only PRs reuse them and
          # restore from main's cache, so no per-PR model re-download.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # SECURITY SCANNING
  # Fail-closed (#969): pip-audit blocks on ANY unignored advisory in the
  # lockfiles regardless of severity (accepted ones are ignored by anchored
  # GHSA id); bandit blocks on HIGH-severity/HIGH-confidence code findings
  # and reports nothing below that.
  # ============================================================================
  security-scan:
    needs: [env-check]
    # A push the merge queue already passed skips; see env-check.
    if: needs.env-check.outputs.queue_verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Security Scanning

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install security tools
        # Pinned: both tools now gate on their raw exit codes, so an unpinned
        # tool release could change what blocks with zero repo changes. bandit
        # matches the lockfile pin; bump both deliberately.
        run: |
          pip install pip-audit==2.10.1 bandit==1.9.4

      # Fail-closed dependency audit (#969). pip-audit exits non-zero on any
      # finding — no report parser, no `|| true` — and audits the declared
      # locked dependency graph (requirements/*.txt: a superset of what any
      # artifact installs; the Dockerfile strips GPU pins, so an advisory can
      # fire on an audited-but-unshipped package — anchor those to a tracking
      # issue), not the runner's venv.
      #
      # Ignore policy: every --ignore-vuln below MUST cite an entry in
      # docs/operations/security/vulnerability-exceptions.md or a tracking
      # issue; an ignore without a documented anchor should be rejected in
      # review. Remove the ignore when its entry's escalation trigger fires.
      #
      # One invocation over every lockfile. The three files pin identical
      # versions for every package they share, so nothing needs a per-file
      # exception and pip-audit's single merged resolution is exact. If a
      # future lockfile has to sit on a vulnerable pin the others have moved
      # off, split the run back out per scope rather than widening an ignore
      # to all three — a global ignore would hide the regression elsewhere.
      - name: Audit locked dependencies (pip-audit)
        run: |
          IGNORES=(
            # chromadb pre-auth code injection — no patched release exists;
            # unreachable in standalone, contained in cloud. pip-audit prints
            # this one under its PYSEC alias (PYSEC-2026-311); it matches
            # aliases, so the GHSA id below is what suppresses it — do not
            # "correct" the id to whatever the log shows.
            # → vulnerability-exceptions.md "chromadb"  (fm#902 is closed; the
            #   entry, not the issue, is this flag's anchor — same as the three
            #   below, so all four cite the same place)
            --ignore-vuln GHSA-f4j7-r4q5-qw2c
            # Three further chromadb server advisories, published 2026-06-12
            # and ingested into the audit feed on 2026-08-24: authenticated
            # code injection via UPDATE_COLLECTION (GHSA-36p7, Critical) and
            # two cross-tenant authorization failures in the server's authz
            # layer (GHSA-2wm9, GHSA-xph7, High). Same containment as above —
            # the vulnerable HTTP server never starts in standalone, and in
            # cloud it sits behind TWO independent, live-verified controls
            # (2026-08-25, infra#253 / fm#1173): the NetworkPolicy pair
            # (ClusterIP only, ingress restricted to the auth proxy, which
            # admits four first-party pods; egress default-denied) and the
            # token-enforcing chromadb-auth-proxy — required because the
            # ChromaDB 1.x server itself has no auth to enable. The two
            # authorization CVEs stay moot: the proxy's single-token gate
            # creates one all-access principal, no ChromaDB tenants or RBAC —
            # tenancy is enforced above ChromaDB and never delegated to it.
            # The exception entry is the authoritative containment record.
            # Reported under CVE aliases (CVE-2026-45833 / -45830 / -45831);
            # as above, ignore by GHSA id — do not "correct" these to the ids
            # the log prints.
            # → vulnerability-exceptions.md "chromadb"
            --ignore-vuln GHSA-36p7-vc44-83pf
            --ignore-vuln GHSA-2wm9-hf6c-p5cr
            --ignore-vuln GHSA-xph7-9rjv-w5fr
            # lupa sandbox escape — no upstream fix (2.7 and 2.8 are build
            # and packaging releases); Lua bodies are module string constants,
            # no user input reaches them. PRE-ARMED, NOT LOAD-BEARING: the
            # advisory range stops at 2.6 while we pin 2.8, so pip-audit has
            # nothing to report and this flag currently suppresses nothing.
            # Keep it anyway — if the range is corrected to cover 2.8, this
            # must not red the gate on a risk already accepted. Do not delete
            # it for being inert; see the doc section on why the scanners are
            # quiet (which is also why lupa has no Dependabot alert to watch).
            # → vulnerability-exceptions.md "lupa"
            --ignore-vuln GHSA-69v7-xpr6-6gjm
          )
          # Glob-built so a future lockfile cannot silently escape the audit.
          REQS=()
          for f in requirements/*.txt; do
            # An unmatched glob leaves the literal pattern as one iteration.
            # With a single list that would make REQS non-empty and the guard
            # below silent, so the -f test is what keeps it able to fire. (The
            # two-list version this replaced happened to survive that case for
            # an unrelated reason: the literal fell into the non-cloud arm, so
            # the CLOUD side was empty and its guard tripped. Neither version
            # was ever fail-open — this one just does not depend on the
            # accident.)
            [ -f "$f" ] || continue
            REQS+=(-r "$f")
          done
          # Fail closed on an empty list: pip-audit with no -r audits the
          # runner's venv and would report a cheerful green having checked
          # nothing.
          if [ ${#REQS[@]} -eq 0 ]; then
            echo "::error::no lockfiles matched requirements/*.txt — pip-audit would audit the runner venv instead"
            exit 1
          fi
          # One bounded retry: a transient OSV/PyPI error is otherwise
          # indistinguishable from a finding. Real findings fail twice.
          pip-audit --no-deps "${REQS[@]}" "${IGNORES[@]}" || {
            echo "pip-audit failed — retrying once in case of transient service error"
            sleep 30
            pip-audit --no-deps "${REQS[@]}" "${IGNORES[@]}"
          }

      - name: Run security linter (bandit)
        # Gate on bandit's own exit code at HIGH severity + HIGH confidence —
        # no report parser to fail open (#969). B324 (weak hash) is NOT
        # skipped: the blanket skip meant any future `hashlib.md5(secret)`
        # passed this gate silently, which is how the redaction pseudonyms
        # kept an MD5 of the PII they were hiding (#971). Sites that really
        # are fingerprints carry `usedforsecurity=False` at the call, so the
        # justification lives next to the code a reviewer is reading rather
        # than in this workflow.
        run: |
          bandit -r faultmaven/ --severity-level high --confidence-level high
