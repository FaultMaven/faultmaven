name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ============================================================================
  # ENVIRONMENT SMOKE CHECK
  # Fast validation that the CI environment matches expectations.
  # Catches version drift, missing lockfiles, and setup issues before
  # spending time on full test runs.
  # ============================================================================
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Environment Smoke Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate lockfiles exist
        run: |
          echo "Checking lockfiles..."
          for f in requirements/test.txt requirements/cloud.txt requirements/dev.txt; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Lockfile $f is missing. Run: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ All lockfiles present"

      - name: Validate lockfiles are not empty stubs
        run: |
          for f in requirements/test.txt requirements/cloud.txt requirements/dev.txt; do
            lines=$(grep -c "==" "$f" || true)
            if [ "$lines" -lt 50 ]; then
              echo "ERROR: $f has only $lines pinned packages (expected 50+). Regenerate with: ./scripts/lock-deps.sh"
              exit 1
            fi
          done
          echo "✓ Lockfiles contain pinned dependencies"

      - name: Validate key tool versions in lockfile
        run: |
          echo "Checking pinned tool versions..."
          grep -q "^black==26.3.1$" requirements/test.txt || (echo "ERROR: black not pinned to 26.3.1 in lockfile" && exit 1)
          grep -q "^ruff==0.9.10$" requirements/test.txt || (echo "ERROR: ruff not pinned to 0.9.10 in lockfile" && exit 1)
          echo "✓ Tool versions verified"

      - name: Validate lockfiles install cleanly
        run: |
          # pipefail: without it the step's status is tail's unconditional 0
          # and a ResolutionImpossible scrolls past as a green step (#970).
          set -o pipefail
          pip install -r requirements/test.txt --dry-run --quiet 2>&1 | tail -5
          echo "✓ Lockfile dependencies resolve correctly"

  # ============================================================================
  # CODE QUALITY CHECKS
  # Runs pre-commit hooks to ensure CI matches local developer experience.
  # Covers: formatting (black), linting + import sorting (ruff), secret
  # Ruff replaces flake8 (syntax errors) and isort (import sorting).
  # Pre-commit hooks are available for local dev but not enforced in CI
  # until the full codebase passes all hooks (docs, scripts, alembic, etc.).
  # ============================================================================
  code-quality:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Code Quality Checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Run Code Quality Checks
        run: |
          black --check faultmaven/ tests/
          ruff check faultmaven/ tests/ --select E9,F63,F7,F82,I

      - name: Lockfiles match pyproject extras (#884)
        # The Docker image installs requirements/cloud.txt, not pyproject — a
        # dependency added to an extra without regenerating the lockfiles ships
        # an image missing a runtime dependency (workos was absent from the
        # cloud image this way; the DI container died at first request). uv
        # reuses existing pins when the output file exists, so this only fails
        # on genuine drift, not upstream releases.
        run: |
          pip install uv
          ./scripts/lock-deps.sh
          git diff --exit-code requirements/ || {
            echo "::error::requirements/ lockfiles are stale — run ./scripts/lock-deps.sh and commit the result alongside your pyproject.toml change."
            exit 1
          }

      - name: KB pack is structurally valid
        # The KB pack is built + freshness-checked by faultmaven-kb-toolkit and
        # vendored here; this verifies the committed pack isn't corrupt (loads,
        # content hashes match bundled markdown, chunks have full-dim vectors).
        run: python scripts/check_kb_pack.py

      - name: .env.example matches settings.py defaults
        # The documented standalone defaults in .env.example must mirror the
        # settings.py Field defaults (single source of truth); fail on drift.
        run: python scripts/check_env_example_sync.py

  # ============================================================================
  # STANDALONE TESTING
  # Minimal deps (pip install faultmaven) with optional features off — the
  # standalone config. Proves the core runs without the optional integrations.
  # ============================================================================
  test-standalone:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test Standalone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Standalone (minimal deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Verify Standalone Dependencies
        run: |
          # Verify optional (cloud) packages are NOT installed
          # Note: redis package IS expected (transitive dep of fakeredis, which is a base dep)
          ! pip show opik 2>/dev/null || (echo "ERROR: opik should not be installed in standalone mode" && exit 1)
          ! pip show presidio-analyzer 2>/dev/null || (echo "ERROR: presidio-analyzer should not be installed in standalone mode" && exit 1)
          ! pip show boto3 2>/dev/null || (echo "ERROR: boto3 should not be installed in standalone mode" && exit 1)
          # Verify fakeredis IS installed (standalone redis substitute)
          pip show fakeredis || (echo "ERROR: fakeredis should be installed in standalone mode" && exit 1)
          echo "✓ Standalone dependencies verified"

      - name: Run Tests (Standalone)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not cloud and not benchmark" \
            -v
        env:
          # Standalone configuration - optional (cloud) features disabled
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
          TRACING_ENABLED: "false"
          METRICS_ENABLED: "false"
          PROTECTION_ENABLED: "false"
          SANITIZE_PII: "false"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=45

      - name: Upload Standalone Coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: standalone
          name: standalone-coverage

  # ============================================================================
  # CLOUD TESTING
  # Full deps + optional features on, external services mocked — the cloud config.
  # (Installs the [cloud] extras-set via requirements/cloud.txt.)
  # ============================================================================
  test-cloud:
    needs: [code-quality]
    runs-on: ubuntu-latest
    # Anchored to the measured healthy cost, not aspiration: the last green
    # main runs took 19m20s and 18m39s, so 20 was within ~3% of the healthy
    # path and a slow runner cancelled the job at 98% with 9,403 tests passed
    # and none failed (PR #1025). 30 clears the measured cost by ~55%.
    timeout-minutes: 30
    name: Test Cloud

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/cloud.txt'

      - name: Install Cloud (full deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cloud.txt
          pip install -e . --no-deps

      - name: Verify Cloud Dependencies
        run: |
          # Verify optional (cloud) packages ARE installed
          pip show opik || (echo "ERROR: opik should be installed in cloud mode" && exit 1)
          pip show presidio-analyzer || (echo "ERROR: presidio-analyzer should be installed in cloud mode" && exit 1)
          pip show boto3 || (echo "ERROR: boto3 should be installed in cloud mode" && exit 1)
          pip show redis || (echo "ERROR: redis should be installed in cloud mode (for infrastructure testing)" && exit 1)
          echo "✓ Cloud dependencies verified"

      - name: Run Tests (Cloud)
        run: |
          pytest tests/ \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not benchmark" \
            -v
        env:
          # Cloud configuration - optional features enabled (external services mocked)
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "true"
          OPIK_TRACK_DISABLE: "false"
          PROMETHEUS_ENABLED: "true"
          TRACING_ENABLED: "true"
          METRICS_ENABLED: "true"
          PROTECTION_ENABLED: "true"
          SANITIZE_PII: "true"
          # CI: no external services (FakeRedis for sessions)
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=45

      - name: Upload Cloud Coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: cloud
          name: cloud-coverage

  # ============================================================================
  # POSTGRESQL INTEGRATION
  # Exercise the PostgreSQL-only write paths against a REAL Postgres. The
  # PostgreSQLHybridCaseRepository runs only on Postgres (SQLite uses a
  # different repo) and its raw-SQL casts/binds are invisible to SQLite and
  # mocked-session tests — three PG-only "dark path" defects shipped before
  # this job existed (the :name::jsonb bind-drop and the reused-:case_id
  # AmbiguousParameterError among them). Tests are marked `postgres` and
  # skip themselves unless DATABASE_URL is a Postgres URL.
  # ============================================================================
  test-postgres:
    needs: [code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test PostgreSQL Integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmtest
          POSTGRES_PASSWORD: fmtest
          POSTGRES_DB: fmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql+asyncpg://fmtest:fmtest@localhost:5432/fmtest"
      # Bypass the integration conftest's Redis/API readiness gate — these
      # tests need only PostgreSQL.
      SKIP_SERVICE_CHECKS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/cloud.txt'

      - name: Install full deps from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cloud.txt
          pip install -e . --no-deps

      - name: Apply Migrations to PostgreSQL
        run: alembic upgrade head

      - name: Run PostgreSQL Integration Tests
        run: |
          # `pipefail` must be set explicitly. GitHub only uses
          # `bash --noprofile --norc -eo pipefail {0}` when a step declares
          # `shell: bash`; with no `shell:` key (as here) the implicit default
          # is `bash -e {0}`, which has NO pipefail — so `pytest | tee` would
          # exit with tee's status and a real test failure would go green.
          set -o pipefail
          pytest tests/ -m postgres -v --no-header -p no:cacheprovider | tee /tmp/pg.log
          # Guard against the silent-skip trap: this job exists to actually
          # exercise the PG-only write paths. If the tests SKIP (DATABASE_URL
          # or SKIP_SERVICE_CHECKS misconfigured), pytest exits 0 and the
          # build gate would go green having validated nothing — reopening
          # the dark-path gap this job was created to close.
          if grep -qE '[0-9]+ skipped' /tmp/pg.log; then
            echo "::error::PostgreSQL tests were skipped — check DATABASE_URL / SKIP_SERVICE_CHECKS on this job."
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/pg.log || { echo "::error::No PostgreSQL tests ran."; exit 1; }

  # ============================================================================
  # ARCHITECTURE BOUNDARY ENFORCEMENT
  # Enforce architectural boundaries with import-linter
  # ============================================================================
  architecture-lint:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Architecture Boundary Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/dev.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Run Import Linter
        run: |
          lint-imports --config .importlinter

      - name: Check for New Violations
        run: |
          python scripts/check_import_violations.py

  # ============================================================================
  # API CONTRACT DRIFT
  # The checked-in API reference must describe the routes this app actually
  # serves — including which of them require authentication. Regenerating and
  # diffing is the whole check: there is no hand-maintained list to curate, so
  # it cannot decay into a partial one (issue #880).
  #
  # This lives here rather than in its own workflow on purpose. ci-cd.yml has
  # no path filters, so it runs on every pull request. The workflow it replaced
  # filtered on `faultmaven/api/**`, but routes live in
  # `faultmaven/modules/*/api/`, so it did not trigger on most route changes.
  # ============================================================================
  api-contract-drift:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: API Contract Drift Check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/dev.txt'

      - name: Install Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Check API reference matches the app
        env:
          SKIP_SERVICE_CHECKS: "true"
        run: |
          python scripts/generate_api_docs.py --check

  # ============================================================================
  # PACKAGING TESTS
  # Verify pyproject.toml and packaging configuration
  # ============================================================================
  test-packaging:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Test Packaging Configuration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Run Packaging Tests
        run: |
          pip install -r requirements/test.txt
          pip install -e . --no-deps
          pytest tests/installation/ -v

  # ============================================================================
  # BUILD AND PUBLISH
  # Build Docker image after all tests pass
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-standalone, test-cloud, test-postgres, architecture-lint, api-contract-drift, test-packaging]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found in repository root"
            exit 1
          fi
          echo "✅ Dockerfile found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: faultmaven:ci
          # GitHub Actions layer cache. The heavy layers (deps install, the
          # ~2GB bundled BGE-M3 model) are content-addressed and only rebuild
          # when requirements/Dockerfile change — code-only PRs reuse them and
          # restore from main's cache, so no per-PR model re-download.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # SECURITY SCANNING
  # Fail-closed (#969): pip-audit blocks on ANY unignored advisory in the
  # lockfiles regardless of severity (accepted ones are ignored by anchored
  # GHSA id); bandit blocks on HIGH-severity/HIGH-confidence code findings
  # and reports nothing below that.
  # ============================================================================
  security-scan:
    needs: [env-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Security Scanning

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install security tools
        # Pinned: both tools now gate on their raw exit codes, so an unpinned
        # tool release could change what blocks with zero repo changes. bandit
        # matches the lockfile pin; bump both deliberately.
        run: |
          pip install pip-audit==2.10.1 bandit==1.9.4

      # Fail-closed dependency audit (#969). pip-audit exits non-zero on any
      # finding — no report parser, no `|| true` — and audits the declared
      # locked dependency graph (requirements/*.txt: a superset of what any
      # artifact installs; the Dockerfile strips GPU pins, so an advisory can
      # fire on an audited-but-unshipped package — anchor those to a tracking
      # issue), not the runner's venv.
      #
      # Ignore policy: every --ignore-vuln below MUST cite an entry in
      # docs/operations/security/vulnerability-exceptions.md or a tracking
      # issue; an ignore without a documented anchor should be rejected in
      # review. Remove the ignore when its entry's escalation trigger fires.
      # An ignore is also scoped to the narrowest set of lockfiles it is
      # actually needed for (see CLOUD_IGNORES) — a global ignore for a
      # finding that only one lockfile is stuck on would hide a regression
      # in the others.
      - name: Audit locked dependencies (pip-audit)
        run: |
          # Apply to every lockfile.
          COMMON_IGNORES=(
            # chromadb pre-auth code injection — no patched release exists;
            # unreachable in standalone, contained in cloud.
            # → vulnerability-exceptions.md "chromadb" (fm#902)
            --ignore-vuln GHSA-f4j7-r4q5-qw2c
            # lupa sandbox escape — no upstream fix; Lua bodies are module
            # string constants, no user input reaches them. Staged: OSV's
            # range stops at 2.6 today, but the doc records the bug observed
            # in 2.8 ("advisory range may trail releases") — when the range
            # extends, this must not red the gate for an accepted risk.
            # → vulnerability-exceptions.md "lupa"
            --ignore-vuln GHSA-69v7-xpr6-6gjm
            # litellm proxy-server advisories — every patched release is
            # blocked by our pydantic<2.10 ceiling; the proxy never runs here.
            # → vulnerability-exceptions.md "litellm" (all 10 ids listed there)
            --ignore-vuln GHSA-4xpc-pv4p-pm3w
            --ignore-vuln GHSA-r75f-5x8p-qvmc
            --ignore-vuln GHSA-7488-6r32-c95q
            --ignore-vuln GHSA-qrc4-49gv-mv9m
            --ignore-vuln GHSA-wpfp-gwwc-vwq6
            --ignore-vuln GHSA-wxxx-gvqv-xp7p
            --ignore-vuln GHSA-v4p8-mg3p-g94g
            --ignore-vuln GHSA-xqmj-j6mv-4862
            --ignore-vuln GHSA-5jmr-gcrj-2c9q
            --ignore-vuln GHSA-4g5m-c9r5-49xf
            # setuptools (medium): fix is 83.0.0, blocked by torch==2.11's
            # setuptools<82 pin — tracked on fm#904.
            --ignore-vuln GHSA-h35f-9h28-mq5c
            # torch (low): fixed in 2.13.0; heavy runtime bump — fm#904.
            --ignore-vuln GHSA-rrmf-rvhw-rf47
          )
          # Applies to requirements/cloud.txt ONLY.
          CLOUD_IGNORES=(
            # cryptography PKCS#7 EnvelopedData Bleichenbacher oracle, fixed
            # in 50.0.0. dev.txt/test.txt are already on 50.0.0; cloud.txt is
            # pinned to 49.0.0 by workos's cryptography~=49.0, which every
            # workos release through 10.1.0 declares. We never decrypt PKCS#7
            # — the only cryptography surface here is RS256 JWT keygen.
            # Scoped to cloud so a regression of dev/test back below 50 still
            # reds the gate. pip-audit prints the CVE alias (CVE-2026-69247);
            # it matches aliases, so the GHSA id below suppresses it.
            # → vulnerability-exceptions.md "cryptography" (fm#980)
            --ignore-vuln GHSA-g6cj-pr64-35w5
          )
          # Glob-built so a future lockfile cannot silently escape the audit.
          # Partitioned by ignore scope, with STRICT as the default: a new
          # requirements file is audited with no per-file exception unless it
          # is explicitly moved into the cloud group here.
          STRICT_REQS=()
          CLOUD_REQS=()
          for f in requirements/*.txt; do
            case "$f" in
              requirements/cloud.txt) CLOUD_REQS+=(-r "$f") ;;
              *)                      STRICT_REQS+=(-r "$f") ;;
            esac
          done
          # Fail closed if the partition no longer matches the lockfile
          # layout: pip-audit with no -r audits the runner's venv and would
          # report a cheerful green having checked nothing.
          if [ ${#STRICT_REQS[@]} -eq 0 ] || [ ${#CLOUD_REQS[@]} -eq 0 ]; then
            echo "::error::lockfile partition is empty on one side (cloud=$(( ${#CLOUD_REQS[@]} / 2 )) files, strict=$(( ${#STRICT_REQS[@]} / 2 )) files) — update this step to match requirements/"
            exit 1
          fi
          # One bounded retry per group: a transient OSV/PyPI error is
          # otherwise indistinguishable from a finding. Real findings fail
          # twice. Both groups always run and both always report — a red group
          # must not mask the other's findings — and the step fails if either
          # is red.
          rc=0
          audit() {
            local label=$1; shift
            echo "::group::pip-audit — ${label}"
            pip-audit --no-deps "$@" || {
              echo "pip-audit (${label}) failed — retrying once in case of transient service error"
              sleep 30
              pip-audit --no-deps "$@" || rc=1
            }
            echo "::endgroup::"
          }
          audit "dev+test (no cryptography exception)" "${STRICT_REQS[@]}" "${COMMON_IGNORES[@]}"
          audit "cloud" "${CLOUD_REQS[@]}" "${COMMON_IGNORES[@]}" "${CLOUD_IGNORES[@]}"
          exit "$rc"

      - name: Run security linter (bandit)
        # Gate on bandit's own exit code at HIGH severity + HIGH confidence —
        # no report parser to fail open (#969). B324 (weak hash) is NOT
        # skipped: the blanket skip meant any future `hashlib.md5(secret)`
        # passed this gate silently, which is how the redaction pseudonyms
        # kept an MD5 of the PII they were hiding (#971). Sites that really
        # are fingerprints carry `usedforsecurity=False` at the call, so the
        # justification lives next to the code a reviewer is reading rather
        # than in this workflow.
        run: |
          bandit -r faultmaven/ --severity-level high --confidence-level high
