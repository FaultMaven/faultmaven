name: Publish Docker Image

on:
  # Publish the main image only AFTER "CI/CD Pipeline" succeeds on main — gates on
  # the full test suite + Dockerfile build. Previously this ran on every push to
  # main and could ship :latest from a commit whose tests/build had failed.
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [ "main" ]
  # Version releases publish directly from the tag.
  push:
    tags: [ 'v*.*.*' ]
  # Manual / emergency publish.
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only when the triggering CI run passed (workflow_run), or a tag/manual run.
    # Without this, a failed/cancelled CI run would still reach the publish steps.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login to GHCR (GitHub Container Registry)
      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Add image digest to job summary
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published Docker images with digest ${{ steps.meta.outputs.digest }}"

      # Cross-repo queue update authenticates via the faultmaven-infra-queue-bot
      # GitHub App (org INFRA_BOT_APP_ID / INFRA_BOT_PRIVATE_KEY), minting a
      # short-lived token scoped to faultmaven-enterprise-infra. Runs only on the
      # canonical repo's main; forks lack the org creds and skip.
      - name: Mint infra token (GitHub App)
        id: infra-token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.INFRA_BOT_APP_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: faultmaven-enterprise-infra

      # Checkout enterprise-infra repository
      - name: Checkout enterprise-infra
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        uses: actions/checkout@v6
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: main
          token: ${{ steps.infra-token.outputs.token }}
          path: enterprise-infra

      - name: Install yq
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image queue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        run: |
          cd enterprise-infra
          git config user.name "faultmaven-infra-queue-bot[bot]"
          git config user.email "faultmaven-infra-queue-bot[bot]@users.noreply.github.com"

          QUEUE_FILE="available-images/staging/faultmaven.yaml"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TAG="sha-${SHA_SHORT}"

          echo "Updating $QUEUE_FILE with tag: $TAG"
          yq -i ".tag = \"${TAG}\"" "$QUEUE_FILE"
          yq -i ".updated_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$QUEUE_FILE"
          yq -i ".commit_sha = \"${GITHUB_SHA}\"" "$QUEUE_FILE"

          git add "$QUEUE_FILE"
          if git diff --staged --quiet; then
            echo "No changes to queue file"
          else
            git commit -m "chore(queue): update faultmaven image to ${TAG}

          Built from: ${{ github.repository }}@${GITHUB_SHA}
          Triggered by: @${{ github.actor }}
          Workflow: ${{ github.workflow }}"
            git push origin main
            echo "✓ Updated image queue: ${TAG}"
          fi
