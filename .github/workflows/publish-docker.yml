name: Publish Docker Image

on:
  # Publish the main image only AFTER "CI/CD Pipeline" succeeds on main. That
  # verdict is the full test suite + Dockerfile build, run on this exact commit
  # either by the merge queue (the push run then skips; see env-check in
  # ci-cd.yml) or by the push run itself. Previously this ran on every push to
  # main and could ship :latest from a commit whose tests/build had failed.
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [ "main" ]
  # A version tag or a manual run publishes only a commit CI has passed: see
  # "Resolve the commit to publish".
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven

# Default-deny for the GITHUB_TOKEN. The publish job overrides this with the
# `packages: write` it needs to push to GHCR; this file is the only one whose
# token can push an image, so a job added here must ask for that explicitly
# rather than inherit whatever the repository setting happens to be.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Green runs: median 2m, max 4.3m on a warm layer cache. A cold cache
    # rebuilds the model layer, which CI's own build has taken up to 14m.
    timeout-minutes: 30
    # A workflow_run must come from a green PUSH run. Without this, a failed or
    # cancelled CI run would reach the publish steps -- and the `branches`
    # filter above matches a head branch NAME, so a pull request from a fork
    # whose branch is called `main` passes it too. This job checks out the
    # triggering run's commit, which for that run is the fork's code. Tags and
    # dispatches are checked against CI in "Resolve the commit to publish".
    if: >-
      ${{ (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'push')
        || github.event_name == 'push'
        || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      actions: read  # the CI-verdict lookup for a tag or a dispatch

    steps:
      # The commit this run publishes.
      #
      # workflow_run: the commit the triggering CI run tested, NOT github.sha.
      # For this event github.sha is main's tip when the run starts, so
      # whenever another merge landed while CI ran, this job built and pushed
      # :latest from a commit whose own CI had not finished. Run 39400202854,
      # triggered by 964d775's green CI, published 1b1bb0f six minutes before
      # 1b1bb0f's CI completed.
      #
      # A tag or a dispatch carries no CI verdict of its own, so it publishes
      # only a commit with a green "CI/CD Pipeline" run from a push or from the
      # merge queue. A mistyped tag target is refused, not shipped.
      #
      # The moving tags (latest and the branch name) follow only the branch's
      # current tip. CI runs finish out of order: on 2026-10-17, 68b4b0f,
      # ca33237 and bb70258 finished newest-first, and publishing each one as
      # it passed would have left :latest on the oldest. The sha- tag and the
      # image queue (which orders itself, below) take every green commit.
      - name: Resolve the commit to publish
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-cd.yml/runs?head_sha=${SHA}&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "merge_group")] | length')"
            if [ "$green" -eq 0 ]; then
              echo "::error::${SHA} has no successful CI/CD Pipeline run from a push or the merge queue; refusing to publish it"
              exit 1
            fi
          fi
          # A failed lookup leaves the moving tags where they are; it does not
          # fail the publish.
          moving=false
          if [[ $GITHUB_REF == refs/heads/* ]]; then
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" || tip=""
            if [ "$tip" = "$SHA" ]; then
              moving=true
            else
              echo "::notice::${GITHUB_REF_NAME} is at '${tip}', not ${SHA}; publishing the sha- tag only"
            fi
          fi
          {
            echo "sha=${SHA}"
            echo "short=${SHA:0:7}"
            echo "moving=${moving}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to GHCR (GitHub Container Registry)
      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Not `type=sha`, and a revision label of our own: metadata-action
          # reads both from github.sha, which is not the commit built on a
          # workflow_run. A custom label replaces the generated one.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.target.outputs.moving == 'true' }}
            type=ref,event=branch,enable=${{ steps.target.outputs.moving == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.target.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
          # The default, latest=auto, adds `latest` to every non-prerelease
          # semver tag, so tagging an older green commit would move :latest
          # back to it. `latest` comes only from the raw line above.
          flavor: |
            latest=false

      # Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # `digest` comes from build-push-action, NOT metadata-action — the latter
      # emits tags/labels/version/json and no digest at all, so this line
      # printed "with digest " and nothing else for as long as it existed. It
      # reads like provenance and carried none.
      #
      # The actionlint gate checks that step `build` exists, not that it emits
      # `digest`: it resolves no outputs for an action pinned by commit sha, so
      # `steps.meta.outputs.digest` would pass it too. Keep this reference by
      # inspection.
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published Docker images with digest ${{ steps.build.outputs.digest }}"

      # Cross-repo queue update authenticates via the faultmaven-infra-queue-bot
      # GitHub App (org INFRA_BOT_CLIENT_ID / INFRA_BOT_PRIVATE_KEY), minting a
      # short-lived token scoped to faultmaven-enterprise-infra. Runs only on the
      # canonical repo's main; forks lack the org creds and skip.
      - name: Mint infra token (GitHub App)
        id: infra-token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INFRA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: faultmaven-enterprise-infra

      # The image queue moved to enterprise-infra's `image-queue` branch
      # (infra#408). This step checks out that branch, and the next one pushes it.
      - name: Checkout enterprise-infra
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: image-queue
          token: ${{ steps.infra-token.outputs.token }}
          path: enterprise-infra

      - name: Install yq
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          # A release asset can be replaced after it ships, and this job holds
          # packages: write and the infra app token. The hash is the release's
          # own `checksums` entry for this file.
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # The queue only moves forward (infra#413). This run replaces the queued
      # entry only when its commit CONTAINS the queued one; GitHub's compare of
      # this repository, queued...this run, decides:
      #   ahead      this run is newer                 -> write
      #   identical  the queue already names it        -> skip
      #   behind     this run is older (an old rerun)  -> skip
      #   diverged   neither contains the other        -> refuse: a red run, for a person
      #   no answer  (the compare failed or said else) -> retry, then a red run
      # Only an unseeded entry (no tag and no commit_sha) is written without a
      # compare. An entry the rule cannot order (a commit_sha that is not hex,
      # a tag naming another commit, no commit at all) is refused, and so is a
      # missing queue file. A refusal writes nothing: a person fixes the entry.
      # Four repositories push this branch, so a push rejected as `fetch first`
      # or `non-fast-forward`, or lost at the server's ref lock, is an ordinary
      # race. It RE-READS origin's file and
      # decides again, so the last writer has always compared against the
      # newest entry. Any other push failure is red. It never rebases: two runs
      # of one repository rewrite the same three lines, and that rebase stops on
      # a conflict.
      - name: Update image queue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ steps.target.outputs.sha }}
          TRIGGERED_BY: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          cd enterprise-infra
          git config user.name "faultmaven-infra-queue-bot[bot]"
          git config user.email "faultmaven-infra-queue-bot[bot]@users.noreply.github.com"

          QUEUE_FILE="available-images/staging/faultmaven.yaml"
          RUN_SHA="$PUBLISH_SHA"
          TAG="sha-${PUBLISH_SHA:0:7}"
          REPO="$GITHUB_REPOSITORY"
          COMMIT_MSG="chore(queue): update faultmaven image to ${TAG}

          Built from: ${REPO}@${RUN_SHA}
          Triggered by: @${TRIGGERED_BY}
          Workflow: ${WORKFLOW_NAME}"
          GHCR="GHCR holds ${TAG} but the queue does not name it."
          HEX='^[0-9a-fA-F]{7,40}$'
          SHA_TAG='^sha-([0-9a-fA-F]{7,40})$'
          RACE='^ ! \[rejected\] .*\((fetch first|non-fast-forward)\)'
          RACE_LOCK='^ ! \[remote rejected\] .*\((incorrect old value provided|cannot lock ref[^)]*|failed to update ref)\)'
          ERR="$(mktemp)"
          trap 'rm -f "$ERR"' EXIT

          # Every value printed into a :: command or the step summary goes
          # through flat(): CR, LF and tab become spaces, so no value can start
          # a line of its own.
          flat() {
            local s="$1"
            s="${s//$'\r'/ }"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s' "$s"
          }
          annotate() {
            printf '::%s::%s\n' "$1" "$(flat "$2")"
          }
          # The FIRST non-blank stderr line of gh, git or yq, without gh's
          # "gh: " prefix. gh's later lines are hints, not the error. Trailing
          # blanks are cut: git pads a "remote: " line with spaces.
          first_err() {
            awk 'NF { sub(/^gh: /, ""); sub(/[ \t\r]+$/, ""); print; exit }' "$ERR"
          }
          # The line of a failed push that says why, trimmed: the first " ! "
          # status line, else the first "remote: " line with text after the
          # prefix, else the first "fatal: " or "error: " line, else the first
          # non-blank line.
          push_err() {
            local line
            line="$(awk '/^ ! / { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk '/^remote: *[^ \t\r]/ { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk '/^(fatal|error): / { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk 'NF { print; exit }' "$ERR")"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            printf '%s' "$line"
          }

          # Sets DECISION (write, skip, refuse or retry), REASON and DETAIL from
          # the queue entry as it stands, and Q to the commit it names.
          decide() {
            local rc status sha tag
            DECISION=""
            REASON=""
            DETAIL=""
            Q=""
            # select(. != null), not // "": yq's // also replaces false, which
            # would read a boolean entry as unseeded.
            if ! sha="$(yq '.commit_sha | select(. != null)' "$QUEUE_FILE" 2>"$ERR")" ||
               ! tag="$(yq '.tag | select(. != null)' "$QUEUE_FILE" 2>"$ERR")"; then
              DECISION="retry"
              REASON="could not read ${QUEUE_FILE}: $(first_err)"
              return 0
            fi
            DETAIL="${QUEUE_FILE} has tag '${tag}' and commit_sha '${sha}'"
            if [ -z "$sha" ] && [ -z "$tag" ]; then
              DECISION="write"   # unseeded: nothing to order against
              return 0
            fi
            if [ -n "$sha" ]; then
              if ! [[ $sha =~ $HEX ]]; then
                DECISION="refuse"
                REASON="the queued commit_sha is not a commit sha"
                return 0
              fi
              # They agree when either hex is a case-insensitive prefix of the other.
              if [ -n "$tag" ] && { ! [[ $tag =~ $SHA_TAG ]] ||
                   [[ ${sha,,} != "${BASH_REMATCH[1],,}"* && ${BASH_REMATCH[1],,} != "${sha,,}"* ]]; }; then
                DECISION="refuse"
                REASON="the queued tag and commit_sha name different commits"
                return 0
              fi
              Q="$sha"
            elif [[ $tag =~ $SHA_TAG ]]; then
              Q="${BASH_REMATCH[1]}"
            else
              DECISION="refuse"
              REASON="the queue entry names no commit this rule can order"
              return 0
            fi
            if [ "$Q" = "$RUN_SHA" ]; then
              DECISION="skip"
              REASON="the queue already names this commit"
              return 0
            fi
            # gh's rc is read before its answer: a 404 prints its JSON body on
            # stdout. per_page=1: only .status is read, not the commit list.
            rc=0
            status="$(gh api "repos/${REPO}/compare/${Q}...${RUN_SHA}?per_page=1" --jq .status 2>"$ERR")" || rc=$?
            if [ "$rc" -ne 0 ]; then
              DECISION="retry"
              REASON="the compare ${Q}...${RUN_SHA} failed: $(first_err)"
              return 0
            fi
            case "$status" in
              ahead)     DECISION="write" ;;
              identical) DECISION="skip";   REASON="the queued ${Q} is this commit" ;;
              behind)    DECISION="skip";   REASON="this run's commit is older than the queued ${Q}" ;;
              diverged)  DECISION="refuse"; REASON="neither commit contains the other"
                         DETAIL="${QUEUE_FILE} names ${Q} and this run is ${RUN_SHA}" ;;
              *)         DECISION="retry";  REASON="the compare ${Q}...${RUN_SHA} answered '${status}'" ;;
            esac
          }

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && ! { git fetch -q origin image-queue && git reset -q --hard FETCH_HEAD; }; then
              REASON="could not re-read origin/image-queue"
              annotate warning "${REASON} (attempt ${attempt}/3)"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
              continue
            fi
            # Not transient, so not retried.
            if [ ! -f "$QUEUE_FILE" ]; then
              annotate error "Queue file not found: ${QUEUE_FILE} on image-queue - register the service first. ${GHCR}"
              exit 1
            fi
            decide
            case "$DECISION" in
              skip)
                annotate notice "${REASON}; the queue keeps ${Q} in ${QUEUE_FILE}"
                {
                  echo "## Image queue"
                  echo ""
                  printf '%s\n' "$(flat "\`${QUEUE_FILE}\` is unchanged: ${REASON}. It keeps \`${Q}\`; this run is \`${RUN_SHA}\`.")"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              refuse)
                annotate error "${REASON}: ${DETAIL}. The queue is left as it is. ${GHCR}"
                exit 1
                ;;
              retry)
                annotate warning "${REASON} (attempt ${attempt}/3)"
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
                ;;
              write)
                echo "Updating ${QUEUE_FILE} to ${TAG}"
                if ! { yq -i ".tag = \"${TAG}\"" "$QUEUE_FILE" &&
                       yq -i ".updated_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$QUEUE_FILE" &&
                       yq -i ".commit_sha = \"${RUN_SHA}\"" "$QUEUE_FILE" &&
                       git add "$QUEUE_FILE" &&
                       git commit -q -m "$COMMIT_MSG"; }; then
                  annotate error "could not write ${QUEUE_FILE} in the checkout. ${GHCR}"
                  exit 1
                fi
                rc=0
                git push origin image-queue 2>"$ERR" || rc=$?
                cat "$ERR" >&2
                if [ "$rc" -eq 0 ]; then
                  echo "✓ Updated image queue: ${TAG}"
                  exit 0
                fi
                if ! grep -Eq -e "$RACE" -e "$RACE_LOCK" "$ERR"; then
                  annotate error "the push to image-queue failed, not as a race: $(push_err). ${GHCR}"
                  exit 1
                fi
                REASON="the push to image-queue was rejected"
                annotate warning "push rejected; recomputing against origin/image-queue (attempt ${attempt}/3)"
                ;;
            esac
          done
          annotate error "could not update the queue after 3 attempts: ${REASON}. ${GHCR}"
          exit 1
