name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Login to GHCR (GitHub Container Registry)
      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_DOCKER }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Add image digest to job summary
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published Docker images with digest ${{ steps.meta.outputs.digest }}"

      # Checkout enterprise-infra repository
      - name: Checkout enterprise-infra
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: develop
          token: ${{ secrets.PAT_CROSS_REPO_ACCESS }}
          path: enterprise-infra

      # Update image queue for promotion workflow
      - name: Update image queue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd enterprise-infra

          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update the queue file
          QUEUE_FILE="available-images/staging/faultmaven.yaml"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > "$QUEUE_FILE" << EOF
          # FaultMaven Modular Monolith Backend
          # Updated by: faultmaven/.github/workflows/publish-docker.yml
          # Consumed by: promote-images.yaml workflow

          image: ghcr.io/faultmaven/faultmaven
          tag: sha-${SHA_SHORT}
          updated_at: "${TIMESTAMP}"
          commit_sha: "${GITHUB_SHA}"
          EOF

          # Commit and push
          git add "$QUEUE_FILE"
          if git diff --staged --quiet; then
            echo "No changes to queue file"
          else
            git commit -m "chore(queue): update faultmaven image to sha-${SHA_SHORT}

          Built from: ${{ github.repository }}@${GITHUB_SHA}
          Triggered by: @${{ github.actor }}
          Workflow: ${{ github.workflow }}"
            git push origin develop
            echo "✓ Updated image queue: sha-${SHA_SHORT}"
          fi
