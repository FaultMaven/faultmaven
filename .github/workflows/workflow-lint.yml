name: Workflow Lint

# =============================================================================
# WORKFLOW SCHEMA + EXPRESSION + SHELL LINT
# =============================================================================
# YAML parsing proves a workflow is well-formed. It does not know that a
# `needs:` target exists, that a context or an expression is valid, or that a
# `run:` script is sound. actionlint does.
#
# It does NOT check an action's inputs or outputs here. actionlint knows those
# only for an action pinned by a tag it has a record of, and every action in
# this fleet is pinned by commit sha, so a misspelt `with:` key or a
# `steps.<id>.outputs.<name>` the action never emits passes it. Check those
# against the action's action.yml at the pinned sha.
#
# faultmaven-enterprise-infra has had this gate since infra#177; the service
# repositories never did. Its first run, in faultmaven-dashboard while actions
# were still pinned by tag, found `steps.meta.outputs.digest` — a provenance
# log line that had printed an EMPTY digest for as long as it existed, because
# docker/metadata-action does not emit `digest` at all. Nothing was wrong
# enough to fail a build, which is exactly why nobody noticed.
#
# Blocking, not `continue-on-error`. An advisory lint whose green means nothing
# is worse than no lint.
#
# SHELLCHECK_OPTS mirrors faultmaven-enterprise-infra's `-S warning` threshold,
# deliberately. Below `warning`, the `run:` blocks across this fleet emit dozens
# of SC2086 complaints about unquoted `$GITHUB_OUTPUT` — the shape of finding
# that teaches people to close a gate unread. Keep the three service-repo copies
# of this file byte-identical, as with the other fleet-wide lints.
# =============================================================================

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
          SHELLCHECK_OPTS: '-S warning'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -version
          actionlint -color
