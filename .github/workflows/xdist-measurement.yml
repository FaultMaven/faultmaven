name: xdist Measurement

# =============================================================================
# NON-REQUIRED MEASUREMENT OF pytest-xdist ON THE TWO REQUIRED TEST JOBS (#1594)
# =============================================================================
# `Test Standalone` and `Test Cloud` (ci-cd.yml) run `pytest tests/` serially.
# #1594 asks whether `-n auto --dist loadfile` would make them faster AND keep
# the failure set stable, because the failing set was recorded shifting between
# runs under whole-suite xdist. This workflow answers that question without
# changing either required job: it re-runs each job's exact selection, flags
# and environment in arms that differ only in the distribution --
#
#   serial   the required job's own invocation, re-run here so the baseline
#            shares this workflow's runner draw and its log shape
#   xdist-a  + `-n auto --dist loadfile`
#   xdist-b  the same again, so one run is never read as evidence of stability
#   xdist-logical-a/-b  `-n logical --dist loadfile`, twice
#
# Why a `logical` pair: `-n auto` counts PHYSICAL cores when psutil is
# importable, and the 4-vCPU ubuntu-latest runner reports 2 of them -- the
# first run here created 2 workers, not 4. `logical` uses every vCPU, so the
# pair measures whether the other two are worth anything.
#
# `loadfile` rather than the default `load`: a module stays on one worker, so
# module-scoped state (notably #1626's `booted_app_client`, one app lifespan
# per module) is paid once per module rather than once per worker.
#
# Nothing here is a required check and nothing here gates a merge. The numbers
# are read from the job logs by `scripts/xdist_measurement.py`, which fetches
# the check runs BY COMMIT and diffs the failure lists.
#
# Kept, not removed: it runs only when this file or its script changes, or on
# demand (`gh workflow run xdist-measurement.yml`), so it costs nothing on an
# ordinary pull request, and it is the before/after instrument #1594's
# follow-up needs once isolation work lands. Delete this file together with
# the script when xdist becomes the required jobs' invocation.
# =============================================================================

on:
  pull_request:
    paths:
      - '.github/workflows/xdist-measurement.yml'
      - 'scripts/xdist_measurement.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-standalone:
    name: xdist Measurement Standalone (${{ matrix.arm }})
    runs-on: ubuntu-latest
    # Above the required job's 45: a serial arm can land on a slow runner, and a
    # cancelled arm prints no summary line, which is the one thing measured.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arm: [serial, xdist-a, xdist-b, xdist-logical-a, xdist-logical-b]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/test.txt'

      - name: Install Standalone (minimal deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Record the runner
        # `-n auto` resolves to the CPU count, so the measurement is only
        # readable next to it. The script parses the two XDIST_MEASURE lines;
        # lscpu says how many of the vCPUs are physical cores.
        run: |
          echo "XDIST_MEASURE nproc=$(nproc)"
          echo "XDIST_MEASURE commit=$(git rev-parse HEAD)"
          lscpu | grep -E '^(CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' || true

      - name: Run Tests (Standalone, ${{ matrix.arm }})
        env:
          ARM: ${{ matrix.arm }}
          # Identical to Test Standalone in ci-cd.yml.
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
          TRACING_ENABLED: "false"
          METRICS_ENABLED: "false"
          PROTECTION_ENABLED: "false"
          SANITIZE_PII: "false"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"
        run: |
          case "${ARM}" in
            serial) dist=() ;;
            xdist-logical-*) dist=(-n logical --dist loadfile) ;;
            *) dist=(-n auto --dist loadfile) ;;
          esac
          echo "XDIST_MEASURE arm=${ARM}"
          # A red run is data here, not a failure of the measurement: the
          # step always passes, and the log's summary line carries the result.
          pytest tests/ "${dist[@]}" \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not cloud and not benchmark" \
            --durations=0 \
            --durations-min=1.0 \
            -v || echo "XDIST_MEASURE pytest_exit=$?"

  measure-cloud:
    name: xdist Measurement Cloud (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arm: [serial, xdist-a, xdist-b, xdist-logical-a, xdist-logical-b]

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements/cloud.txt'

      - name: Install Cloud (full deps) from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cloud.txt
          pip install -e . --no-deps

      - name: Verify the cloud Redis pairing
        run: python scripts/check_redis_pairing.py

      - name: Record the runner
        run: |
          echo "XDIST_MEASURE nproc=$(nproc)"
          echo "XDIST_MEASURE commit=$(git rev-parse HEAD)"
          lscpu | grep -E '^(CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' || true

      - name: Run Tests (Cloud, ${{ matrix.arm }})
        env:
          ARM: ${{ matrix.arm }}
          # Identical to Test Cloud in ci-cd.yml.
          SKIP_SERVICE_CHECKS: "true"
          OPIK_ENABLED: "false"
          OPIK_TRACK_DISABLE: "true"
          PROMETHEUS_ENABLED: "true"
          TRACING_ENABLED: "true"
          METRICS_ENABLED: "true"
          PROTECTION_ENABLED: "true"
          SANITIZE_PII: "true"
          USER_STORAGE_TYPE: "inmemory"
          CASE_STORAGE_TYPE: "inmemory"
          VECTOR_STORAGE_TYPE: "inmemory"
        run: |
          case "${ARM}" in
            serial) dist=() ;;
            xdist-logical-*) dist=(-n logical --dist loadfile) ;;
            *) dist=(-n auto --dist loadfile) ;;
          esac
          echo "XDIST_MEASURE arm=${ARM}"
          pytest tests/ "${dist[@]}" \
            --cov=faultmaven \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not benchmark" \
            --durations=0 \
            --durations-min=1.0 \
            -v || echo "XDIST_MEASURE pytest_exit=$?"
