# Pre-commit hooks to prevent API key exposure
# Install: pip install pre-commit && pre-commit install
#
# `default_install_hook_types` is what makes `pre-commit install` wire the
# post-merge and post-checkout stages as well. Without it the framework installs
# the pre-commit stage only, and the venv-staleness warning below would never
# run for anyone on this path — which is the recommended one, since
# scripts/install-git-hooks.sh deliberately refuses to take over core.hooksPath
# while the framework owns .git/hooks (doing so would disable secret scanning).
# Existing clones need one `pre-commit install` to pick the new types up.
default_install_hook_types: [pre-commit, post-merge, post-checkout]

repos:
  # Detect secrets and API keys
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
          - '--exclude-files'
          - '.*\.lock$'
          - '--exclude-files'
          - 'package-lock\.json$'
        exclude: |
          (?x)^(
            .*\.lock$|
            package-lock\.json$|
            poetry\.lock$|
            .*\.min\.js$
          )$

  # Check for common secret patterns
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # The KB pack ships build-time BGE-M3 vectors as a ~5MB float32 artifact
        # so first-boot KB ingestion is seconds, not ~hours. Generated by
        # faultmaven-kb-toolkit (kb-build-pack) and vendored here, not hand-edited.
        exclude: ^resources/knowledge/pack/vectors\.npz$
      - id: check-json
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: |
          (?x)^(
            \.pre-commit-config\.yaml$|
            docs/operations/security/.*|
            scripts/security/.*|
            scripts/generate_oauth_keys\.py$|
            faultmaven/infrastructure/security/redaction\.py$|
            tests/unit/services/test_auth_service\.py$
          )$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # Code formatting (black)
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.11

  # Linting and import sorting (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82,I", --fix, --exit-non-zero-on-fix]

  # Custom hook to detect API key patterns
  - repo: local
    hooks:
      - id: check-api-keys
        name: Check for API keys
        entry: >-
          bash -c 'if grep -r
          "sk-proj\|sk-pro\|AIza[A-Za-z0-9_-]\{35\}\|gsk_[A-Za-z0-9]\{52\}\|fw_[A-Za-z0-9_-]\{20,\}\|hf_[A-Za-z0-9]\{34,\}\|sk-or-v1"
          "$@"; then echo "ERROR - API key pattern detected!"; exit 1; fi' --
        language: system
        pass_filenames: true
        files: \.(py|js|ts|jsx|tsx|md|txt|yml|yaml|json|env)$
        exclude: |
          (?x)^(
            \.git/.*|
            \.venv/.*|
            node_modules/.*|
            __pycache__/.*|
            .*\.min\.js$|
            \.secrets\.baseline$|
            \.pre-commit-config\.yaml$|
            docs/operations/security/.*|
            docs/development/.*
          )$

      - id: check-hardcoded-rsa-keys
        name: Check for hardcoded RSA private keys
        entry: >-
          bash -c 'if grep -r
          "BEGIN RSA PRIVATE KEY\|BEGIN PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY"
          "$@" | grep -v "scripts/generate_oauth_keys.py"; then
          echo "ERROR - Hardcoded RSA private key detected!"; exit 1; fi' --
        language: system
        pass_filenames: true
        files: \.(py|js|ts|jsx|tsx|md|txt|yml|yaml|json)$
        exclude: |
          (?x)^(
            \.git/.*|
            \.venv/.*|
            node_modules/.*|
            __pycache__/.*|
            docs/operations/security/.*|
            \.secrets\.baseline$|
            \.pre-commit-config\.yaml$|
            scripts/generate_oauth_keys\.py$|
            faultmaven/infrastructure/security/redaction\.py$|
            tests/unit/services/test_auth_service\.py$
          )$

      # The bundled KB pack must be structurally valid AND in sync with the
      # runbook sources under resources/knowledge/runbooks/. Catches a runbook
      # edited/added without rebuilding the pack. Runs when a source runbook OR
      # the pack changes; no model, fast.
      - id: check-kb-pack
        name: KB pack valid + in sync with runbook sources
        entry: python scripts/check_kb_pack.py
        language: system
        pass_filenames: false
        files: ^resources/knowledge/(runbooks/.*\.md|pack/(pack\.json|vectors\.npz))$

      # Brand-messaging terminology lint. Fails on retired terms in brand-facing
      # files (README, CLAUDE.md, pyproject, docs/README). Canonical source is
      # .claude/skills/brand-messaging.md §3/§7; this is the downstream check.
      - id: brand-lint
        name: brand-messaging terminology lint
        entry: python scripts/brand_lint.py
        language: system
        pass_filenames: false
        always_run: true

      # Warn when a virtualenv built by scripts/sync-venv.sh no longer matches
      # the lockfile it was stamped from — a pull or branch switch moves the
      # file and never the environment. Same script the .githooks/ hooks call,
      # so both installation paths behave identically.
      #
      # Warn-only by construction: it exits 0 on every path, so it can never
      # block a merge or checkout, and it prints nothing unless a stamped venv
      # is actually behind. Contributors who have not run sync-venv.sh have no
      # stamp and never see it.
      # `verbose: true` is load-bearing, not cosmetic. pre-commit shows a hook's
      # output only when the hook FAILS; this one exits 0 by design, so without
      # verbose it prints "Passed" and swallows the warning — the check would
      # run and tell nobody. Verified: with it, the warning is shown.
      - id: venv-staleness
        name: warn when a virtualenv is behind its lockfile
        entry: .githooks/check-venv-staleness.sh
        language: script
        stages: [post-merge, post-checkout]
        pass_filenames: false
        always_run: true
        verbose: true
