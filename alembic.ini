[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL - overridden by DATABASE_URL env var in env.py
sqlalchemy.url = sqlite:///data/faultmaven.db


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

# No handler: alembic/env.py installs the jobs' line on stderr (#2888).
[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
