# FaultMaven Alembic Configuration
#
# Database migrations are managed using Alembic.
# See docs/development/DATABASE_MIGRATIONS.md for usage guide.
#
# Environment Variables:
#   DATABASE_URL - Primary database URL for migrations
#   AUTH_DB_URL  - Auth database URL (alternative)
#   CASES_DB_URL - Cases database URL (alternative)
#
# Usage:
#   alembic upgrade head              # Apply all migrations
#   alembic downgrade -1              # Rollback one migration
#   alembic revision -m "description" # Create new migration
#
# For multi-database setup:
#   alembic -x database=auth upgrade head   # Migrate auth_db only
#   alembic -x database=cases upgrade head  # Migrate cases_db only

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template for migration file names
# Format: YYYYMMDD_HHMM_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Path separator
path_separator = os

# Max slug length
truncate_slug_length = 50

# Output encoding
output_encoding = utf-8

# Database URL - Loaded from environment in env.py
# DO NOT hardcode database URLs here - use environment variables
# sqlalchemy.url is set dynamically in env.py

# Post-write hooks for code formatting (disabled by default)
# Uncomment to enable black formatting for new migrations
[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
