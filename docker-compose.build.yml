# Build override: build the FaultMaven API from THIS repository's source instead
# of pulling the pre-built GHCR image. Layered on top of docker-compose.yml.
#
# Invoked by:  ./faultmaven.sh start --build   (and ./faultmaven.sh build)
# Equivalent:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The `image:` tag from docker-compose.yml still applies — the locally built
# image is tagged ghcr.io/faultmaven/faultmaven:${FM_IMAGE_TAG:-latest}. On the
# default `latest` that is the tag a later plain `./faultmaven.sh start` (or a
# `restart` issued while the stack is stopped) refreshes from GHCR, replacing
# your build. Keep starting with `--build`, or set FM_IMAGE_TAG=local and pin
# FM_DASHBOARD_IMAGE_TAG in .env before building: `start` pulls only while
# one of the two tags is `latest`.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

  demo-seeder:
    build:
      context: .
      dockerfile: Dockerfile
