# FaultMaven Development Configuration
#
# This configuration runs the API with external backing services (Redis, ChromaDB).
# Use this for development when you need persistent sessions and vector storage.
#
# For simple Quick Start with in-memory storage, use: docker compose up
# For this dev configuration, use: docker compose -f docker-compose.dev.yml up
#
# Note: This does NOT include the Dashboard. Run it separately or add it to this file.

services:
  faultmaven-backend:
    build: .
    ports:
      - "8090:8090"
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Note: In production, these services run in K8s cluster
      # For local development, you can use local services or connect to K8s
      - REDIS_URL=redis://redis:6379  # Local development fallback
      - CHROMADB_URL=http://chromadb:8000  # Local development fallback
      # - PRESIDIO_HOST=presidio.faultmaven.local  # K8s service (requires /etc/hosts setup)
      # - PRESIDIO_ANALYZER_PORT=30433
      # - PRESIDIO_ANONYMIZER_PORT=30434
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
      - chromadb

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.basic_authn.BasicAuthenticationServerProvider
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

  # PostgreSQL for persistent storage (optional future enhancement)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: faultmaven
  #     POSTGRES_USER: faultmaven
  #     POSTGRES_PASSWORD: faultmaven_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U faultmaven"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  redis_data:
  chromadb_data:
  # postgres_data:
  data: 