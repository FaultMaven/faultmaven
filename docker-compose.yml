# FaultMaven Full-Stack - Quick Start Configuration
#
# This is the simplest way to run FaultMaven locally.
# Uses in-memory storage (SQLite, in-memory sessions/vectors) - no external services required.
#
# Usage:
#   1. Copy .env.example to .env and configure your LLM provider
#   2. docker compose up
#   3. Open http://localhost:3000 (Dashboard)
#   4. Install the Copilot browser extension
#
# For development with external services (Redis, ChromaDB), see docker-compose.dev.yml

services:
  api:
    build: .
    # Or use pre-built image:
    # image: faultmaven/faultmaven:latest
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Local deployment uses in-memory storage (no external services needed)
      - SESSION_STORAGE_TYPE=inmemory
      - VECTOR_STORAGE_TYPE=inmemory
      - CASE_STORAGE_TYPE=database
      - DATABASE_URL=sqlite+aiosqlite:///./data/faultmaven.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    image: faultmaven/faultmaven-dashboard:latest
    # Or build from source:
    # build:
    #   context: ../faultmaven-dashboard
    #   dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
