# FaultMaven Full-Stack - Quick Start Configuration
#
# This is the simplest way to run FaultMaven locally.
# No external services required - local deployment uses SQLite, FakeRedis, and
# embedded ChromaDB.
#
# Usage:
#   1. Copy .env.example to .env and configure your LLM provider
#   2. ./faultmaven.sh start
#   3. Open http://localhost:3333 (Dashboard)
#   4. Install the Copilot browser extension
#
# Demo Mode (with sample data):
#   ./faultmaven.sh start --demo
#
# For local development without Docker, use: ./scripts/faultmaven-dev.sh

services:
  api:
    build: .
    image: faultmaven/faultmaven:latest
    ports:
      - "8090:8090"
    environment:
      - HOST=0.0.0.0  # Container must bind all interfaces for port mapping
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    image: faultmaven/faultmaven-dashboard:latest
    # Or build from source:
    # build:
    #   context: ../faultmaven-dashboard
    #   dockerfile: Dockerfile
    ports:
      - "3333:80"
    environment:
      - API_URL=http://api:8090
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Demo mode: Seeds sample runbooks and a demo incident case
  # Activate with: docker compose --profile demo up
  demo-seeder:
    image: faultmaven/faultmaven:latest
    # Or build from source: build: .
    profiles:
      - demo
    environment:
      - FAULTMAVEN_DEMO_MODE=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/faultmaven.db
      - VECTOR_STORAGE_TYPE=chromadb
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./demo:/app/demo:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "demo.seed_demo_data"]
    restart: "no"

volumes:
  data:
