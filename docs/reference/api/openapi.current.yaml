    InquiryData:
      properties:
        problem_confirmation:
          anyOf:
          - $ref: '#/components/schemas/ProblemConfirmation'
          - type: 'null'
          description: Agent initial understanding of the problem
        proposed_problem_statement:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Proposed Problem Statement
          description: "\n        Agent formalized problem statement (clear, specific,\
            \ actionable) - ITERATIVE REFINEMENT pattern.\n\n        UI Display:\n\
            \        - When None: Display \"To be defined\" or blank (no problem detected\
            \ yet)\n        - When set: Display the statement text\n\n        Lifecycle:\n\
            \        1. LLM creates initial formalization from conversation context\n\
            \        2. LLM can UPDATE iteratively based on user corrections/refinements\n\
            \        3. Becomes IMMUTABLE once problem_statement_confirmed = True\n\
            \        4. Copied to case.description when investigation starts\n\n \
            \       Pattern: Iterative Refinement - refine until user confirms without\
            \ reservation\n        "
        problem_statement_confirmed:
          type: boolean
          title: Problem Statement Confirmed
          description: User confirmed the formalized problem statement
          default: false
        problem_statement_confirmed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Problem Statement Confirmed At
          description: When user confirmed the problem statement
        handshake_deferred_at_turn:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Handshake Deferred At Turn
          description: Turn number on which the same-turn-confirmation guard fired.
            When current_turn == this+1, context_builder injects HANDSHAKE_DEFERRED
            (re-present + ask) instead of NOT_YET_CONFIRMED, and the engine deterministically
            emits confirmation suggestions. Self-clears by becoming stale on subsequent
            turns.
        decided_to_investigate:
          type: boolean
          title: Decided To Investigate
          description: Whether user committed to formal investigation
          default: false
        decision_made_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Decision Made At
          description: When user decided to investigate (or not)
        inquiry_turns:
          type: integer
          minimum: 0.0
          title: Inquiry Turns
          description: Number of turns spent in INQUIRY state
          default: 0
        knowledge_matches:
          items:
            $ref: '#/components/schemas/KnowledgeMatch'
          type: array
          title: Knowledge Matches
          description: Potential solutions found in KB
        knowledge_resolution:
          anyOf:
          - $ref: '#/components/schemas/KnowledgeResolution'
          - type: 'null'
          description: Resolution details if fixed via KB match
        preliminary_urgency:
          anyOf:
          - $ref: '#/components/schemas/PreliminaryUrgency'
          - type: 'null'
          description: Early urgency assessment
      type: object
      title: InquiryData
      description: 'Pre-investigation INQUIRY state data.

        Captures early problem exploration before formal investigation commitment.'
    InquiryResponseData:
      properties:
