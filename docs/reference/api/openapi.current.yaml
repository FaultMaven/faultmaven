    UploadedFile:
      properties:
        file_id:
          type: string
          pattern: ^(file_|data_)[a-f0-9]{12,16}$
          title: File Id
          description: Unique file identifier (same as data_id in data service)
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
          description: Original filename
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
          description: File size in bytes
        content_type:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Content Type
          description: MIME type as reported on upload (e.g., text/plain, application/pdf).
        content_hash:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Content Hash
          description: SHA-256 of the raw file content. Used for storage-backend dedup
            and integrity checks. NULL when the upload is still streaming or hashing
            was skipped.
        uploaded_at_turn:
          type: integer
          minimum: 0.0
          title: Uploaded At Turn
          description: Turn number when file was uploaded
        uploaded_at:
          type: string
          format: date-time
          title: Uploaded At
          description: Upload timestamp
        uploaded_by:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: Uploaded By
          description: User who uploaded the file. NULL for system-generated uploads
            or after the originating user is deleted (FK SET NULL).
        upload_source:
          type: string
          maxLength: 50
          title: Upload Source
          description: 'Provenance of the upload: how the file got into the system.
            Values: file_upload, paste, screenshot, page_capture, agent_generated,
            conversion_source. Distinct from evidence.source_type, which classifies
            the data shape. page_capture is the marker the rerank-page-sections pass
            uses to detect Copilot extension page submissions; see context_builder.py.'
          default: file_upload
        storage_ref:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Storage Ref
          description: Opaque key passed to IFileStorageBackend.retrieve_file(). The
            backend interprets it (local FS path, S3 key, Azure blob name, etc.).
            May be None if processing pending.
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: Preprocessing-generated short summary of the file. Used by
            the investigation agent to orient on file content without loading the
            whole file. May be None when preprocessing was skipped (e.g., KB-conversion
            source uploads).
        structural_index:
          anyOf:
          - type: string
          - type: 'null'
          title: Structural Index
          description: Preprocessing-generated structural index of the file content
            (file_extract + search_map + file_meta). Read by the LLM in <evidence_collected>
            when the agent inspects the file. May be None when preprocessing was skipped.
        data_type:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Data Type
          description: Preprocessor's data-type classification of the file's content
            (e.g., 'logs', 'metrics', 'configuration'). Distinct from evidence.source_type,
            which classifies an individual extract's source type.
        coverage_start_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Coverage Start Ts
          description: Earliest timestamp parsed from the file's content. None when
            the file has no parseable timestamps.
        coverage_end_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Coverage End Ts
          description: Latest timestamp parsed from the file's content. None when
            the file has no parseable timestamps.
      type: object
      required:
      - filename
      - size_bytes
      - uploaded_at_turn
      title: UploadedFile
      description: "File the user submitted to a case (upload, paste, page capture).\n\
        \nPost-010 strict evidence model \u2014 two-table separation:\n- **UploadedFile**:\
        \ the file-of-record. Exists in any case state\n  (INQUIRY, INVESTIGATING,\
        \ terminal). Carries the raw bytes (via\n  ``storage_ref``) and the preprocessing\
        \ artifacts (``summary``,\n  ``structural_index``, ``data_type``, coverage\
        \ timestamps) that\n  describe the file's content.\n- **Evidence**: the claim-anchored\
        \ extract-of-record. Created only\n  during INVESTIGATING when the LLM extracts\
        \ a focused slice via\n  ``evidence_to_add`` to support a specific claim (symptom,\
        \ cause,\n  mitigation, or solution).\n\nFiles are not evidence. An evidence\
        \ row references its source file\nvia ``Evidence.source_file_id``; the file\
        \ row holds the file-level\nmetadata so the evidence row can stay focused\
        \ on the claim it\nsupports. Not all uploaded files produce evidence \u2014\
        \ the LLM\ndecides which slices, if any, are claim-relevant."
    UploadedFileDetailsResponse:
      properties:
        file_id:
          type: string
          title: File Id
        filename:
          type: string
          title: Filename
        size_bytes:
          type: integer
          title: Size Bytes
        size_display:
          type: string
          title: Size Display
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: MIME type as reported on upload
        content_hash:
