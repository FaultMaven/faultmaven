      - mitigation
      - solution
      - diagnostic
      title: InvestigationActionType
      description: Type of action proposed during investigation.
    InvestigationMomentum:
      type: string
      enum:
      - high
      - moderate
      - low
      - blocked
      title: InvestigationMomentum
      description: 'Investigation momentum indicator for progress tracking.


        Used to signal overall investigation health and guide agent behavior.

        Calculated from recent progress patterns (evidence collection, hypothesis
        updates).'
    InvestigationPath:
      type: string
      enum:
      - mitigation_first
      - root_cause
      title: InvestigationPath
      description: "Investigation routing strategy (2-stage model with mitigation\
        \ detour).\n\nPath is SYSTEM-RECOMMENDED from the (temporal_state x urgency_level)\
        \ matrix\nand USER-CONFIRMED via Gate 2. The LLM provides inputs (temporal_state,\n\
        urgency_level) during inquiry; the router in investigation_router.py\nproduces\
        \ a deterministic recommendation from those user-stated inputs;\nthe user\
        \ accepts or overrides via a COOPERATIVE suggestion (Gate 2).\nPost-INV-19\
        \ redesign, Gate 2 fires inside INVESTIGATING after the agent\nsets ``symptom_verified=True``,\
        \ so the user's accept/override decision\nhappens with the agent's symptom-validation\
        \ work visible in the\ntranscript. The recommendation algorithm itself is\
        \ unchanged \u2014 it\nstill reads ``case.inquiry.preliminary_urgency``; what\
        \ the timing\nmove changed is the *override context the user sees*. Making\
        \ the\nrecommendation evidence-derived is deferred follow-up. LLM does NOT\n\
        choose the path directly."
    InvestigationProgress:
      properties:
        mitigation_accepted:
          type: boolean
          title: Mitigation Accepted
          description: "User complied with proposed temp fix (inferred from submission).\
            \ Triggers DIAGNOSIS \u2192 MITIGATION transition."
          default: false
        mitigation_verified:
          type: boolean
          title: Mitigation Verified
          description: "User confirmed mitigation worked. Triggers MITIGATION \u2192\
            \ DIAGNOSIS return for RCA."
          default: false
        solution_accepted:
          type: boolean
          title: Solution Accepted
          description: "User complied with proposed solution (inferred from submission).\
            \ Triggers DIAGNOSIS \u2192 TREATMENT transition."
          default: false
        solution_verified:
          type: boolean
          title: Solution Verified
          description: "Solution effectiveness verified via User-Agent Handshake.\
            \ NOT directly settable by LLM \u2014 requires explicit user confirmation.\
            \ Triggers TREATMENT \u2192 RESOLVED transition."
          default: false
        symptom_verified:
          type: boolean
          title: Symptom Verified
          description: Symptom confirmed with concrete evidence (logs, metrics, user
            reports)
          default: false
        root_cause_identified:
          type: boolean
          title: Root Cause Identified
          description: Root cause determined (directly or via hypothesis validation)
          default: false
        solution_proposed:
          type: boolean
          title: Solution Proposed
          description: Set programmatically when ProposedAction with action_type=SOLUTION
            is created. Not directly set by LLM.
          default: false
        root_cause_likelihood:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Root Cause Likelihood
          description: Likelihood in root cause identification (0.0 = unknown, 1.0
            = certain)
          default: 0.0
        root_cause_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Root Cause Method
          description: 'How root cause was identified: direct_analysis | hypothesis_validation
            | single_shot_validation | correlation | user_provided | other'
        verification_completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verification Completed At
          description: When symptom verification milestone was completed
        investigation_completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Investigation Completed At
          description: When root cause was identified
        resolution_completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolution Completed At
          description: When solution was verified
      type: object
      title: InvestigationProgress
      description: "Evidence-driven progress tracking with two distinct milestone\
        \ types:\n\n1. STAGE-GATE MILESTONES (4): Drive stage transitions.\n   Set\
        \ by the LLM in structured output when it detects user compliance\n   with\
        \ a ProposedAction (Framework \xA74.1). The LLM is the compliance\n   detector\
        \ \u2014 the user's action is the trigger; the LLM recognizes it.\n2. PROGRESS\
        \ INDICATORS (6): Provide LLM context and analytics.\n   Set by LLM in structured\
        \ output. Do NOT drive stage transitions."
    InvestigationProgressSummary:
      properties:
        completed_indicators:
          items:
            type: string
          type: array
          title: Completed Indicators
          description: Completed progress indicators (e.g. symptom_verified, root_cause_identified)
        completed_stage_gates:
          items:
            type: string
          type: array
          title: Completed Stage Gates
          description: Completed stage-gate milestones (e.g. mitigation_accepted,
            solution_verified)
        current_stage:
          $ref: '#/components/schemas/InvestigationStage'
          description: 'Current stage: DIAGNOSIS | MITIGATION | TREATMENT'
        turns_without_progress:
          type: integer
          title: Turns Without Progress
          description: Consecutive turns without milestone, evidence, or hypothesis
            progress
          default: 0
        total_evidence:
