          $ref: '#/components/schemas/UrgencyLevel'
          description: Urgency classification for path routing
          default: unknown
        urgency_factors:
          items:
            type: string
          type: array
          title: Urgency Factors
          description: Factors contributing to urgency assessment
        rca_infeasible:
          type: boolean
          title: Rca Infeasible
          description: "Advisory signal: root cause analysis is infeasible for this\
            \ problem. Set by the LLM during verification when the problem involves\
            \ uncontrollable external dependencies, deprecated/EOL systems, or known\
            \ intractable conditions where mitigation is the accepted strategy. Does\
            \ NOT affect path selection \u2014 influences post-mitigation agent behavior\
            \ only."
