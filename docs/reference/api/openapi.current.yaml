openapi: 3.1.0
info:
  title: FaultMaven API
  description: AI-powered troubleshooting copilot for Engineers, SREs, and DevOps
    professionals
  version: 1.0.0
paths:
  /api/v1/cases/{case_id}/sessions/{session_id}/execute:
    post:
      tags:
      - Agent Execution
      summary: Execute AI agent for troubleshooting investigation
      description: 'Execute an AI agent to analyze the case and generate recommendations.

        Supports streaming (SSE) or non-streaming mode.


        **Authentication:**

        - JWT Bearer token: Authorization: Bearer <token>


        **Streaming Mode (stream=true, default):**

        Returns Server-Sent Events (SSE) with real-time updates including:

        - `started`: Execution has begun

        - `thinking`: Agent is reasoning/processing

        - `tool_call`: Tool invocation requested

        - `tool_result`: Tool execution completed

        - `response`: Incremental response chunk

        - `error`: Error occurred

        - `completed`: Execution finished


        **Non-Streaming Mode (stream=false):**

        Returns complete AgentExecutionResponse when done.


        The agent will:

        - Analyze case context and previous conversation

        - Use available tools (read evidence, search knowledge)

        - Generate hypotheses and recommendations

        - Stream thinking process in real-time


        Token usage is tracked and the session will auto-pause if budget is exceeded.'
      operationId: execute_agent_api_v1_cases__case_id__sessions__session_id__execute_post
      security:
      - HTTPBearer: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          description: Case ID
          title: Case Id
        description: Case ID
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Investigation session ID
          title: Session Id
        description: Investigation session ID
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionRequest'
      responses:
        '200':
          description: Agent execution completed (non-streaming) or SSE stream (streaming)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionResponse'
            text/event-stream:
              schema:
                type: string
              example: 'event: started

                data: {"content":"Execution started","metadata":{"execution_id":"exec-123"}}


                '
        '404':
          description: Session not found
        '403':
          description: Forbidden - wrong organization
        '409':
          description: Conflict - session not active or budget exceeded
        '422':
          description: Validation error
        '500':
          description: LLM or tool execution error
  /api/v1/cases/{case_id}/sessions/{session_id}/executions:
    get:
      tags:
      - Agent Execution
      summary: List executions for case
      description: 'List all agent executions for the case.


        **Note**: Executions are stored at the case level, not the session level.

        The session_id in the path is for URL consistency with the execute endpoint,

        but filtering is done by case_id. All executions for the case are returned

        regardless of which session initiated them.'
      operationId: list_executions_api_v1_cases__case_id__sessions__session_id__executions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          description: Case ID
          title: Case Id
        description: Case ID
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session ID (for URL consistency, not used for filtering)
          title: Session Id
        description: Session ID (for URL consistency, not used for filtering)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items: {}
                title: Response List Executions Api V1 Cases  Case Id  Sessions  Session
                  Id  Executions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/sessions/{session_id}/executions/{execution_id}:
    get:
      tags:
      - Agent Execution
      summary: Get execution by ID
      description: Get details of a specific agent execution.
      operationId: get_execution_api_v1_cases__case_id__sessions__session_id__executions__execution_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          description: Case ID
          title: Case Id
        description: Case ID
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session ID (for URL consistency)
          title: Session Id
        description: Session ID (for URL consistency)
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          description: Execution ID
          title: Execution Id
        description: Execution ID
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/sessions/{session_id}/executions/{execution_id}/cancel:
    post:
      tags:
      - Agent Execution
      summary: Cancel running execution
      description: Cancel a running agent execution.
      operationId: cancel_execution_api_v1_cases__case_id__sessions__session_id__executions__execution_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          description: Case ID
          title: Case Id
        description: Case ID
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session ID (for URL consistency)
          title: Session Id
        description: Session ID (for URL consistency)
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          description: Execution ID
          title: Execution Id
        description: Execution ID
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Cancel Execution Api V1 Cases  Case Id  Sessions  Session
                  Id  Executions  Execution Id  Cancel Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/config:
    get:
      tags:
      - authentication
      summary: Get Auth Config
      description: "Auth configuration discovery endpoint.\n\nReturns the authentication\
        \ configuration for the current deployment.\nFrontend uses this to determine\
        \ which auth flow to implement.\n\n**Local Mode Response:**\n```json\n{\n\
        \  \"auth_mode\": \"local\",\n  \"login_endpoint\": \"/api/v1/auth/login\"\
        ,\n  \"register_endpoint\": \"/api/v1/auth/register\",\n  \"supports_registration\"\
        : true,\n  \"oauth\": null\n}\n```\n\n**Cloud Mode Response:**\n```json\n\
        {\n  \"auth_mode\": \"oauth\",\n  \"login_endpoint\": null,\n  \"register_endpoint\"\
        : null,\n  \"supports_registration\": false,\n  \"oauth\": {\n    \"authorize_url\"\
        : \"/auth/oauth/authorize\",\n    \"token_url\": \"/auth/oauth/token\",\n\
        \    \"client_id\": \"faultmaven-copilot\",\n    \"scopes\": [\"openid\",\
        \ \"profile\", \"email\", \"cases:read\", \"cases:write\"]\n  }\n}\n```"
      operationId: get_auth_config_api_v1_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
  /api/v1/auth/dev-login:
    post:
      tags:
      - authentication
      summary: Local Login
      description: 'Deprecated: Use /login instead'
      operationId: local_login_api_v1_auth_dev_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /api/v1/auth/login:
    post:
      tags:
      - authentication
      summary: Local Login
      description: 'Internal login implementation for local mode.


        Authenticates users and generates JWT tokens.


        **Important:** Users must be created before login. Use `./faultmaven.sh create-user`

        to create accounts.


        **Flow:**

        1. Validate username format

        2. Find existing user

        3. If user doesn''t exist: Return 401 (user must be created first)

        4. Generate JWT access token

        5. Return token with user profile


        **Security:**

        - Users must exist before login (no auto-creation)

        - JWT tokens (not opaque tokens) for middleware uniformity

        - Input validation and sanitization

        - Proper OAuth2-compatible error responses'
      operationId: local_login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/dev-register:
    post:
      tags:
      - authentication
      summary: Local Register
      description: 'Deprecated: Use /register instead'
      operationId: local_register_api_v1_auth_dev_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /api/v1/auth/register:
    post:
      tags:
      - authentication
      summary: Local Register
      description: 'Local mode registration endpoint.


        Creates a new user account and generates a JWT token.

        Available only when AUTH_MODE=local.


        **Flow:**

        1. Validate username format

        2. Check if user already exists (returns 409 if exists)

        3. Create new user account

        4. Generate JWT access token

        5. Return token with user profile


        **Security:**

        - Prevents duplicate account creation

        - JWT tokens (not opaque tokens) for middleware uniformity

        - Input validation and sanitization

        - Auto-generates email and display name if not provided'
      operationId: local_register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users:
    get:
      tags:
      - authentication
      summary: List Users
      description: List all users. Admin only.
      operationId: list_users_api_v1_auth_users_get
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response List Users Api V1 Auth Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/{username}:
    delete:
      tags:
      - authentication
      summary: Delete User
      description: Delete a user by username. Admin only.
      operationId: delete_user_api_v1_auth_users__username__delete
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Delete User Api V1 Auth Users  Username  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - authentication
      summary: Logout
      description: 'Logout current user


        Revokes the current authentication token. The user will need to login

        again to access protected resources.


        **Flow:**

        1. Validate current authentication

        2. Revoke the current token

        3. Return confirmation'
      operationId: logout_api_v1_auth_logout_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - authentication
      summary: Get Current User Profile
      description: 'Get current user profile


        Returns detailed information about the currently authenticated user,

        including profile data and token statistics.'
      operationId: get_current_user_profile_api_v1_auth_me_get
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me/available-scopes:
    get:
      tags:
      - authentication
      summary: Get Available Scopes
      description: "Return KB scopes the calling user can target when publishing.\n\
        \nGated by the user's actual memberships, not AUTH_MODE \u2014 the picker\n\
        should omit any scope that would produce an unresolvable runbook\n(e.g. TEAM\
        \ when the user has no team membership).\n\nAlways returned: ``personal``,\
        \ ``global`` (GLOBAL write is admin-gated\nby the publish endpoint, not by\
        \ this picker). ``team`` is added when\nthe user has any team membership;\
        \ ``organization`` is added when the\nuser's org has 2+ members or the user\
        \ is an org owner/admin."
      operationId: get_available_scopes_api_v1_auth_me_available_scopes_get
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableScopesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/health:
    get:
      tags:
      - authentication
      summary: Auth Health Check
      description: 'Authentication system health check


        Returns the status of authentication services including token management

        and user storage systems.'
      operationId: auth_health_check_api_v1_auth_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/users/{user_id}/revoke-tokens:
    post:
      tags:
      - authentication
      summary: Revoke User Tokens
      description: Revoke all tokens for a user. Admin only.
      operationId: revoke_user_tokens_api_v1_auth_users__user_id__revoke_tokens_post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/snapshot/{turn_number}:
    get:
      tags:
      - cases
      - replay
      summary: Get case snapshot at specific turn
      description: 'Get the full state of a case at a specific turn number.


        This is a read-only operation that reconstructs the case from the checkpoint.'
      operationId: get_case_snapshot
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: turn_number
        in: path
        required: true
        schema:
          type: integer
          title: Turn Number
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}/diff:
    get:
      tags:
      - cases
      - replay
      summary: Diff two case states
      description: 'Compute the semantic difference between two turns of a case.


        Returns a dictionary describing added, removed, and modified fields.'
      operationId: diff_case_turns
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: from
        in: query
        required: true
        schema:
          type: integer
          description: Start turn number
          title: From
        description: Start turn number
      - name: to
        in: query
        required: true
        schema:
          type: integer
          description: End turn number
          title: To
        description: End turn number
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Diff Case Turns
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases/{case_id}:
    delete:
      tags:
      - cases
      summary: Delete Case
      description: 'Permanently delete a case and all associated data.


        This endpoint provides hard delete functionality. Once deleted,

        the case and all associated data are permanently removed.


        The operation is idempotent - subsequent requests will return

        204 No Content even if the case has already been deleted.


        Returns 204 No Content on success.'
      operationId: delete_case_api_v1_cases__case_id__delete
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Case deleted successfully
          headers:
            X-Correlation-ID:
              description: Request correlation ID
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - cases
      summary: Get Case
      description: 'Get a specific case by ID (v2.0 milestone-based)


        Returns full case details with milestone progress, investigation stage,

        and completion percentage.'
      operationId: get_case_api_v1_cases__case_id__get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - cases
      summary: Update Case
      description: 'Update case details


        Updates case metadata such as title, description, status, priority, and tags.

        Requires edit permissions on the case.'
      operationId: update_case_api_v1_cases__case_id__put
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cases:
    post:
      tags:
      - cases
      summary: Create Case
      description: 'Create a new troubleshooting case (v2.0 milestone-based)


        Creates a new case with milestone-based investigation tracking.

        Initial status is INQUIRY (problem definition phase).


        Returns CaseSummary with basic case info and milestone progress.'
      operationId: create_case_api_v1_cases_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - cases
      summary: List Cases
      description: 'List user''s cases with pagination (v2.0 milestone-based)


        Returns CaseListResponse with:

        - List of CaseSummary objects (with milestone progress)

        - Total count for pagination

        - has_more flag


        Default Filtering Behavior:

        - INCLUDES empty cases (current_turn == 0) - newly created cases are visible

        - INCLUDES closed/resolved cases (frontend categorizes by status)

        - Use include_empty=false to hide cases with no conversation yet

        - Use status filter to further refine results'
      operationId: list_cases_api_v1_cases_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CaseState'
          - type: 'null'
          description: Filter by state
          title: State
        description: Filter by state
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 50
          title: Limit
        description: Items per page
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip
