      title: InvestigationProgressSummary
      description: "Progress metrics for INVESTIGATING phase.\n\nPurely descriptive\
        \ \u2014 all backward-looking facts, no speculative\nforward-looking predictions.\
        \ The frontend derives \"what's next\"\nfrom current_stage if needed."
    InvestigationSessionResponse:
