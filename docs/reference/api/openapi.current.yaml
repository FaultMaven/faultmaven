    NeedPriority:
      type: string
      enum:
      - high
      - medium
      - low
      title: NeedPriority
      description: 'Priority hint for surfacing needs as EVIDENCE-type suggestions.


        High-priority unfulfilled needs are surfaced first; medium and low

        are deferred until higher priorities are addressed. Priority is an

        LLM hint, not a hard ordering.'
    NeedPurpose:
      type: string
      enum:
      - symptom_verification
      - causal_verification
      title: NeedPurpose
      description: "Why this need was created \u2014 maps to evidence categories.\n\
        \nA symptom_verification need produces SYMPTOM_EVIDENCE (presence)\ninitially\
        \ and SYMPTOM_ABSENCE_EVIDENCE (absence) on re-check after\nmitigation/solution.\
        \ A causal_verification need produces\nCAUSAL_EVIDENCE (presence) initially\
        \ and CAUSAL_ABSENCE_EVIDENCE\n(absence) on re-check after solution.\n\nThe\
        \ same need produces multiple evidence rows of different\ncategories across\
        \ the case's lifetime; the need's state stays\nFULFILLED once fulfilled \u2014\
        \ re-check evidence is appended via\n``fulfilling_evidence_ids``, it does\
        \ not reset the state."
    NeedState:
      type: string
      enum:
      - pending
      - partially_met
      - fulfilled
      - superseded
      title: NeedState
      description: "Lifecycle states of an evidence need.\n\nPENDING        \u2014\
        \ Need identified, no evidence yet.\nPARTIALLY_MET  \u2014 Some evidence collected\
        \ but insufficient.\nFULFILLED      \u2014 Sufficient evidence collected (terminal-positive).\n\
        SUPERSEDED     \u2014 No longer relevant (terminal-negative). Either all\n\
        \                 motivating hypotheses retired (engine rule) or LLM\n   \
        \              judged irrelevant (LLM update emission).\n\nFULFILLED and SUPERSEDED\
        \ are terminal \u2014 a need cannot resurrect from\nSUPERSEDED. If the LLM\
        \ later concludes the underlying data is\nrelevant again, it must create a\
        \ new need."
