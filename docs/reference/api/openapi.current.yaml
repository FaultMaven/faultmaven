      - created_at
      - updated_at
      title: InvestigationSessionResponse
      description: Response model for investigation session.
    InvestigationStage:
      type: string
      enum:
      - diagnosis
      - mitigation
      - treatment
      title: InvestigationStage
      description: "Investigation stage within the Investigating Phase.\n\n2-stage\
        \ model with mitigation detour:\n- DIAGNOSIS: Understand, diagnose, propose\
        \ actions (core stage)\n- TREATMENT: Verify permanent fix, resolve case (core\
        \ stage)\n- MITIGATION: Apply and verify temporary fix (optional detour)\n\
        \nDIAGNOSIS and TREATMENT are the two core stages every investigation\npasses\
        \ through. MITIGATION is an optional detour that temporarily\nnarrows focus\
        \ to \"stop the bleeding\" before returning to DIAGNOSIS.\n\nComputed from\
        \ stage-gate milestones. Stage transitions are\ninference-based \u2014 user\
        \ compliance with proposed actions triggers\ntransitions via compliance detection.\
        \ The stage determines which\nprompt template the LLM receives.\n\nInvestigation\
        \ Paths:\n- ROOT_CAUSE: DIAGNOSIS \u2192 TREATMENT\n- MITIGATION_FIRST: DIAGNOSIS\
        \ \u2192 MITIGATION (detour) \u2192 DIAGNOSIS \u2192 TREATMENT"
    InvestigationStrategy:
      type: string
      enum:
      - active_incident
      - post_mortem
      title: InvestigationStrategy
      description: 'Investigation approach mode.

