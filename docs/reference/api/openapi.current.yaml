      type: object
      required:
      - target_user_id
      title: Body_share_case_api_v1_cases__case_id__share_post
    Body_submit_turn_api_v1_cases__case_id__turns_post:
      properties:
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
        files:
          items:
            type: string
            format: binary
          type: array
          title: Files
          default: []
        pasted_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Pasted Content
        intent_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent Type
        intent_data:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent Data
        input_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Type
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
