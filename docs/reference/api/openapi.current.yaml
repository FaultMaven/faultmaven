            \ with the default 'click to confirm' UX.\n- ``needs_info`` \u2014 disposition\
            \ is allowed but the case is partial; user must ADD information (root\
            \ cause / solution) before transitioning. UX: prompt the user for the\
            \ missing data. Currently only the Resolve side surfaces this.\n- ``suggests_alternative``\
            \ \u2014 disposition is allowed but the system recommends the OTHER disposition\
            \ for this case. UX: warn and offer the alternative; if the user confirms\
            \ anyway, proceed. Distinct from ``needs_info`` \u2014 no data is missing;\
            \ the user is asked to RE-DIRECT, not to add. Currently only the Close\
            \ side surfaces this (when the case has root cause + solution \u2192 resolving\
            \ preserves attribution).\n- ``not_eligible`` \u2014 disposition is not\
            \ available; hide the affordance entirely.\n\nDifferent from ``valid_next_states``\
            \ \u2014 that field is the structural action graph (which edges exist),\
            \ this field is the content-readiness layer on top."
        problem_statement:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Problem Statement
          description: Confirmed problem statement carried over from INQUIRY (sourced
            from case.description).
        path_selection:
          anyOf:
          - $ref: '#/components/schemas/PathSelection'
          - type: 'null'
          description: Investigation path that was followed. Lets the terminal UI
            display 'Mitigation-first' or 'Root-cause' retrospectively, and exposes
            mitigation_completed_at_turn for resolved cases that detoured through
            MITIGATION.
        root_cause:
          $ref: '#/components/schemas/RootCauseSummary'
          description: What caused the problem
        solution_applied:
          $ref: '#/components/schemas/SolutionSummary'
          description: Solution that fixed the problem
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
          description: How solution effectiveness was verified
        resolution_summary:
          $ref: '#/components/schemas/ResolutionSummary'
          description: Overall resolution metrics and insights
        reports_available:
          items:
            $ref: '#/components/schemas/ReportAvailability'
          type: array
          title: Reports Available
          description: Available reports (incident report, post-mortem, runbook)
