      - format
      title: GeneratedDocument
      description: A generated document artifact.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hypothesis:
      properties:
        hypothesis_id:
          type: string
          pattern: ^hyp_[a-f0-9]{12}$
          title: Hypothesis Id
          description: Unique hypothesis identifier
        statement:
          type: string
          maxLength: 500
          minLength: 1
          title: Statement
          description: Hypothesis statement (what we think caused the problem)
        category:
          $ref: '#/components/schemas/HypothesisCategory'
          description: Hypothesis category (for anchoring detection)
        state:
          $ref: '#/components/schemas/HypothesisState'
          description: Current hypothesis state
          default: captured
        likelihood:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Likelihood
          description: Estimated likelihood this hypothesis is correct (0.0-1.0)
          default: 0.5
        initial_likelihood:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Initial Likelihood
          description: Original likelihood when hypothesis was generated
          default: 0.5
        evidence_links:
          items:
            $ref: '#/components/schemas/HypothesisEvidenceLink'
          type: array
          title: Evidence Links
          description: "\n        Relationship rows from the hypothesis_evidence junction\
            \ table.\n\n        ONE evidence can:\n        - SUPPORTS hypothesis A\n\
            \        - REFUTES hypothesis B\n        - Be NEUTRAL to hypothesis C\n\
            \n        Each list entry binds (hypothesis_id, evidence_id, stance, reasoning,\n\
            \        stance_confidence). LLM evaluates each evidence against ALL active\n\
            \        hypotheses after submission.\n        "
        generated_at_turn:
          type: integer
          minimum: 0.0
          title: Generated At Turn
          description: Turn number when hypothesis was generated
        last_updated_turn:
          type: integer
          minimum: 0.0
          title: Last Updated Turn
          description: Turn number when hypothesis was last updated
          default: 0
        last_progress_at_turn:
          type: integer
          minimum: 0.0
          title: Last Progress At Turn
          description: Turn number when hypothesis last showed progress
          default: 0
        iterations_without_progress:
          type: integer
          minimum: 0.0
          title: Iterations Without Progress
          description: Count of consecutive iterations without progress
          default: 0
        generation_mode:
          $ref: '#/components/schemas/HypothesisGenerationMode'
        retirement_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Retirement Reason
          description: Reason if hypothesis was retired
        refutation_reason:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Refutation Reason
          description: "Evidence or reasoning that disproves the hypothesis. REQUIRED\
            \ when state=REFUTED (enforced via model validator). Not used for other\
            \ statuses. state=REFUTED and refutation_reason travel together \u2014\
            \ an update carrying one without the other is rejected at the orchestration\
            \ layer."
        rationale:
          type: string
          maxLength: 1000
          title: Rationale
          description: Why this hypothesis was generated
        tested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Tested At
          description: When hypothesis testing began
        concluded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Concluded At
          description: When hypothesis was validated/refuted/retired
      type: object
      required:
      - statement
      - category
      - generated_at_turn
      - generation_mode
      - rationale
      title: Hypothesis
      description: 'Hypothesis for systematic root cause exploration.


        Philosophy: Hypotheses are OPTIONAL. Agent may:

        - Identify root cause directly from evidence (no hypotheses)

        - OR generate hypotheses for systematic testing (when unclear)'
    HypothesisCategory:
      type: string
      enum:
      - code
      - config
      - environment
      - network
      - data
      - database
      - hardware
      - security
      - external
      - human
      - other
      title: HypothesisCategory
      description: 'Hypothesis categories for anchoring detection.


        If agent tests 4+ hypotheses in same category without validation,

        it is "anchored" and should try different category.'
    HypothesisEvidenceLink:
      properties:
        hypothesis_id:
          type: string
          title: Hypothesis Id
          description: Hypothesis being evaluated
        evidence_id:
          type: string
          title: Evidence Id
          description: Evidence being evaluated
        stance:
          $ref: '#/components/schemas/EvidenceStance'
          description: How this evidence relates to THIS hypothesis (including IRRELEVANT)
        reasoning:
          type: string
          maxLength: 1000
          title: Reasoning
          description: LLM's explanation of the relationship
        stance_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Stance Confidence
          description: Confidence in the stance assessment (0.0-1.0). Use for granularity
            instead of STRONGLY_ variants.
        analyzed_at:
          type: string
          format: date-time
          title: Analyzed At
          description: When this relationship was established
      type: object
      required:
      - hypothesis_id
      - evidence_id
      - stance
      - reasoning
      - stance_confidence
      title: HypothesisEvidenceLink
      description: 'Many-to-many relationship between hypothesis and evidence.


        ONE evidence can have DIFFERENT stances for DIFFERENT hypotheses:

        - Evidence "Pool at 95%" -> STRONGLY_SUPPORTS "pool exhausted" hypothesis

        - Evidence "Pool at 95%" -> REFUTES "network latency" hypothesis

        - Evidence "Pool at 95%" -> IRRELEVANT to "memory leak" hypothesis


        Stored in hypothesis_evidence junction table.

        LLM evaluates evidence against ALL active hypotheses after submission.'
    HypothesisGenerationMode:
      type: string
      enum:
      - opportunistic
      - systematic
      - forced_alternative
      title: HypothesisGenerationMode
      description: How hypothesis was generated
    HypothesisState:
      type: string
      enum:
      - captured
      - active
      - validated
      - refuted
      - inconclusive
      - retired
      title: HypothesisState
      description: Hypothesis lifecycle state
    HypothesisSummary:
      properties:
        hypothesis_id:
          type: string
          title: Hypothesis Id
          description: Hypothesis identifier
        text:
          type: string
          maxLength: 500
          title: Text
          description: Hypothesis statement
        likelihood:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Likelihood
          description: Likelihood score (0.0-1.0)
        state:
          $ref: '#/components/schemas/HypothesisState'
          description: 'Status: CAPTURED | ACTIVE | VALIDATED | REFUTED | INCONCLUSIVE
            | RETIRED'
        evidence_count:
          type: integer
          minimum: 0.0
          title: Evidence Count
          description: Number of evidence items related to this hypothesis
        refutation_reason:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Refutation Reason
          description: Reason the hypothesis was refuted. Populated only when status=REFUTED;
            None otherwise. Mirrors the domain model's pair-integrity invariant.
      type: object
      required:
      - hypothesis_id
      - text
      - likelihood
      - state
      - evidence_count
      title: HypothesisSummary
      description: Summary of a hypothesis for INVESTIGATING phase UI.
    ImpactData:
      properties:
