          - type: 'null'
          description: Source file this evidence was derived from. NULL only when
            the evidence is a verbatim quote extracted from the user's chat message
            (source_type=USER_DESCRIPTION).
        related_hypotheses:
          items:
            $ref: '#/components/schemas/RelatedHypothesis'
          type: array
          title: Related Hypotheses
        extract:
          anyOf:
