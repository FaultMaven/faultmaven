          title: Extract
          description: Optional verbatim quote backing the summary. NULL when the
            LLM omitted it (the summary is self-contained).
        analysis:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis
      type: object
      required:
      - evidence_id
      - case_id
      - summary
      - category
      - primary_purpose
      - collected_at_turn
      - collected_at
      - collected_by
