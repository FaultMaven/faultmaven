            ID)
        summary:
          type: string
          maxLength: 500
          minLength: 1
          title: Summary
          description: "Short label (\u2264500 chars) the LLM wrote when declaring\
            \ this evidence via ``evidence_to_add``. ALWAYS present \u2014 use it\
            \ for UI list views, headers, and quick scanning. The optional ``extract``\
            \ field carries the verbatim slice that supports the summary."
        extract:
          anyOf:
          - type: string
          - type: 'null'
          title: Extract
          description: "Optional verbatim quote that supports the ``summary``. The\
            \ LLM populates this when grounding the finding in a specific system-output\
            \ slice (a log line, a metric reading, a config snippet). Distinct from\
            \ ``summary`` (short label) and from ``uploaded_files.storage_ref`` (file\
            \ pointer). May be NULL when the summary is self-contained. File-level\
            \ preprocessing artifacts (structural index, file summary) live on ``uploaded_files``,\
            \ never here \u2014 this field is for claim-relevant quotes only."
        analysis:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Analysis
          description: Agent analysis of this evidence and its significance to the
            investigation
        processing_mode:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Processing Mode
          description: 'Processing mode: triage | directed_analysis | semantic_search'
        source_type:
          $ref: '#/components/schemas/EvidenceSourceType'
          description: Type of evidence source
        source_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File Id
          description: "FK to the UploadedFile this extract came from. Required unless\
            \ ``source_type=USER_DESCRIPTION`` (the narrow case where the LLM extracted\
            \ a verbatim system-output quote from the user's short chat message \u2014\
            \ no file involved). Enforced by the ``evidence_source_invariant`` CHECK\
            \ constraint at the DB level and by the ``_source_requires_file_unless_user_description``\
            \ validator at the Pydantic level."
        is_primary:
          type: boolean
          title: Is Primary
          description: True for the principal evidence row in this case (the one that
            anchors the investigation summary). list_evidence_tool uses this for surface-level
            dashboards.
          default: false
        reliability_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Reliability Score
          description: LLM-assessed reliability of this evidence (0.0-1.0). NULL when
            the agent has not scored the evidence.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Free-form tag list for evidence classification. Tag values
            must not contain commas (the SQLite serializer uses comma-separation;
            the comma-ban keeps round-trip lossless).
        vectorized:
          type: boolean
          title: Vectorized
          description: Whether this evidence's structural index has been persisted
            into the case vector store. Set to True by the investigation engine after
            a successful vectorize_file run; persisted across turns so proactive and
            reactive vectorization paths skip already-indexed evidence instead of
            re-embedding on every turn.
          default: false
        advances_milestones:
          items:
            type: string
          type: array
          title: Advances Milestones
          description: Which milestones this evidence helped complete
        collected_at:
          type: string
          format: date-time
          title: Collected At
          description: When evidence was collected
        collected_by:
          type: string
          title: Collected By
          description: 'Who collected: user_id or ''system'' for automated collection'
        collected_at_turn:
          type: integer
          minimum: 0.0
          title: Collected At Turn
          description: Turn number when evidence was collected
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          title: Metadata
          description: "Structured diagnostic metadata from the preprocessing pipeline.\
            \ Top-level keys are namespaced \u2014 see docs/architecture/data-and-storage/schemas/case-schema.md\
            \ \xA74.3 'evidence.metadata JSON contract'. Canonical shape in faultmaven/core/preprocessing/evidence_metadata.py::EvidenceMetadata.\
            \ Optional \u2014 chat-quoted Evidence rows have no preprocessing trace."
        coverage_start_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Coverage Start Ts
          description: Earliest timestamp parsed from the evidence's content. None
            when the content has no parseable timestamps.
        coverage_end_ts:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Coverage End Ts
          description: Latest timestamp parsed from the evidence's content. None when
            the content has no parseable timestamps.
      type: object
      required:
      - category
      - primary_purpose
      - summary
      - source_type
      - collected_by
      - collected_at_turn
      title: Evidence
      description: "A claim-anchored extract recorded during INVESTIGATING.\n\nPost-010\
        \ single creation path: every Evidence row originates as an\n``EvidenceToAdd``\
        \ entry the LLM declared on a specific turn. The LLM\nchooses the ``category``\
        \ from the four claim-anchored values and the\n``source_type`` from ``EvidenceSourceType``.\
        \ The system only infers\n``advances_milestones`` (Tier 2 inference via ``CATEGORY_MILESTONE_MAP``),\n\
        and only when the LLM has not already overridden it (Tier 3).\n\nLLM declares:\
        \ summary, extract (optional), category, source_type,\n    source_file_id\
        \ (required unless source_type=USER_DESCRIPTION),\n    likelihood, optionally\
        \ advances_milestones\nLLM evaluates: stance per hypothesis (creates hypothesis_evidence\
        \ links)\nSystem fills: evidence_id, collected_at_turn, collected_by,\n  \
        \  coverage timestamps (parsed from extract), advances_milestones (Tier 2)"
    EvidenceCategory:
      type: string
      enum:
      - symptom_evidence
      - causal_evidence
      - mitigation_evidence
      - solution_evidence
      - symptom_absence_evidence
      - causal_absence_evidence
      title: EvidenceCategory
      description: "Evidence classification by investigation purpose.\n\nSix claim-attached\
        \ categories: the presence/absence verification\nquartet (``symptom_evidence``,\
        \ ``causal_evidence``,\n``symptom_absence_evidence``, ``causal_absence_evidence``)\
        \ plus two\nlegacy stage-completion categories (``mitigation_evidence``,\n\
        ``solution_evidence``) retained from the post-010 model and slated\nfor removal\
        \ once prompts stop emitting them. Every row is the LLM's\ndeliberate decision\
        \ to record a specific extract as evidence for a\nspecific claim, created\
        \ only during INVESTIGATING. Contextual data\nlives on ``uploaded_files``\
        \ \u2014 no evidence row is needed until the\nagent extracts a claim-relevant\
        \ slice. Rejection is expressed as the\nabsence of an evidence row; hypothesis-level\
        \ refutation lives on\n``hypothesis_evidence.stance``."
    EvidenceDetailsResponse:
      properties:
        evidence_id:
          type: string
          title: Evidence Id
        case_id:
          type: string
          title: Case Id
        summary:
          type: string
          maxLength: 500
          title: Summary
        category:
          type: string
          title: Category
        primary_purpose:
          type: string
          title: Primary Purpose
        collected_at_turn:
          type: integer
          title: Collected At Turn
        collected_at:
          type: string
          format: date-time
          title: Collected At
        collected_by:
