    patch:
      tags:
      - cases
      summary: Reclassify Evidence
      description: "Reclassify an existing evidence row under a user-specified data\
        \ type.\n\nPhase 1.5 \u2014 the escape hatch for \"the classifier was confidently\n\
        wrong\". Re-runs the preprocessing pipeline on the stored raw file\nwith ``user_override=data_type``,\
        \ overwrites the evidence's\nstructural index, and appends to its extractor.attempts\
        \ history.\n\nGated by ``FAULTMAVEN_RECLASSIFY_ENABLED``. Returns 404 when\
        \ the\nflag is off so the endpoint is invisible in production by default.\n\
        \nError responses (dispatched by ``api/exception_handlers.py``):\n\n- ``404``\
        \ \u2014 feature disabled, case not found, or evidence not in case\n  (``NotFoundError``).\n\
        - ``409`` \u2014 evidence has no backing file (``ConflictError`` with\n  ``conflict_reason=\"\
        no_backing_file\"``).\n- ``403`` \u2014 caller does not own the case (``AuthorizationError``).\n\
        - ``422`` \u2014 invalid or missing ``data_type`` (``ValidationException``).\n\
        - ``500`` \u2014 storage/preprocessing failure (``ServiceException``)."
      operationId: reclassify_evidence_api_v1_cases__case_id__evidence__evidence_id__classification_patch
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
          title: Evidence Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Request body: {''data_type'': ''<DataType value>''}. The
                data_type must be one of the enum values in faultmaven.models.api.DataType
                (e.g. ''logs_and_errors'', ''structured_config'').'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
