      - created_at_turn
      title: EvidenceNeed
      description: "A verification requirement on a case.\n\nEach need represents\
        \ \"data that would advance the investigation.\"\nNeeds live in a flat pool\
        \ on the case \u2014 not anchored to specific\nhypotheses. ``motivating_hypothesis_ids``\
        \ records *why* the need\nexists (which hypotheses motivated creating it)\
        \ for context and\nfor the engine's retirement-supersession rule, but is not\
        \ a hard\nownership association.\n\nLifecycle (see evidence-needs-design.md\
        \ \xA77):\n\n- Created by the LLM via ``EvidenceNeedUpdate`` emissions at\n\
        \  problem-statement confirmation (symptom needs) and at hypothesis\n  creation\
        \ (causal needs).\n- Updated by the LLM as evidence arrives (state, fulfilling\n\
        \  evidence linkage, motivating hypothesis IDs).\n- Auto-superseded by the\
        \ engine on hypothesis retirement when the\n  motivating list becomes empty\
        \ AND purpose is CAUSAL_VERIFICATION\n  AND status is not FULFILLED. Symptom\
        \ needs (empty motivating\n  list by design) are exempt \u2014 they're motivated\
        \ by the problem\n  statement, not by a hypothesis."
    EvidenceSourceType:
      type: string
      enum:
      - logs
      - metrics
      - configuration
      - code
      - text
      - image
      - user_description
      title: EvidenceSourceType
      description: 'Fundamental type of data source.


        Aligned with the data classifier (Tier 0); each value names what kind

        of data the Evidence row''s source is. ``USER_DESCRIPTION`` is the

        chat-quote case where the source is a verbatim system-output quote

        embedded in the user''s message, not a file.'
    EvidenceStance:
      type: string
      enum:
      - supports
      - neutral
      - refutes
      title: EvidenceStance
      description: 'How evidence relates to a hypothesis.

        Evaluated by LLM after evidence submission against ALL active hypotheses.

        One evidence can have different stances for different hypotheses.'
    EvidenceSummary:
      properties:
        evidence_id:
          type: string
          title: Evidence Id
          description: Evidence identifier
        type:
          type: string
          maxLength: 100
          title: Type
          description: 'Evidence type: log_file | metrics_data | config_file | etc.'
        summary:
          type: string
          maxLength: 500
          title: Summary
          description: Brief summary of evidence content
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: When evidence was collected
        relevance_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Relevance Score
          description: Relevance to current investigation (0.0-1.0)
        collected_at_turn:
          type: integer
          minimum: 0.0
          title: Collected At Turn
          description: Turn number when evidence was collected
          default: 0
        category:
          type: string
          maxLength: 50
          title: Category
          description: 'Evidence purpose: SYMPTOM_EVIDENCE | CAUSAL_EVIDENCE | RESOLUTION_EVIDENCE
            | OTHER'
          default: OTHER
        source_filename:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Source Filename
          description: Original filename of the source file, if evidence originated
            from an attachment.
