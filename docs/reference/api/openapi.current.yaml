        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - file
      - title
      - document_type
      title: Body_upload_document_api_v1_knowledge_documents_post
    Case:
      properties:
        case_id:
          type: string
          maxLength: 17
          minLength: 17
          pattern: ^case_[a-f0-9]{12}$
          title: Case Id
          description: Unique case identifier
        user_id:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: User Id
          description: User who created the case. NULL after the originating user
            is deleted (FK SET NULL). Required to be non-empty at creation time; creation
            logic enforces this separately from Pydantic validation.
        organization_id:
          type: string
          maxLength: 36
          minLength: 1
          title: Organization Id
          description: Organization this case belongs to
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
          description: Short case title for list views and headers (e.g., 'API Performance
            Issue')
        description:
          type: string
          maxLength: 2000
          title: Description
          description: "\n        Confirmed problem description - canonical, user-facing,\
            \ displayed prominently in UI.\n\n        Lifecycle:\n        1. Empty\
            \ initially during INQUIRY (while agent formalizes problem)\n        2.\
            \ Set when user confirms proposed_problem_statement and decides to investigate\n\
            \        3. Immutable after status becomes INVESTIGATING (provides stable\
            \ reference)\n        4. Used for UI display, search, and documentation\n\
            \n        Example: \"API experiencing slowness with 30% of requests taking\
            \ >5s response time\n                  across all US regions, started\
            \ 2 hours ago coinciding with v2.1.3 deployment\"\n        "
          default: ''
        state:
          $ref: '#/components/schemas/CaseState'
          description: Current lifecycle state (phase or disposition)
          default: inquiry
        action_history:
          items:
            $ref: '#/components/schemas/CaseAction'
          type: array
          title: Action History
          description: Complete history of case actions (phase transitions and dispositions)
        closure_reason:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Closure Reason
          description: 'Why case was closed: resolved | abandoned | escalated | inquiry_only
            | duplicate | other'
        disposition_eligibility:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Disposition Eligibility
          description: 'Per-disposition eligibility view for the case-action dropdown.
            Denormalized read view maintained at the single chokepoint ``CaseRepository.save()``
            via ``derive_disposition_eligibility``. Shape: ``{''resolved'': str, ''closed'':
            str}`` where each value is one of ``ready`` / ``needs_info`` / ``not_eligible``.
            Frontend uses this to gate Resolve/Close affordances on the current case
            content, not just the structural action graph. Always populated for persisted
            cases; may be None on in-memory Case objects before the first save.'
        pending_transition:
          anyOf:
          - type: object
          - type: 'null'
          title: Pending Transition
          description: "\n        Pending status transition awaiting user confirmation\
            \ (User-Agent Handshake pattern).\n\n        Used for terminal transitions\
            \ that require explicit user confirmation:\n        - to_state: Target\
            \ status (str)\n        - reason: Why transition is being proposed (str)\n\
            \        - summary: Agent's explanation to user (str)\n        - evidence_ids:\
            \ Supporting evidence (List[str])\n        - proposed_at: When transition\
            \ was proposed (str ISO datetime)\n        - proposed_by: Who proposed\
            \ it (\"agent\" | \"user\" | user_id)\n\n        Cleared after transition\
            \ executes or is cancelled.\n        "
        last_suggestions:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Last Suggestions
          description: COOPERATIVE suggestions with intent metadata from the last
            agent turn. Used by the intent resolver to match typed responses against
            offered choices. Updated after each turn; only suggestions carrying intent
            metadata are stored.
        kb_context:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Kb Context
          description: "Deterministic KB pre-fetch results injected at key transitions.\
            \ Populated at INQUIRY\u2192INVESTIGATING (symptom search) and when root_cause_identified\
            \ completes (remediation search). Included in the LLM context as historical\
            \ suggestions, not absolute truths."
        progress:
          $ref: '#/components/schemas/InvestigationProgress'
          description: Milestone-based progress tracking
        current_turn:
          type: integer
          minimum: 0.0
          title: Current Turn
          description: Current turn number (increments with each user-agent exchange)
          default: 0
        turns_without_progress:
          type: integer
          minimum: 0.0
          title: Turns Without Progress
          description: Consecutive turns with no milestone advancement (for stuck
            detection)
          default: 0
        turn_history:
          items:
            $ref: '#/components/schemas/TurnProgress'
          type: array
          title: Turn History
          description: Complete history of all turns
        messages:
          items:
            type: object
          type: array
          title: Messages
          description: "\n        Complete conversation history (user queries + agent\
            \ responses).\n\n        Per case-storage-design.md Section 4.7, each\
            \ message contains:\n        - message_id: str - Unique identifier\n \
            \       - case_id: str - Case this message belongs to\n        - turn_number:\
            \ int - Which turn this message belongs to\n        - role: str - \"user\"\
            \ | \"assistant\" | \"system\"\n        - content: str - The actual message\
            \ text\n        - created_at: datetime - When message was created (ISO\
            \ format)\n        - token_count: Optional[int] - Number of tokens in\
            \ content\n        - metadata: dict - Additional data (sources, tools\
            \ used, etc.)\n\n        NOTE: Does NOT contain session_id (per case-and-session-concepts.md)\n\
            \        Sessions provide authentication only, not message ownership.\n\
            \n        Relationship to turn_history:\n        - messages[i].turn_number\
            \ references turn_history[j].turn_number\n        - Provides the \"what\
            \ was said\" to complement turn_history's \"what happened\"\n        "
        message_count:
          type: integer
          minimum: 0.0
          title: Message Count
          description: Total number of messages (user + agent combined)
          default: 0
        path_selection:
          anyOf:
          - $ref: '#/components/schemas/PathSelection'
          - type: 'null'
          description: Selected investigation path (MITIGATION vs ROOT_CAUSE)
        investigation_strategy:
          $ref: '#/components/schemas/InvestigationStrategy'
          description: 'Investigation approach: ACTIVE_INCIDENT (speed) vs POST_MORTEM
            (thoroughness)'
          default: post_mortem
        inquiry:
          $ref: '#/components/schemas/InquiryData'
          description: Pre-investigation INQUIRY state data
        problem_verification:
          anyOf:
          - $ref: '#/components/schemas/ProblemVerification'
          - type: 'null'
          description: Consolidated verification data (symptom, scope, timeline, changes)
        uploaded_files:
          items:
            $ref: '#/components/schemas/UploadedFile'
          type: array
          title: Uploaded Files
          description: "\n        All files uploaded to this case (raw file metadata).\n\
            \n        Files can be uploaded at ANY phase (INQUIRY or INVESTIGATING).\n\
            \        Evidence is DERIVED from uploaded files after analysis during\
            \ INVESTIGATING phase.\n\n        Difference from evidence:\n        -\
            \ uploaded_files: Raw file metadata (file_id, filename, size, upload time)\n\
            \        - evidence: Investigation data linked to hypotheses (only in\
            \ INVESTIGATING phase)\n        "
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Evidence
          description: All evidence collected during investigation
        evidence_needs:
          items:
            $ref: '#/components/schemas/EvidenceNeed'
          type: array
          title: Evidence Needs
          description: 'Demand-side pool: verification requirements the investigation
            has identified. Created by the LLM at problem-statement confirmation (symptom
            needs) and at hypothesis creation (causal needs). See evidence-needs-design.md.'
