  /api/v1/knowledge/documents/search:
    post:
      tags:
      - knowledge_base
      summary: Fulltext Search Documents
      description: "Full-text search for knowledge base documents (Microservices Parity)\n\
        \nImplements full-text search complementing the semantic search at /knowledge/search.\n\
        This endpoint provides simple keyword-based text matching across document\
        \ titles\nand content, useful when semantic understanding is not required.\n\
        \n**Differences from /knowledge/search:**\n- `/knowledge/search` - Semantic\
        \ vector search using embeddings (similarity-based)\n- `/documents/search`\
        \ - Full-text keyword search (exact/partial word matching)\n\n**Use Cases:**\n\
        - Searching for specific error codes or identifiers\n- Finding documents with\
        \ exact phrases\n- Faster search when semantic understanding not needed\n\
        - Filtering by document_type, category, tags\n\n**Request Body:**\n```json\n\
        {\n    \"query\": \"PostgreSQL connection timeout\",\n    \"document_type\"\
        : \"kb_article\",\n    \"category\": \"database\",\n    \"tags\": \"postgresql,timeout\"\
        ,\n    \"limit\": 20,\n    \"similarity_threshold\": 0.5\n}\n```\n\n**Returns:**\n\
        ```json\n{\n    \"query\": \"...\",\n    \"total_results\": 5,\n    \"results\"\
        : [\n        {\n            \"document_id\": \"...\",\n            \"content\"\
        : \"...\",\n            \"metadata\": {\n                \"title\": \"...\"\
        ,\n                \"document_type\": \"...\",\n                \"category\"\
        : \"...\",\n                \"tags\": [...],\n                \"priority\"\
        : \"...\"\n            },\n            \"similarity_score\": 0.85\n      \
        \  }\n    ]\n}\n```"
      operationId: fulltext_search_documents_api_v1_knowledge_documents_search_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fulltext Search Documents Api V1 Knowledge Documents
                  Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
