  /api/v1/knowledge/documents/{document_id}/snippet:
    get:
      tags:
      - knowledge_base
      summary: Get Document Snippet
      description: "Get a snippet/preview of a knowledge base document for hover cards.\n\
        \nSupports two modes:\n1. **Line-based extraction**: Extract lines from line_start\
        \ to line_end (or max_lines)\n2. **Semantic extraction**: If query_string\
        \ is provided, returns the most relevant\n   snippet based on vector similarity\
        \ (more robust than line numbers after edits)\n\nArgs:\n    document_id: Document\
        \ identifier\n    line_start: Starting line number (1-indexed, default: 1)\n\
        \    line_end: Ending line number (optional, computed from max_lines if not\
        \ provided)\n    max_lines: Maximum lines to return (default: 5, max: 50)\n\
        \    query_string: Query for semantic snippet extraction (optional)\n\nReturns:\n\
        \    Document snippet with verification status for badge display"
      operationId: get_document_snippet_api_v1_knowledge_documents__document_id__snippet_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: line_start
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Starting line number
          default: 1
          title: Line Start
        description: Starting line number
      - name: line_end
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Ending line number
          title: Line End
        description: Ending line number
      - name: max_lines
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum lines to return
          default: 5
          title: Max Lines
        description: Maximum lines to return
      - name: query_string
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Query for semantic snippet extraction
          title: Query String
        description: Query for semantic snippet extraction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSnippetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
