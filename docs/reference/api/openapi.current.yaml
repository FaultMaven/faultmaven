      description: "Turn outcome classification.\n\nNOTE: Outcomes are LLM-observable\
        \ only (what happened this turn).\nWorkflow control uses direct metrics (turns_without_progress).\n\
        Outcomes are for analytics and prompt context, not control flow.\n\nEach member\
        \ carries an LLM-facing ``description`` accessible at\nruntime via ``TurnOutcome.MEMBER.description``.\
        \ The prompt block in\n``SCHEMA_INSTRUCTIONS`` is auto-generated from these\
        \ descriptions so\nthere is no second source of truth to drift against \u2014\
        \ adding a value\nhere automatically extends the prompt.\n\nMaintainer-only\
        \ notes (implementation details that should NOT reach\nthe LLM) live as ``#``\
        \ comments next to the value, not in the\ndescription string."
    TurnProgress:
