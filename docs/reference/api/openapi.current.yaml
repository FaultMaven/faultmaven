          minimum: 0.0
          title: Total Evidence
          description: Total evidence items collected
          default: 0
        active_hypotheses:
          type: integer
          minimum: 0.0
          title: Active Hypotheses
          description: Number of hypotheses currently being tested
          default: 0
      type: object
      required:
