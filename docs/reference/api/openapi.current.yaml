          - type: string
          - type: 'null'
          title: Content Hash
          description: SHA-256 of file contents (storage-backend dedup)
        uploaded_at_turn:
          type: integer
          title: Uploaded At Turn
        uploaded_at:
          type: string
          format: date-time
          title: Uploaded At
        upload_source:
          type: string
          title: Upload Source
          description: 'Provenance: file_upload | paste | screenshot | page_capture
            | agent_generated | conversion_source'
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: File-level preprocessing summary, set by the ingestion pipeline.
