[pytest]
# Primary pytest configuration is in pyproject.toml
# This file provides overrides and IDE compatibility

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Default options (coverage configured via --coverage flag in test runner)
# `-m "not real_llm"` excludes real-LLM integration tests from default runs;
# they hit live provider APIs and are opt-in via `pytest -m real_llm` plus
# the appropriate API key in env. See docs/development/testing/standards.md.
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not real_llm"

# Test markers (also defined in pyproject.toml for tooling compatibility)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (cross-layer)
    slow: Slow running tests (excluded from fast CI)
    enterprise: Enterprise tests requiring Redis, PostgreSQL
    security: Security-related tests
    benchmark: Performance benchmarks (baseline tracking)
    performance: Performance overhead tests
    asyncio: Async tests
    api: API endpoint tests
    llm: LLM-related tests
    agent: Agent-related tests
    session: Session management tests
    knowledge_base: Knowledge base tests
    architecture: Architecture validation tests
    phase3: Phase 3 specific validation tests
    real_llm: Real-LLM integration tests (hits live provider API; opt-in via `pytest -m real_llm` and provider API key env var; excluded from default test runs)

# Filter third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
    ignore::UserWarning:pytest_asyncio.*
    ignore::PendingDeprecationWarning
    # Suppress Pydantic V2 deprecation warnings for pydantic-settings env parameter
    # The env parameter is still valid and recommended for pydantic-settings BaseSettings
    ignore:Using extra keyword arguments on `Field` is deprecated.*env.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:`json_encoders` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:`max_items` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Using extra keyword arguments on `Field` is deprecated.*example.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Pydantic V1 style `@validator` validators are deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:The `dict` method is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:coroutine.*was never awaited:RuntimeWarning
    ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning
    ignore:Usage of the 'Session\.(add|merge)\(\)' operation.*:sqlalchemy.exc.SAWarning
    ignore:Duplicate Operation ID.*:UserWarning
    # Keep FaultMaven warnings visible
    default::DeprecationWarning:faultmaven.*
    default::RuntimeWarning:faultmaven.*
