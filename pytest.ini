[pytest]
# The project's one pytest configuration. With this file present pytest ignores
# [tool.pytest.ini_options] in pyproject.toml, which therefore holds none.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Default options (coverage configured via --coverage flag in test runner)
# The real-LLM tests hit live provider APIs and are opt-in: tests/conftest.py
# deselects them unless `-m` names `real_llm` (`pytest -m real_llm`, plus the
# provider's API key in env). Not an `-m` here: pytest keeps only the last `-m`,
# so any `-m` on the command line replaced it (#2288). See
# docs/development/testing/standards.md.
addopts =
    -v
    --tb=short
    --strict-markers

# Test markers. --strict-markers above refuses any marker not declared here.
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (cross-layer)
    slow: Slow running tests (the required Test Standalone/Test Cloud jobs run them; scripts/tests.py --ci skips them)
    cloud: Cloud tests requiring Redis, PostgreSQL
    postgres: Tests that require a real PostgreSQL (skipped unless DATABASE_URL is postgresql)
    security: Security-related tests
    benchmark: Performance benchmarks (baseline tracking)
    performance: Wall-clock tests: tests/performance and the defensive growth checks (excluded from the required jobs; run in benchmarks.yml)
    asyncio: Async tests
    api: API endpoint tests
    llm: LLM-related tests
    agent: Agent-related tests
    session: Session management tests
    knowledge_base: Knowledge base tests
    architecture: Architecture validation tests
    phase3: Phase 3 specific validation tests
    real_llm: Real-LLM integration tests (hits live provider API; opt-in via `pytest -m real_llm` and provider API key env var; excluded from default test runs)

# Warnings are fixed where they arise, not filtered out. Of the `ignore`s this
# block used to carry (websockets, uvicorn, pytest_asyncio, all of
# PendingDeprecationWarning, seven Pydantic V1-API messages, never-awaited
# coroutines and a SQLAlchemy Session warning), a full run with every filter
# overridden matched two, and both were fixed at their source instead: a test
# double whose mock returned an un-awaited coroutine, and websockets' legacy-API
# deprecation, which uvicorn's default WebSocket implementation loaded for an
# app that serves no WebSocket route (`ws="none"` in server.py).
filterwarnings =
    # Any warning raised from this package's code fails the test that reaches
    # it, whatever its class. A dependency's deprecation need not subclass
    # DeprecationWarning: Starlette's StarletteDeprecationWarning is a UserWarning.
    error::Warning:faultmaven.*
    # A coroutine nobody awaited. Matched by message, not module: the warning
    # names the frame that finalized the coroutine, often pytest's own, not the
    # code that made it. Issued during finalization, the error is an exception
    # nothing can catch, which pytest reports only as
    # PytestUnraisableExceptionWarning, raised here in turn. So the error is
    # reported against whichever test is running when the coroutine is
    # collected, not the one that made it; and one collected only at an xdist
    # worker's exit, after its last test, is lost.
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    # Python hides ResourceWarning by default, which is how unclosed files,
    # sockets, event loops and database connections went unseen. Shown, not
    # raised: they surface at garbage collection, often inside a later test, so
    # the run fails on them instead (tests/conftest.py, pytest_sessionfinish).
    # After error::Warning:faultmaven.*: the last matching filter wins, and one
    # collected inside faultmaven code must not fail an unrelated test.
    default::ResourceWarning
    # FastAPI emits this (a bare UserWarning, from fastapi/openapi/utils.py)
    # when two operations derive the same operation id. It means either two
    # handlers registered on the same (method, path) — one of which the router
    # will never reach — or one route declaring several methods, which publishes
    # the same operationId twice and breaks generated clients. Both are defects
    # in the contract this repo publishes, so neither may pass as noise.
    #
    # This line used to read `ignore:Duplicate Operation ID.*:UserWarning`. It
    # was added by d53e5d3a1, in the same commit that gave the duplicated
    # POST /api/v1/sessions/cleanup handlers `operation_id="..._v1"` and
    # `"..._v2"` so the warning would stop firing — the defect then shipped for
    # eight months, with the published contract describing the handler Starlette
    # never served (removed in #1440).
    #
    # The warning is the weaker of the two detectors: it needs the derived
    # operation id to collide, which needs the function names to match, so a
    # rename quiets it. tests/integration/api/test_openapi_documents_auth.py
    # asserts the property directly and does not care what anything is called.
    error:Duplicate Operation ID
