[pytest]
# Pytest configuration for integration tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support - Updated configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Output configuration
# `-m "not real_llm"` excludes real-LLM integration tests from default runs;
# they hit live provider APIs and are opt-in via `pytest -m real_llm`. Mirrors
# the root pytest.ini configuration. See docs/development/testing/standards.md.
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
    -m "not real_llm"

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: Async tests
    real_llm: Real-LLM integration tests (hits live provider API; opt-in via `pytest -m real_llm` and provider API key env var; excluded from default test runs)
    # Declared in the root pytest.ini too, and used by tests under this
    # directory. This file becomes the configfile whenever pytest is invoked
    # with a path inside tests/integration/, and --strict-markers is on, so a
    # marker missing here is a warning (or a failure) that depends on how the
    # suite was invoked rather than on the test.
    security: Security-related tests
    postgres: Tests that require a real PostgreSQL (skipped unless DATABASE_URL is postgresql)
    cloud: Cloud tests requiring Redis, PostgreSQL

# Minimum version
minversion = 6.0

# Filter third-party deprecation warnings while keeping our code warnings visible
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
    ignore::UserWarning:pytest_asyncio.*
    ignore::RuntimeWarning:asyncio.*
    # Suppress asyncio task destruction errors from uvicorn shutdown
    ignore::RuntimeWarning:asyncio.base_events.*
    # Keep our own code warnings visible for debugging
    default::DeprecationWarning:faultmaven.*
    default::RuntimeWarning:faultmaven.*
